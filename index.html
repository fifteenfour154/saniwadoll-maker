                renderSubSlots(); // 渲染子部件窗口
                updateTunePanelUI();
            }

            // 渲染右侧的子部件列表
            function renderSubSlots() {
                const listContainer = document.getElementById('colorSlotList');
                if (!listContainer) return;
                
                const optionId = selected[activeModule];
                if (!optionId) {
                    // 如果没有选中任何部件，只显示主部件
                    listContainer.innerHTML = `<div style="font-size: 12px; color: #b7b7d0; text-align: center; padding: 10px 0; background: rgba(138,127,189,0.1); border-radius: 8px; border: 1px solid rgba(138,127,189,0.2);">主部件</div>`;
                    return;
                }

                // 这里的 imgKey 需要精准匹配
                const imgKey = `${activeModule}_${optionId}`;
                
                let html = '';
                // 主部件按钮
                const isMainActive = activeSubTag === null;
                html += `<div onclick="switchSubTag(null)" style="cursor: pointer; font-size: 12px; text-align: center; padding: 10px 0; border-radius: 8px; border: 1px solid ${isMainActive ? '#b9aaff' : 'rgba(138,127,189,0.2)'}; background: ${isMainActive ? 'rgba(138,127,189,0.3)' : 'rgba(138,127,189,0.1)'}; color: ${isMainActive ? '#fff' : '#b7b7d0'};">主部件</div>`;
                
                // 副部件按钮
                if (subCache[imgKey] && Object.keys(subCache[imgKey]).length > 0) {
                    for (const subTag in subCache[imgKey]) {
                        const isSubActive = activeSubTag === subTag;
                        html += `<div onclick="switchSubTag('${subTag}')" style="cursor: pointer; font-size: 12px; text-align: center; padding: 10px 0; border-radius: 8px; border: 1px solid ${isSubActive ? '#b9aaff' : 'rgba(138,127,189,0.2)'}; background: ${isSubActive ? 'rgba(138,127,189,0.3)' : 'rgba(138,127,189,0.1)'}; color: ${isSubActive ? '#fff' : '#b7b7d0'};">${subTag}</div>`;
                    }
                }
                
                listContainer.innerHTML = html;
            }
            
            // 切换子部件的全局方法
            window.switchSubTag = function(tag) {
                activeSubTag = tag;
                renderSubSlots();
                updateTunePanelUI();
            };

            // 同步发色
            function syncHairColor(sourceModule) {
                if (sourceModule === 'frontHair' || sourceModule === 'backHair' || sourceModule === 'ear') {
                    // 只要改动的是这三个之一，就同步给另外两个
                    const sourceData = colorData[sourceModule];
                    colorData['frontHair'] = { ...sourceData };
                    colorData['backHair'] = { ...sourceData };
                    colorData['ear'] = { ...sourceData };
                }
            }

            // 统一处理所有调色滑条的事件监听，并在拖动时实时保存到当前角色的数据中
            const filterSliders = [
                { el: tintColor, field: 'tint', isInt: false },
                { el: hueSlider, field: 'hue', isInt: true, valEl: hueVal },
                { el: satSlider, field: 'sat', isInt: true, valEl: satVal },
                { el: briSlider, field: 'bri', isInt: true, valEl: briVal }
            ];

            filterSliders.forEach(item => {
                if (!item.el) return;
                
                // 提取统一的更新函数
                const updateColorData = (e) => {
                    const currentTarget = e.target || e.srcElement;
                    if (!currentTarget) return;
                    
                    const val = item.isInt ? parseInt(currentTarget.value) : currentTarget.value;
                    if (isNaN(val) && item.isInt) return;

                    // 判断是改主部件还是副部件
                    if (activeSubTag !== null) {
                        const optionId = selected[activeModule];
                        const imgKey = `${activeModule}_${optionId}`;
                        if (!subColor[imgKey]) subColor[imgKey] = {};
                        if (!subColor[imgKey][activeSubTag]) subColor[imgKey][activeSubTag] = { ...defaultColorObj };
                        
                        // 修改副部件颜色
                        subColor[imgKey][activeSubTag][item.field] = val;
                        
                        // 同步保存到当前角色
                        if (characters[activeCharIndex]) {
                            characters[activeCharIndex].subColor = JSON.parse(JSON.stringify(subColor));
                        }
                    } else {
                        // 修改主部件颜色
                        colorData[activeModule][item.field] = val;
                        syncHairColor(activeModule);
                        
                        // 同步保存到当前角色
                        if (characters[activeCharIndex]) {
                            characters[activeCharIndex].colorData = JSON.parse(JSON.stringify(colorData));
                        }
                    }
                    
                    if (item.valEl) item.valEl.value = val;
                    
                    drawPreview();
                    if (activeModule === 'frontHair' || activeModule === 'backHair') {
                        updateTunePanelUI(); 
                    }
                };

                // 电脑端和现代浏览器
                item.el.addEventListener('input', updateColorData);
                
                // 专门针对 iOS 的补救措施
                if (item.field !== 'tint') {
                    // 很多 iOS 版本在拖动 range 时，只有 touchend 会触发 input
                    // 我们加上 touchmove 并在其中手动调用一次
                    item.el.addEventListener('touchmove', (e) => {
                        // 这里必须用 requestAnimationFrame 节流，否则滑动太快会卡死
                        if (window.requestAnimationFrame) {
                            window.requestAnimationFrame(() => updateColorData(e));
                        } else {
                            updateColorData(e);
                        }
                    }, { passive: true });
                    
                    item.el.addEventListener('touchend', updateColorData);
                } else {
                    // 颜色选择器监听 change
                    item.el.addEventListener('change', updateColorData);
                }

                // 【新增】如果存在数字输入框，监听手动输入
                if (item.valEl) {
                    // 阻止输入框的滚轮改变数值（防止页面滚动时误触）
                    item.valEl.addEventListener('wheel', (e) => e.preventDefault(), { passive: false });
                    
                    item.valEl.addEventListener('input', () => {
                        let val = parseInt(item.valEl.value);
                        const min = parseInt(item.el.min);
                        const max = parseInt(item.el.max);
                        
                        if (isNaN(val)) return; // 如果为空则不处理
                        
                        // 边界限制
                        if (val < min) val = min;
                        if (val > max) val = max;
                        
                        // 更新滑块和颜色
                        item.el.value = val;
                        updateColorData({ target: item.el });
                    });

                    item.valEl.addEventListener('change', () => {
                        // 如果失去焦点时为空，恢复为滑块当前的值
                        if (item.valEl.value === '') {
                            item.valEl.value = item.el.value;
                        }
                    });
                }
            });

            resetBtn.addEventListener('click', () => {
                if (activeSubTag !== null) {
                    // 如果正在调副部件，只重置副部件的颜色
                    const optionId = selected[activeModule];
                    const imgKey = `${activeModule}_${optionId}`;
                    if (subColor[imgKey] && subColor[imgKey][activeSubTag]) {
                        subColor[imgKey][activeSubTag] = { ...defaultColorObj };
                    }
                } else {
                    // 否则重置主部件
                    colorData[activeModule] = { ...defaultColorObj };
                    syncHairColor(activeModule);
                }
                updateTunePanelUI();
                drawPreview();
            });

            // 单行重置：只把当前模块的某一项恢复默认值
            const FIELD_DEFAULTS = { tint: '#ffffff', hue: 0, sat: 100, bri: 100 };
            document.querySelectorAll('.tune-reset').forEach(btn => {
                btn.addEventListener('click', () => {
                    const field = btn.dataset.resetField;
                    
                    if (activeSubTag !== null) {
                        // 重置副部件的单行
                        const optionId = selected[activeModule];
                        const imgKey = `${activeModule}_${optionId}`;
                        if (subColor[imgKey] && subColor[imgKey][activeSubTag]) {
                            subColor[imgKey][activeSubTag][field] = FIELD_DEFAULTS[field];
                        }
                    } else {
                        // 重置主部件的单行
                        colorData[activeModule][field] = FIELD_DEFAULTS[field];
                        syncHairColor(activeModule);
                    }
                    
                    updateTunePanelUI();
                    drawPreview();
                });
            });

            // ---------------- 打包分发包 ----------------
            function packAndExport(isPure = false) {
                // 1. 收集当前所有图片的 base64（包含主部件和副部件）
                const images = {};
                
                // 收集主部件
                for (const key in imageCache) {
                    const img = imageCache[key];
                    if (!img || !img.src) continue;
                    let src = img.src;
                    if (!src.startsWith('data:')) {
                        const tmp = document.createElement('canvas');
                        tmp.width = img.naturalWidth;
                        tmp.height = img.naturalHeight;
                        const tctx = tmp.getContext('2d');
                        tctx.imageSmoothingEnabled = false;
                        tctx.drawImage(img, 0, 0);
                        src = tmp.toDataURL('image/png');
                    }
                    images[key] = { src };
                }
                
                // 收集副部件（将它们命名为 key@subTag，以便打包后还原）
                for (const baseKey in subCache) {
                    for (const subTag in subCache[baseKey]) {
                        const img = subCache[baseKey][subTag];
                        if (!img || !img.src) continue;
                        let src = img.src;
                        if (!src.startsWith('data:')) {
                            const tmp = document.createElement('canvas');
                            tmp.width = img.naturalWidth;
                            tmp.height = img.naturalHeight;
                            const tctx = tmp.getContext('2d');
                            tctx.imageSmoothingEnabled = false;
                            tctx.drawImage(img, 0, 0);
                            src = tmp.toDataURL('image/png');
                        }
                        images[`${baseKey}@${subTag}`] = { src };
                    }
                }

                // WU-34：收集挂载图（将它们命名为 srcKey$targetKey，以便打包后还原）
                for (const tKey in mountCache) {
                    for (const m of mountCache[tKey]) {
                        const img = m.img;
                        if (!img || !img.src) continue;
                        let src = img.src;
                        if (!src.startsWith('data:')) {
                            const tmp = document.createElement('canvas');
                            tmp.width = img.naturalWidth;
                            tmp.height = img.naturalHeight;
                            const tctx = tmp.getContext('2d');
                            tctx.imageSmoothingEnabled = false;
                            tctx.drawImage(img, 0, 0);
                            src = tmp.toDataURL('image/png');
                        }
                        images[`${m.srcKey}$${tKey}`] = { src };
                    }
                }

                // 2. 序列化设置
                const layerOrder = Array.from(document.querySelectorAll('#moduleTabs .tab-btn[data-module]')).map(el => el.dataset.module);
                // 记录所有自定义部件，保证分发包恢复时能认出它们
                const customModules = [];
                document.querySelectorAll('#moduleTabs .tab-btn.custom-module').forEach(el => {
                    const nameEl = el.querySelector('.tab-name');
                    if (el.dataset.module && nameEl) {
                        customModules.push({
                            key: el.dataset.module,
                            name: nameEl.textContent
                        });
                    }
                });

                // 素材显示名称也要打包，否则分发包恢复时只能按编号拼名称，括号里的文字会丢
                const optionsMeta = {};
                for (const moduleKey in dynamicOptions) {
                    optionsMeta[moduleKey] = (dynamicOptions[moduleKey] || []).map(opt => ({
                        id: opt.id,
                        name: opt.name
                    }));
                }

                // 在打包前，把当前正在编辑的数据同步给当前角色，防止漏掉最新操作
                if (characters[activeCharIndex]) {
                    characters[activeCharIndex].selected = { ...selected };
                    characters[activeCharIndex].colorData = JSON.parse(JSON.stringify(colorData));
                    // 【核心修复】把副部件的调色数据也存进去
                    characters[activeCharIndex].subColor = JSON.parse(JSON.stringify(subColor));
                }

                const payload = {
                    images,
                    subColor: JSON.parse(JSON.stringify(subColor)), // 打包副部件的调色数据
                    layerOrder,
                    customModules,
                    optionsMeta,
                    characters: JSON.parse(JSON.stringify(characters)),
                    activeCharIndex: activeCharIndex
                };

                // 3. 安全地取源码，塞入 payload
                // 【核心修复】打包时，先把自定义部件暂时从 DOM 里移出，确保源码纯净
                const container = document.getElementById('moduleTabs');
                const customNodes = Array.from(container.querySelectorAll('.custom-tab-wrapper'));
                customNodes.forEach(node => node.remove());

                // 获取没有自定义部件干扰的纯净 HTML
                let html = document.documentElement.outerHTML;
                
                // 获取完 HTML 后，立刻把部件放回去，不影响当前页面继续使用
                customNodes.forEach(node => container.appendChild(node));

                const placeholder = 'const INJECTED_ASSETS = null;';
                if (!html.includes(placeholder)) {
                    alert('源码里找不到内置变量占位，无法打包。请确认页面没有被压缩或修改。');
                    return;
                }
                html = html.replace(placeholder, `const INJECTED_ASSETS = ${JSON.stringify(payload)};`);

                // ===== 纯净模式：不删标签，而是给标签加内联样式隐藏 =====
                if (isPure) {
                    // 给按钮加上 style="display: none;"
                    html = html.replace(/id="importBtn"/g, 'id="importBtn" style="display: none;"');
                    html = html.replace(/id="packExportBtn"/g, 'id="packExportBtn" style="display: none;"');
                    html = html.replace(/id="addModuleBtn"/g, 'id="addModuleBtn" style="display: none;"');
                    html = html.replace(/id="viewKeysBtn"/g, 'id="viewKeysBtn" style="display: none;"');
                    html = html.replace(/id="namingRuleBtn"/g, 'id="namingRuleBtn" style="display: none;"');
                    html = html.replace(/class="tabs-tip"/g, 'class="tabs-tip" style="display: none;"');
                    
                    // 【新增】隐藏导出素体按钮
                    html = html.replace(/id="exportBodyBtn"/g, 'id="exportBodyBtn" style="display: none;"');
                    
                    // 纯净模式下，左侧列表整体上移，填补按钮空缺
                    html = html.replace(/id="moduleTabs"/g, 'id="moduleTabs" style="top: 10px;"');
                }

                // 4. 下载
                const blob = new Blob([html], { type: 'text/html' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.download = `审神者捏人_分发包_${new Date().getTime()}.html`;
                link.href = url;
                link.click();
                URL.revokeObjectURL(url);
            }

            document.getElementById('packExportBtn').addEventListener('click', () => {
                // 隐藏其他不需要的元素
                document.getElementById('codeInputWrap').style.display = 'none';
                document.getElementById('exportOptionsWrap').style.display = 'none';

                // 显示勾选框
                const checkWrap = document.getElementById('pureModeCheckWrap');
                checkWrap.style.display = 'flex';
                document.getElementById('pureModeCheck').checked = false;

                // 临时隐藏标题栏的“提示”字样
                const modalTitle = document.querySelector('#confirmModal .modal-title');
                if (modalTitle) modalTitle.style.display = 'none';

                // 显示通用确认弹窗
                showConfirm('确定打包分发包吗？\n打包分发包可以使素材内置。', () => {
                    // 获取勾选状态
                    const isPure = document.getElementById('pureModeCheck').checked;
                    packAndExport(isPure);
                    
                    // 关闭弹窗并隐藏勾选框
                    checkWrap.style.display = 'none';
                    document.getElementById('confirmModal').classList.remove('show');
                    if (modalTitle) modalTitle.style.display = 'block'; // 恢复
                }, () => {
                    // 如果用户点取消，也把勾选框隐藏掉
                    checkWrap.style.display = 'none';
                    if (modalTitle) modalTitle.style.display = 'block'; // 恢复
                });
            });

            // ---------------- 导入与解析 ----------------
            document.getElementById('importBtn').addEventListener('click', () => {
                document.getElementById('folderInput').click();
            });

            function handleFiles(files) {
                // 【核心修复】移除清空图库的代码，改为合并模式
                // for (let key in dynamicOptions) dynamicOptions[key] = [];
                // for (let key in selected) selected[key] = null;
                // for (let key in thumbCache) delete thumbCache[key];

                let loadedCount = 0;
                const uniqueIds = new Set();
                
                // 收集未匹配到任何部件的 key 及对应文件，供新建后自动补入
                const unmatchedKeys = new Set();
                const unmatchedFiles = {};
                // 收集命名格式错误的文件名
                const invalidFiles = [];
                // WU-34 补修：收集格式不符合规范的文件（用于统一报错）
                const formatErrorFiles = [];
                // 只有所有检查都过关的文件，才能进入这个数组等待读取
                const validFiles = [];

                // 新增：用于统计尺寸的变量
                const sizeStats = {}; // 格式: { "160x192": count }
                const tempImageStore = []; // 暂存读入的图片数据，等待统计完尺寸后再正式入库
                let loadedFileCount = 0; // 记录已解析完的图片数量，用于判断是否全部读完
                // WU-34 补修：用于检测同部件下编号是否重复
                // 结构：idTracker[moduleKey] = Set(基础编号)，如 ear -> Set('01')
                const idTracker = {}; 
                // 结构：duplicateIds[moduleKey] = 重复文件数组，如 ear -> ['ear_01(猫耳).png']
                const duplicateIds = {}; 

                for (let file of files) {
                    const fileName = file.name;
                    const baseName = fileName.substring(0, fileName.lastIndexOf('.'));
                    const pathParts = file.webkitRelativePath ? file.webkitRelativePath.split('/') : [];
                    
                    let moduleKey = null;
                    let seqNum = null;
                    let mountTarget = null;

                    // 强制要求必须是从文件夹导入（webkitRelativePath 有值，且至少有上级文件夹）
                    if (pathParts.length < 2) {
                        formatErrorFiles.push(fileName);
                        continue;
                    }

                    const folderName = pathParts[pathParts.length - 2];
                    // 匹配 01, 01(猫耳), 01$papa, 01(猫耳)$papa
                    const folderMatch = baseName.match(/^([0-9].*?)(?:\$([a-zA-Z]+))?$/);
                    if (!folderMatch) {
                        formatErrorFiles.push(fileName);
                        continue;
                    }
                    
                    moduleKey = folderName;
                    seqNum = folderMatch[1];
                    mountTarget = folderMatch[2] || null;

                    // 白名单校验：提取核心名称，挖掉括号内、@、$
                    let rawName = seqNum.replace(/[()（）].*?[()（）]/g, '').replace(/@.*$/, '').replace(/\$.*$/, '');
                    
                    // 文件夹模式：核心名称只能是纯数字（比如 01）
                    if (!/^\d+$/.test(rawName)) {
                        formatErrorFiles.push(fileName);
                        continue;
                    }

                    // 未知部件不参与读取
                    if (!MODULE_NAMES[moduleKey]) {
                        unmatchedKeys.add(moduleKey);
                        if (!unmatchedFiles[moduleKey]) unmatchedFiles[moduleKey] = [];
                        unmatchedFiles[moduleKey].push(file);
                        continue;
                    }

                    // 4. 解析 ID 和挂载信息
                    const rawId = seqNum;
                    const isSub = rawId.includes('@');
                    let baseId = rawId;
                    let subTag = null;

                    if (isSub) {
                        const parts = rawId.split('@');
                        baseId = parts[0];
                        subTag = parts[1] || 'sub';
                    }

                    const uniqueKey = `${moduleKey}_${baseId}`;
                    const isMount = !!mountTarget;

                    // 5. 查重校验
                    if (!isMount && !isSub) {
                        const numMatch = baseId.match(/^(\d+)/);
                        const pureNum = numMatch ? numMatch[1] : baseId;

                        if (!idTracker[moduleKey]) idTracker[moduleKey] = new Map();
                        
                        if (idTracker[moduleKey].has(pureNum)) {
                            if (!duplicateIds[moduleKey]) duplicateIds[moduleKey] = [];
                            const firstFileName = idTracker[moduleKey].get(pureNum);
                            if (!duplicateIds[moduleKey].includes(firstFileName)) {
                                duplicateIds[moduleKey].push(firstFileName);
                            }
                            if (!duplicateIds[moduleKey].includes(fileName)) {
                                duplicateIds[moduleKey].push(fileName);
                            }
                        } else {
                            idTracker[moduleKey].set(pureNum, fileName);
                        }
                    }

                    // 6. 记录合法文件
                    validFiles.push({ file, fileName, moduleKey, baseId, isSub, subTag, uniqueKey, mountTarget, isMount });
                }

                // 清空旧面板并重新装载合法选项（剔除有冲突的部件）
                for (const key in dynamicOptions) {
                    dynamicOptions[key] = [];
                }
                for (const item of validFiles) {
                    if (item.isSub || item.isMount) continue;
                    if (duplicateIds[item.moduleKey]) continue;

                    let displayName = `${MODULE_NAMES[item.moduleKey]} ${item.baseId}`;
                    const matchName = item.baseId.match(/[\(（](.+?)[\)）]/);
                    if (matchName) displayName = matchName[1].trim();
                    else if (!/^\d+$/.test(item.baseId)) displayName = item.baseId;

                    const existingOpt = dynamicOptions[item.moduleKey].find(o => o.id === item.baseId);
                    if (!existingOpt) {
                        dynamicOptions[item.moduleKey].push({ id: item.baseId, name: displayName });
                    } else {
                        existingOpt.name = displayName;
                    }
                }

                // 7. 只给合法文件读图
                for (const item of validFiles) {
                    if (duplicateIds[item.moduleKey]) continue;
                    
                    const reader = new FileReader();
                    reader.onload = (event) => {
                        const img = new Image();
                        img.onload = () => {
                            const sizeKey = `${img.naturalWidth}x${img.naturalHeight}`;
                            sizeStats[sizeKey] = (sizeStats[sizeKey] || 0) + 1;
                            
                            const existingIdx = tempImageStore.findIndex(t => t.uniqueKey === item.uniqueKey && t.subTag === item.subTag && t.mountTarget === item.mountTarget);
                            const record = { ...item, img };
                            
                            if (existingIdx > -1) {
                                tempImageStore[existingIdx] = record;
                            } else {
                                tempImageStore.push(record);
                            }

                            loadedFileCount++;
                            if (loadedFileCount === validFiles.length) {
                                processLoadedImages();
                            }
                        };
                        img.src = event.target.result;
                    };
                    reader.readAsDataURL(item.file);
                    loadedCount++;
                }

                // 如果全是坏文件，直接结算并报错
                if (validFiles.length === 0) {
                    processLoadedImages();
                }

                // ===== 核心逻辑：处理读取完毕的图片，判断尺寸 =====
                function processLoadedImages() {
                    if (tempImageStore.length === 0) return;

                    // 1. 找出出现次数最多的尺寸作为基准
                    let maxCount = 0;
                    let bestSizeKey = '';
                    for (const sizeKey in sizeStats) {
                        if (sizeStats[sizeKey] > maxCount) {
                            maxCount = sizeStats[sizeKey];
                            bestSizeKey = sizeKey;
                        }
                    }

                    if (!bestSizeKey) return;
                    
                    // 解析基准尺寸
                    baseWidth = parseInt(bestSizeKey.split('x')[0]);
                    baseHeight = parseInt(bestSizeKey.split('x')[1]);
                    applyCanvasSize(baseWidth, baseHeight);
                    firstImgLoaded = true;

                    // 2. 检查是否有不同的尺寸
                    const mismatchedFiles = [];
                    const sizeMismatchSet = new Set();

                    // 3. 将合格的图片存入缓存，不合格的挑出来
                    tempImageStore.forEach(item => {
                        const imgSizeKey = `${item.img.naturalWidth}x${item.img.naturalHeight}`;
                        
                        // WU-34 补修：如果该部件存在编号重复，整件跳过，不读图片
                        // 注意：这里还要查一下挂载图和副部件，如果它们依附的主部件有重复，也一并跳过
                        const parentModule = item.uniqueKey.split('_')[0];
                        if (duplicateIds[parentModule]) {
                            return;
                        }

                        if (imgSizeKey !== bestSizeKey) {
                            // 尺寸不符
                            mismatchedFiles.push(item.fileName);
                            sizeMismatchSet.add(item.fileName);
                            
                            // 【核心修复】如果是主部件，把它从 dynamicOptions 里删掉，避免出现空壳
                            if (!item.isSub) {
                                const optIdx = dynamicOptions[item.moduleKey].findIndex(o => o.id === item.baseId);
                                if (optIdx > -1) {
                                    dynamicOptions[item.moduleKey].splice(optIdx, 1);
                                }
                            }
                            return; // 跳过这个图
                        }

                        // 尺寸符合，执行入库（直接覆盖同名旧图）
                        if (item.isMount) {
                            // WU-34：挂载图按目标部件分组，同一目标下按来源 key 排序后依次叠画
                            const tKey = item.mountTarget;
                            if (!mountCache[tKey]) mountCache[tKey] = [];
                            const existIdx = mountCache[tKey].findIndex(m => m.srcKey === item.uniqueKey);
                            const record = { srcKey: item.uniqueKey, img: item.img };
                            if (existIdx > -1) {
                                mountCache[tKey][existIdx] = record;
                            } else {
                                mountCache[tKey].push(record);
                            }
                            mountCache[tKey].sort((a, b) => a.srcKey.localeCompare(b.srcKey));
                        } else if (item.isSub) {
                            if (!subCache[item.uniqueKey]) subCache[item.uniqueKey] = {};
                            subCache[item.uniqueKey][item.subTag] = item.img;
                            if (!subColor[item.uniqueKey]) subColor[item.uniqueKey] = {};
                            if (!subColor[item.uniqueKey][item.subTag]) {
                                subColor[item.uniqueKey][item.subTag] = { ...defaultColorObj };
                            }
                        } else {
                            imageCache[item.uniqueKey] = item.img;
                            thumbCache[item.uniqueKey] = generateThumbnail(item.img, item.moduleKey);
                            if (selected[item.moduleKey] === null) selected[item.moduleKey] = item.baseId;
                            
                            // 核心：如果这个名字已经存在，更新它的显示名称
                            const optIdx = dynamicOptions[item.moduleKey].findIndex(o => o.id === item.baseId);
                            if (optIdx > -1) {
                                // 重新解析一次名字，用于覆盖旧名字
                                let displayName = `${MODULE_NAMES[item.moduleKey]} ${item.baseId}`;
                                const matchName = item.baseId.match(/[\(（](.+?)[\)）]/);
                                if (matchName) displayName = matchName[1].trim();
                                else if (!/^\d+$/.test(item.baseId)) displayName = item.baseId;
                                
                                dynamicOptions[item.moduleKey][optIdx].name = displayName;
                            }
                        }
                    });

                    // 4. 如果有尺寸错误，弹窗报错
                    if (sizeMismatchSet.size > 0) {
                        const uniqMismatch = Array.from(sizeMismatchSet);
                        const showMismatch = uniqMismatch.slice(0, 5).map(f => `「${f}」`).join('、');
                        const moreMismatch = uniqMismatch.length > 5 ? ` 等 ${uniqMismatch.length} 个文件` : '';

                        const modalTitle = document.querySelector('#confirmModal .modal-title');
                        if (modalTitle) modalTitle.style.display = 'none';

                        showConfirm(`<div style="text-align: center;"><div style="color: #ff8f8f; font-weight: bold; margin-bottom: 8px;">发现以下文件与其他文件的尺寸不同，请修正并重新导入。</div><div style="font-size: 13px; color: #b7b7d0; line-height: 1.6; text-align: left; padding: 0 10px; max-height: 150px; overflow-y: auto;">${uniqMismatch.map(f => '· ' + f).join('<br>')}</div></div>`, () => {
                            document.getElementById('confirmModal').classList.remove('show');
                            if (modalTitle) modalTitle.style.display = 'block';
                        }, () => {
                            document.getElementById('confirmModal').classList.remove('show');
                            if (modalTitle) modalTitle.style.display = 'block';
                        });
                    }

                    // 5. 触发界面刷新
                    drawPreview();
                    if (activeModule) renderOptionsPanel();
                    
                    // WU-34 补修：如果有编号重复的部件，弹窗报错
                    if (Object.keys(duplicateIds).length > 0) {
                        let msg = '<div style="text-align: left; width: 100%;">';
                        msg += '<div style="color: #ff8f8f; font-weight: bold; margin-bottom: 12px; text-align: center;">检测到同部件下存在序号相同的素材，已跳过这些部件！</div>';
                        
                        for (const mod in duplicateIds) {
                            msg += `<div style="margin-bottom: 12px;">`;
                            msg += `<div style="color: #d4b872; margin-bottom: 6px; font-weight: 600;">部件【${MODULE_NAMES[mod] || mod}】存在以下序号相同的素材：</div>`;
                            msg += `<div style="background: rgba(0,0,0,0.25); border-radius: 8px; padding: 8px 12px; font-size: 13px; color: #c9c6dd; line-height: 1.5; word-break: break-all;">`;
                            // 遍历该部件下所有的冲突文件名
                            const uniqueFiles = [...new Set(duplicateIds[mod])];
                            uniqueFiles.forEach(f => {
                                msg += `<div style="display: flex; align-items: center; gap: 6px; margin-bottom: 4px;"><span style="color: #ff8f8f; font-size: 10px;">●</span> ${f}</div>`;
                            });
                            msg += `</div></div>`;
                        }
                        
                        msg += '<div style="color: #ff8f8f; text-align: center; margin-top: 16px;">请修改文件名中的编号后重新导入该部件。</div>';
                        msg += '</div>';

                        const modalTitle = document.querySelector('#confirmModal .modal-title');
                        if (modalTitle) modalTitle.style.display = 'none';

                        showConfirm(msg, () => {
                            document.getElementById('confirmModal').classList.remove('show');
                            if (modalTitle) modalTitle.style.display = 'block';
                        }, () => {
                            document.getElementById('confirmModal').classList.remove('show');
                            if (modalTitle) modalTitle.style.display = 'block';
                        });
                    }
                    
                    // 清空暂存区，防止内存泄漏
                    tempImageStore.length = 0;
                }

                // 原有的排序逻辑
                for (let key in dynamicOptions) {
                    dynamicOptions[key].sort((a, b) => parseInt(a.id) - parseInt(b.id));
                    if (dynamicOptions[key].length > 0) {
                        // 强制要求至少有一个选中，如果是空的，直接取第一个
                        if (!selected[key]) {
                            selected[key] = dynamicOptions[key][0].id;
                        }
                    }
                }
                
                // 导入完成后，把最新的选中状态保存到当前角色里，防止被切角色覆盖
                if (characters[activeCharIndex]) {
                    characters[activeCharIndex].selected = { ...selected };
                }

                renderOptionsPanel();

                if (loadedCount > 0) {
                    setTimeout(() => {
                        renderOptionsPanel();
                        updateTunePanelUI();
                        drawPreview();
                    }, 100);
                } else {
                    alert("未识别到匹配的图片，请确保文件名格式如：body_01.png 或 coat_01.png");
                }

                // 如果有命名格式不规范的素材，弹窗提示
                const allErrorFiles = [...new Set([...invalidFiles, ...formatErrorFiles])];
                if (allErrorFiles.length > 0) {
                    // 隐藏“提示”标题
                    const modalTitle = document.querySelector('#confirmModal .modal-title');
                    if (modalTitle) modalTitle.style.display = 'none';

                    let msg = '<div style="text-align: left; width: 100%;">';
                    msg += '<div style="color: #ff8f8f; font-weight: bold; margin-bottom: 12px; text-align: center;">发现命名格式不符合规范的素材！</div>';
                    msg += '<div style="color: #d4b872; margin-bottom: 6px; font-weight: 600;">以下文件未被加载：</div>';
                    msg += '<div style="background: rgba(0,0,0,0.25); border-radius: 8px; padding: 8px 12px; font-size: 13px; color: #c9c6dd; line-height: 1.5; max-height: 180px; overflow-y: auto; word-break: break-all;">';
                    
                    allErrorFiles.forEach(f => {
                        msg += `<div style="display: flex; align-items: center; gap: 6px; margin-bottom: 4px;"><span style="color: #ff8f8f; font-size: 10px;">●</span> ${f}</div>`;
                    });

            // ---------------- 保存透明PNG (1x / 4x) ----------------
            function saveImage(scaleFactor = 1) {
                let w = baseWidth || 400;
                let h = baseHeight || 480;
                const exportW = Math.round(w * scaleFactor);
                const exportH = Math.round(h * scaleFactor);

                const exportCanvas = document.createElement('canvas');
                exportCanvas.width = exportW;
                exportCanvas.height = exportH;
                const exportCtx = exportCanvas.getContext('2d');

                // 导出时关闭平滑，保证像素画锐利
                exportCtx.imageSmoothingEnabled = false;

                const drawOrder = [...getLayerOrder()].reverse(); 
                
                // 1. 特殊处理：后发第一行强行垫底（导出）
                const bhOptionId = selected['backHair'];
                if (bhOptionId && bhOptionId !== 'none') {
                    const bhImg = imageCache[`backHair_${bhOptionId}`];
                    if (bhImg && bhImg.complete && bhImg.naturalWidth > 0) {
                        // 算出导出时单行的高度（原图高度 / 4 * 放大倍数）
                        const exportRowHeight = (bhImg.naturalHeight / 4) * scaleFactor;
                        exportCtx.save();
                        exportCtx.beginPath();
                        // 裁剪画布，只允许在第一行高度范围内绘制
                        exportCtx.rect(0, 0, exportW, exportRowHeight);
                        exportCtx.clip();
                        drawFilteredImage(exportCtx, bhImg, 0, 0, exportW, exportH, colorData['backHair']);
                        exportCtx.restore();
                    }
                }

                // 2. 正常渲染其他图层
                const bhIndex = drawOrder.indexOf('backHair');
                const bodyIndex = drawOrder.indexOf('body');
                
                for (let moduleKey of drawOrder) {
                    const optionId = selected[moduleKey];
                    if (!optionId || optionId === 'none') continue;
                    const imgKey = `${moduleKey}_${optionId}`;
                    const img = imageCache[imgKey];
                    if (img && img.complete && img.naturalWidth > 0) {
                        if (moduleKey === 'backHair' && bhIndex > bodyIndex) {
                            // 后发在素体上方：跳过第一行，只画后面的行
                            const exportRowHeight = (img.naturalHeight / 4) * scaleFactor;
                            exportCtx.save();
                            exportCtx.beginPath();
                            // 裁剪掉第一行的高度，从第二行开始画
                            exportCtx.rect(0, exportRowHeight, exportW, exportH - exportRowHeight);
                            exportCtx.clip();
                            drawFilteredImage(exportCtx, img, 0, 0, exportW, exportH, colorData[moduleKey]);
                            exportCtx.restore();
                        } else {
                            // 其他情况正常全画
                            drawFilteredImage(exportCtx, img, 0, 0, exportW, exportH, colorData[moduleKey]);
                        }
                    }

                    // 【新增】画副部件（导出）
                    if (subCache[imgKey]) {
                        for (const subTag in subCache[imgKey]) {
                            const subImg = subCache[imgKey][subTag];
                            const sColor = (subColor[imgKey] && subColor[imgKey][subTag]) ? subColor[imgKey][subTag] : defaultColorObj;
                            
                            if (subImg && subImg.complete && subImg.naturalWidth > 0) {
                                drawFilteredImage(exportCtx, subImg, 0, 0, exportW, exportH, sColor);
                            }
                        }
                    }

                    // WU-34：画完当前部件，顺手画挂在它身上的挂载图（导出）
                    // 来源绑定：只有当当前面板选中的部件与挂载图来源前缀一致时，才渲染
                    if (mountCache[moduleKey]) {
                        for (const m of mountCache[moduleKey]) {
                            const mImg = m.img;
                            const srcParts = m.srcKey.split('_');
                            const srcModule = srcParts[0];
                            const srcId = srcParts.slice(1).join('_');
                            
                            if (selected[srcModule] !== srcId) continue;

                            // WU-34：挂载图的颜色跟着它的来源部件走
                            const mColor = colorData[srcModule] || defaultColorObj;

                            if (mImg && mImg.complete && mImg.naturalWidth > 0) {
                                drawFilteredImage(exportCtx, mImg, 0, 0, exportW, exportH, mColor);
                            }
                        }
                    }
                }

                const dataUrl = exportCanvas.toDataURL('image/png');
                const link = document.createElement('a');
                const suffix = scaleFactor === 1 ? '1x' : (scaleFactor + 'x');
                link.download = `审神者捏人_${suffix}_${new Date().getTime()}.png`;
                link.href = dataUrl;
                link.click();
            }

                // 拼接全新的说明文字（支持 HTML 换行和颜色）
                const ruleText = `<div style="text-align: justify; text-justify: inter-ideograph; font-size: 13px; line-height: 1.6; color: #b7b7d0; padding-right: 8px;"><div style="margin-bottom: 8px; color: #e5e5ff; text-align: left;">您可以导入一整套自己的素材，将它当做纸娃娃工具来使用。</div><div style="color: #d4b872; font-weight: bold; margin-bottom: 8px; margin-top: 16px; font-size: 15px; text-align: left;">1. 命名规则</div><div style="margin-bottom: 8px; padding-left: 8px;"><div style="margin-bottom: 6px; color: #fff; font-weight: 600;">①常规命名</div><div style="padding-left: 10px; margin-bottom: 14px;">将文件命名为 <span style="color: #b8f0c8;">编号</span> 或 <span style="color: #b8f0c8;">编号(显示名称)</span>，并放在对应的 <span style="color: #d4b872;">&lt;key&gt;</span> 文件夹下。<br><br>示例：<br>如果你有一个蝴蝶结，需要加载在【饰品】部件内，你需要将文件命名为：<span style="color: #b8f0c8;">01</span> 或 <span style="color: #b8f0c8;">01(蝴蝶结)</span>，并放在 <span style="color: #d4b872;">&lt;accessory&gt;</span> 文件夹内。<br><span style="font-size: 14px; color: #8ab4f8;">注：括号内的文字会作为显示名称显示在部件的下方，不写名称则直接显示编号。</span></div><div style="margin-bottom: 6px; color: #fff; font-weight: 600;">②调色图层</div><div style="padding-left: 10px; margin-bottom: 14px;">将文件命名为 <span style="color: #b8f0c8;">编号@子部件名</span> 或 <span style="color: #b8f0c8;">编号(显示名称)@子部件名</span>，并放在对应的 <span style="color: #d4b872;">&lt;key&gt;</span> 文件夹下。<br><br>示例：<br>如果你的蝴蝶结上还有一块宝石，你希望它可以单独被调色，你需要把宝石的部分单独扣出来另存为成一个新的文件，并命名为：<span style="color: #b8f0c8;">01@宝石</span> 或 <span style="color: #b8f0c8;">01(蝴蝶结)@宝石</span>，并放在 <span style="color: #d4b872;">&lt;accessory&gt;</span> 文件夹内。<br><span style="font-size: 14px; color: #8ab4f8;">注：它会被识别为 &lt;accessory&gt; 文件夹内“01”号部件的调色图层，并以“宝石”的名字出现在调色窗口右侧的调色部件窗口中。</span></div><div style="margin-bottom: 6px; color: #fff; font-weight: 600;">③挂载图层</div><div style="padding-left: 10px; margin-bottom: 14px;">将文件命名为 <span style="color: #b8f0c8;">联动图层$挂载部件</span>，并放在联动图层对应的 <span style="color: #d4b872;">&lt;key&gt;</span> 文件夹下。<br><br><span style="color: #d4b872;">挂载图层是什么，我们什么时候需要用到挂载图层？</span><br>当一个部件有一部分出现在另一个部件上方，又有一部分需要这个部件遮挡的时候，我们可以使用挂载图层来使原本在下层的部件只有一部分出现在A的上层。<br><br><span style="color: #b7b7d0; font-weight: 600;">联动图层</span>：当前素材的的内容来源，和这个图层联动显示和调色。<br><span style="font-size: 14px; color: #8ab4f8;">说人话：你从哪个文件里抠出来的就把那个文件的文件名复制粘贴到$前。</span><br><br><span style="color: #b7b7d0; font-weight: 600;">挂载图层</span>：当前素材的挂载对象，会挂在挂载对象上层，和挂载对象属于一个部件图层。<br><span style="font-size: 14px; color: #8ab4f8;">说人话：你要遮挡哪个部件就把这个部件的部件key粘贴在后面。</span><br><br><span style="color: #d4b872;">这样说很抽象，我们来用一个详细的示例来进行说明：</span><br>在一般情况下，蝴蝶结是出现在后发上层的，但当后发是马尾（序号04）时，我需要马尾的部分遮挡住蝴蝶结，以做出蝴蝶结是被绑在马尾上的效果。这种情况下，我把马尾需要遮挡蝴蝶结的部分单独扣出来，将它命名为：<span style="color: #b8f0c8;">04$accessory</span>，并放在马尾原本所在的 <span style="color: #d4b872;">&lt;backHair&gt;</span> 后发文件夹内。</div><div style="margin-top: 12px; font-size: 14px; color: #8ab4f8;">💡 提示：key列表可以从左上角的“查看 Key 列表”查看。</div></div><div style="color: #d4b872; font-weight: bold; margin-bottom: 8px; margin-top: 16px; font-size: 15px; text-align: left;">2. 图层规则</div><div style="margin-bottom: 8px; padding-left: 8px;"><div style="margin-bottom: 4px;"><span style="color: #ff8f8f;">①</span> 一般情况下，图层顺序按照左侧部件标签卡的顺序从上到下排列。</div><div style="margin-bottom: 4px;"><span style="color: #ff8f8f;">②</span> 自定义部件可以通过拖拽改变图层顺序，默认图层无法改变图层顺序。</div><div style="margin-bottom: 4px;"><span style="color: #ff8f8f;">③</span> <span style="color: #d4b872;">【后发】</span>部件的图层较为特殊：请将后发的四行放在同一张图里，第一行会自动被渲染在<span style="color: #d4b872;">【素体】</span>的下方。</div></div><div style="color: #d4b872; font-weight: bold; margin-bottom: 8px; margin-top: 16px; font-size: 15px; text-align: left;">3. 注意事项</div><div style="padding-left: 8px;"><div style="margin-bottom: 4px;"><span style="color: #ff8f8f;">①</span> 所有素材的尺寸必须相同。</div><div style="margin-bottom: 4px;"><span style="color: #ff8f8f;">②</span> 导入时需要按照文件夹分开放置每个部件，并直接选择最外层的文件夹。</div><div style="margin-bottom: 4px;"><span style="color: #ff8f8f;">③</span> 如果导入的素材与原有的素材文件名相同，会自动覆盖之前的文件。</div><div style="margin-bottom: 4px;"><span style="color: #ff8f8f;">④</span> 如果遇到导入素材之后所有框都是空白的情况，请检查是否有不符合命名规则的文件，可能有没有被排除的命名不正确的文件被放行了。</div></div></div>`;

            // ---------------- 角色数据分享（代码形式） ----------------
            document.getElementById('genCodeBtn').addEventListener('click', () => {
                // 先把当前角色的最新状态同步到 characters 数组里
                characters[activeCharIndex].selected = { ...selected };
                characters[activeCharIndex].colorData = JSON.parse(JSON.stringify(colorData));
                
                // === 数据瘦身 ===
                const s = {}; // 存选中的部件
                const c = {}; // 存非默认的调色
                const sc = {}; // 存非默认的副部件调色
                
                // 1. 提取非空选中项
                for (const k in characters[activeCharIndex].selected) {
                    if (characters[activeCharIndex].selected[k]) {
                        s[k] = characters[activeCharIndex].selected[k];
                    }
                }
                
                // 2. 提取非默认的颜色（只有不是全白、0、100、100 才存）
                for (const k in characters[activeCharIndex].colorData) {
                    const cd = characters[activeCharIndex].colorData[k];
                    if (cd.tint !== '#ffffff' || cd.hue !== 0 || cd.sat !== 100 || cd.bri !== 100) {
                        c[k] = cd;
                    }
                }

                // 3. 提取副部件的非默认颜色
                const charSubColor = characters[activeCharIndex].subColor || subColor;
                for (const imgKey in charSubColor) {
                    for (const subTag in charSubColor[imgKey]) {
                        const scd = charSubColor[imgKey][subTag];
                        if (scd.tint !== '#ffffff' || scd.hue !== 0 || scd.sat !== 100 || scd.bri !== 100) {
                            if (!sc[imgKey]) sc[imgKey] = {};
                            sc[imgKey][subTag] = scd;
                        }
                    }
                }

                // 4. 生成精简数据（短键名）
                const exportData = {
                    n: characters[activeCharIndex].name || '',
                    s: s,
                    c: c,
                    sc: sc, // 新增：副部件颜色
                    l: getLayerOrder()
                };
                
                // 使用 LZ-String 或类似算法太复杂，我们用最基础的替换把 JSON 里的无用括号和引号去掉
                const jsonStr = JSON.stringify(exportData);
                // encodeURIComponent 会把中文变成 3 个字节，压缩成 Base64 后依旧很大
                // 我们直接用 btoa 配合 unescape 简化
                const code = btoa(unescape(encodeURIComponent(jsonStr)));
                
                // 尝试直接复制到剪切板
                navigator.clipboard.writeText(code).then(() => {
                    // 成功复制后弹出简单提示
                    const codeWrap = document.getElementById('codeInputWrap');
                    codeWrap.style.display = 'none';
                    document.getElementById('pureModeCheckWrap').style.display = 'none';

            // ---------------- 导出素体 ----------------

            // 打开修改部件窗口

            function registerNewModule(displayName, key) {
                // 动态注册到各表，后续选中、调色、排序、导入都按这个 key 走
                MODULE_NAMES[key] = displayName;
                dynamicOptions[key] = [];
                selected[key] = null;
                colorData[key] = { tint: '#ffffff', hue: 0, sat: 100, bri: 100 };

                const container = document.getElementById('moduleTabs');
                
                // 外层包裹：统一用外壳控制 10px 间距
                const wrapper = document.createElement('div');
                wrapper.className = 'custom-tab-wrapper';
                wrapper.style.cssText = 'position: relative; width: 130px; flex-shrink: 0; display: flex; justify-content: flex-end; margin-bottom: 5px;';

                // 主按钮
                const btn = document.createElement('button');
                btn.className = 'tab-btn custom-module';
                btn.dataset.module = key;
                btn.draggable = true;
                btn.style.cssText = 'width: 110px; box-sizing: border-box;';
                btn.innerHTML = `<span class="tab-name">${displayName}</span>`;
                
                wrapper.appendChild(btn);
                container.appendChild(wrapper);

                btn.addEventListener('click', () => setActiveModule(key));
                
                // 封装一个弹出菜单的方法，右键和长按共用
                const showModuleMenu = (clientX, clientY) => {
                    const menu = document.getElementById('contextMenu');
                    // 防止菜单超出屏幕右侧或下方（手机适配）
                    const menuX = Math.min(clientX, window.innerWidth - 130);
                    const menuY = Math.min(clientY, window.innerHeight - 100);
                    
                    menu.style.left = menuX + 'px';
                    menu.style.top = menuY + 'px';
                    menu.classList.add('show');

                    // 修改名称
                    document.getElementById('menuEditBtn').onclick = () => {
                        menu.classList.remove('show');
                        openEditModuleModal(key, displayName);
                    };

                    // 绑定删除部件
                    const delMenuBtn = document.getElementById('menuDeleteCharBtn');
                    delMenuBtn.style.display = 'block';
                    delMenuBtn.textContent = '删除部件';
                    delMenuBtn.onclick = () => {
                        menu.classList.remove('show');
                        removeModule(key, displayName);
                    };
                };

                // 1. 电脑端：右键弹出菜单
                btn.addEventListener('contextmenu', (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    showModuleMenu(e.clientX, e.clientY);
                });

                // 2. 手机端：长按弹出菜单
                let longPressTimer = null;
                let startX = 0;
                let startY = 0;
                let isLongPress = false;

                btn.addEventListener('touchstart', (e) => {
                    // 如果已经触发过长按，阻止默认行为
                    if (isLongPress) return;
                    
                    const touch = e.touches[0];
                    startX = touch.clientX;
                    startY = touch.clientY;
                    isLongPress = false;

                    longPressTimer = setTimeout(() => {
                        isLongPress = true;
                        // 震动一下（部分手机支持）
                        if (navigator.vibrate) navigator.vibrate(50);
                        showModuleMenu(startX, startY);
                    }, 600); // 600ms 算长按
                }, { passive: false });

                btn.addEventListener('touchmove', (e) => {
                    const touch = e.touches[0];
                    // 如果手指移动超过 10 像素，说明是在滑动拖拽，取消长按
                    if (Math.abs(touch.clientX - startX) > 10 || Math.abs(touch.clientY - startY) > 10) {
                        clearTimeout(longPressTimer);
                    }
                });

                btn.addEventListener('touchend', (e) => {
                    clearTimeout(longPressTimer);
                    // 如果触发了长按，阻止之后的 click 事件
                    if (isLongPress) {
                        e.preventDefault();
                        e.stopPropagation();
                    }
                });

                setupTabDrag();
                setActiveModule(key);
                drawPreview();
                startDynPreview();
            }

            // 修改自定义部件的逻辑
            function handleEditModule(oldKey, newName, newKey) {
                // 1. 如果名称没变且 key 没变，直接关窗
                if (oldKey === newKey && MODULE_NAMES[oldKey] === newName) {
                    closeNewModuleModal();
                    return;
                }

                // 2. 更新名称表
                MODULE_NAMES[newKey] = newName;
                delete MODULE_NAMES[oldKey];

                // 3. 迁移 dynamicOptions
                dynamicOptions[newKey] = dynamicOptions[oldKey] || [];
                delete dynamicOptions[oldKey];

                // 4. 迁移 selected
                selected[newKey] = selected[oldKey];
                delete selected[oldKey];

                // 5. 迁移 colorData
                colorData[newKey] = colorData[oldKey] || { tint: '#ffffff', hue: 0, sat: 100, bri: 100 };
                delete colorData[oldKey];

                // 6. 迁移 imageCache 和 thumbCache 的 key 前缀
                if (oldKey !== newKey) {
                    for (const cache of [imageCache, thumbCache]) {
                        for (const k in cache) {
                            if (k.startsWith(oldKey + '_')) {
                                const newK = k.replace(oldKey + '_', newKey + '_');
                                cache[newK] = cache[k];
                                delete cache[k];
                            }
                        }
                    }
                }

                // 7. 更新 DOM
                const btn = document.querySelector(`.tab-btn[data-module="${oldKey}"]`);
                if (btn) {
                    btn.dataset.module = newKey;
                    const nameEl = btn.querySelector('.tab-name');
                    if (nameEl) nameEl.textContent = newName;
                    
                    // 增加防崩溃判断（因为咱们之前去掉了 key 的显示，导致这里找不到 .tab-key 会报错）
                    const keyEl = btn.querySelector('.tab-key');
                    if (keyEl) keyEl.textContent = `key: ${newKey}`;
                }

                // 8. 如果当前选中的就是这个部件，同步 activeModule
                if (activeModule === oldKey) {
                    activeModule = newKey;
                }

                closeNewModuleModal();
                editingModuleKey = null;

                renderOptionsPanel();
                updateTunePanelUI();
                drawPreview();

                    document.getElementById('confirmModal').classList.remove('show');
                }, () => {
                    document.getElementById('confirmModal').classList.remove('show');
                });
            }

                    const opts = dynamicOptions[key] || [];
                    opts.forEach(opt => {
                        const imgKey = `${key}_${opt.id}`;
                        delete imageCache[imgKey];
                        delete thumbCache[imgKey];
                    });

                    delete MODULE_NAMES[key];
                    delete dynamicOptions[key];
                    delete selected[key];
                    delete colorData[key];

                    const container = document.getElementById('moduleTabs');
                    const btn = container.querySelector(`.tab-btn[data-module="${key}"]`);
                    if (btn) {
                        const wrapper = btn.closest('.custom-tab-wrapper');
                        if (wrapper) {
                            wrapper.remove();
                        } else {
                            btn.remove();
                        }
                    }

                    if (activeModule === key) {
                        setActiveModule('accessory');
                    }
                    drawPreview();
                });
            }

            document.getElementById('newModuleOk').addEventListener('click', () => {

                    handleEditModule(editingModuleKey, displayName, key);

                }

                if (batchCreatingKeys.length > 0) {

                    for (let input of inputs) {

                            errEl.textContent = '所有的显示名称都必须填写';
                            return;

                        allNames.push({ key: input.dataset.key, name });
                    }

                    closeNewModuleModal();
                    let totalFiles = 0;
                    allNames.forEach((item) => {
                        registerNewModule(item.name, item.key);
                        const files = pendingUnmatchedFiles[item.key] || [];

                        if (files.length > 0) loadFilesForModule(files, item.key);

                    pendingUnmatchedFiles = {};
                    batchCreatingKeys = [];

                    showConfirm(`已成功创建 ${allNames.length} 个部件，并自动补入 ${totalFiles} 张素材。`, () => {
                        showConfirm('请通过拖拽左侧的选项卡调整图层顺序。', () => {}, () => {});
                    });

                const nameEl = document.getElementById('newModuleName');
                const keyEl = document.getElementById('newModuleKey');
                if (!nameEl || !keyEl) return;

                const displayName = nameEl.value.trim();
                const key = keyEl.value.trim();

                if (!displayName) { errEl.textContent = '请填写显示名称'; return; }
                // 允许大小写字母
                if (!/^[a-zA-Z]+$/.test(key)) { errEl.textContent = 'key 只能用英文字母'; return; }
                if (MODULE_NAMES[key] && key !== editingModuleKey) { errEl.textContent = '这个 key 已被占用，换一个'; return; }

                registerNewModule(displayName, key);
                const filesForThisKey = pendingUnmatchedFiles[key] || [];
                if (filesForThisKey.length > 0) {

                closeNewModuleModal();

                    : '部件已创建，请重新导入素材。';

                showConfirm(msg, () => {
                    showConfirm('请通过拖拽左侧的选项卡调整图层顺序。', () => {}, () => {});
                });
            });

            // 把玩家选中的文件按序号挂到指定 key 下（文件名里的模块名部分不强制，序号取数字）
            function loadFilesForModule(files, key) {
                const fileArr = Array.from(files);
                let loadedCount = 0;
                let idx = dynamicOptions[key].length;

                fileArr.forEach(file => {
                    idx++;
                    const optionId = String(idx).padStart(2, '0');
                    const uniqueKey = `${key}_${optionId}`;
                    const reader = new FileReader();
                    reader.onload = (event) => {
                        const img = new Image();
                        img.onload = () => {
                            imageCache[uniqueKey] = img;
                            // 自定义部件不遵循行走图 3×4 网格，缩略图直接整图居中缩放
                            thumbCache[uniqueKey] = generateThumbnail(img, key);
                            
                            // 核心修复：提取文件名里括号的中文，如果没有括号则使用纯非数字后缀
                            const baseNameWithoutExt = file.name.substring(0, file.name.lastIndexOf('.'));
                            const namePart = baseNameWithoutExt.replace(`${key}_`, '');
                            
                            let displayName = `${MODULE_NAMES[key]} ${optionId}`;
                            const matchName = namePart.match(/[\(（](.+?)[\)）]/);
                            if (matchName) {
                                displayName = matchName[1].trim();
                            } else if (!/^\d+$/.test(namePart)) {
                                displayName = namePart;
                            }

                            dynamicOptions[key].push({ id: optionId, name: displayName });

                            loadedCount++;
                            if (loadedCount === fileArr.length) {
                                // 全部加载完再统一收尾：排序、选第一张、切到该模块、刷新面板和画布
                                dynamicOptions[key].sort((a, b) => parseInt(a.id) - parseInt(b.id));
                                if (selected[key] === null || selected[key] === undefined) {
                                    selected[key] = dynamicOptions[key][0].id;
                                }
                                setActiveModule(key);
                                renderOptionsPanel();
                                updateTunePanelUI();
                                drawPreview();
                            }
                        };
                        img.src = event.target.result;
                    };
                    reader.readAsDataURL(file);
                });
            }

            let dragSrcTab = null;

            // 检测默认图层上的“试图拖拽”行为
            let lockDragStart = { x: 0, y: 0, el: null };
            document.querySelectorAll('#moduleTabs .tab-btn[data-tooltip]').forEach(tab => {
                tab.addEventListener('mousedown', (e) => {
                    lockDragStart = { x: e.clientX, y: e.clientY, el: tab };
                });
            });
            document.addEventListener('mousemove', (e) => {
                if (lockDragStart.el) {
                    const dist = Math.hypot(e.clientX - lockDragStart.x, e.clientY - lockDragStart.y);
                    if (dist > 5) {
                        lockDragStart.el.classList.add('is-dragging-locked');
                    }
                }
            });
            document.addEventListener('mouseup', () => {
                if (lockDragStart.el) {
                    lockDragStart.el.classList.remove('is-dragging-locked');
                    lockDragStart.el = null;
                }
            });

            function clearDragMarks() {
                document.querySelectorAll('#moduleTabs .tab-btn[data-module]').forEach(el => {
                    el.classList.remove('dragging', 'drag-over-top', 'drag-over-bottom');
                    el.style.opacity = ''; // 彻底清除内联透明度
                    const w = el.closest('.custom-tab-wrapper');
                    if (w) w.style.opacity = ''; // 彻底清除外壳内联透明度
                });
