                    return;
                }

                if (batchCreatingKeys.length > 0) {
                    const inputs = document.querySelectorAll('.batch-name-input');
                    let allNames = [];
                    for (let input of inputs) {
                        const name = input.value.trim();
                        if (!name) {
                            errEl.textContent = '所有的显示名称都必须填写';
                            return;
                        }
                        allNames.push({ key: input.dataset.key, name });
                    }

                    closeNewModuleModal();
                    let totalFiles = 0;
                    allNames.forEach((item) => {
                        registerNewModule(item.name, item.key);
                        const files = pendingUnmatchedFiles[item.key] || [];
                        totalFiles += files.length;
                        if (files.length > 0) loadFilesForModule(files, item.key);
                    });

                    pendingUnmatched = [];
                    pendingUnmatchedFiles = {};
                    batchCreatingKeys = [];

                    showConfirm(`已成功创建 ${allNames.length} 个部件，并自动补入 ${totalFiles} 张素材。`, () => {
                        showConfirm('请通过拖拽左侧的选项卡调整图层顺序。', () => {}, () => {});
                    });
                    return;
                }

                const nameEl = document.getElementById('newModuleName');
                const keyEl = document.getElementById('newModuleKey');
                if (!nameEl || !keyEl) return;

                const displayName = nameEl.value.trim();
                const key = keyEl.value.trim();

                if (!displayName) { errEl.textContent = '请填写显示名称'; return; }
                if (!/^[a-z]+$/.test(key)) { errEl.textContent = 'key 只能用小写英文字母'; return; }
                if (MODULE_NAMES[key] && key !== editingModuleKey) { errEl.textContent = '这个 key 已被占用，换一个'; return; }

                registerNewModule(displayName, key);
                const filesForThisKey = pendingUnmatchedFiles[key] || [];
                if (filesForThisKey.length > 0) {
                    loadFilesForModule(filesForThisKey, key);
                }

                closeNewModuleModal();

                let msg = filesForThisKey.length > 0 
                    ? `部件「${displayName}」已创建，本次导入的 ${filesForThisKey.length} 张素材已自动补入。`
                    : '部件已创建，请重新导入素材。';

                showConfirm(msg, () => {
                    showConfirm('请通过拖拽左侧的选项卡调整图层顺序。', () => {}, () => {});
                });
            });

            // 把玩家选中的文件按序号挂到指定 key 下（文件名里的模块名部分不强制，序号取数字）
            function loadFilesForModule(files, key) {
                const fileArr = Array.from(files);
                let loadedCount = 0;
                let idx = dynamicOptions[key].length;

                fileArr.forEach(file => {
                    idx++;
                    const optionId = String(idx).padStart(2, '0');
                    const uniqueKey = `${key}_${optionId}`;
                    const reader = new FileReader();
                    reader.onload = (event) => {
                        const img = new Image();
                        img.onload = () => {
                            imageCache[uniqueKey] = img;
                            // 自定义部件不遵循行走图 3×4 网格，缩略图直接整图居中缩放
                            thumbCache[uniqueKey] = generateThumbnail(img, key);
                            
                            // 核心修复：提取文件名里括号的中文，如果没有括号则使用纯非数字后缀
                            const baseNameWithoutExt = file.name.substring(0, file.name.lastIndexOf('.'));
                            const namePart = baseNameWithoutExt.replace(`${key}_`, '');
                            
                            let displayName = `${MODULE_NAMES[key]} ${optionId}`;
                            const matchName = namePart.match(/[\(（](.+?)[\)）]/);
                            if (matchName) {
                                displayName = matchName[1].trim();
                            } else if (!/^\d+$/.test(namePart)) {
                                displayName = namePart;
                            }

                            dynamicOptions[key].push({ id: optionId, name: displayName });

                            loadedCount++;
                            if (loadedCount === fileArr.length) {
                                // 全部加载完再统一收尾：排序、选第一张、切到该模块、刷新面板和画布
                                dynamicOptions[key].sort((a, b) => parseInt(a.id) - parseInt(b.id));
                                if (selected[key] === null || selected[key] === undefined) {
                                    selected[key] = dynamicOptions[key][0].id;
                                }
                                setActiveModule(key);
                                renderOptionsPanel();
                                updateTunePanelUI();
                                drawPreview();
                            }
                        };
                        img.src = event.target.result;
                    };
                    reader.readAsDataURL(file);
                });
            }

            let dragSrcTab = null;

            // 检测默认图层上的“试图拖拽”行为
            let lockDragStart = { x: 0, y: 0, el: null };
            document.querySelectorAll('#moduleTabs .tab-btn[data-tooltip]').forEach(tab => {
                tab.addEventListener('mousedown', (e) => {
                    lockDragStart = { x: e.clientX, y: e.clientY, el: tab };
                });
            });
            document.addEventListener('mousemove', (e) => {
                if (lockDragStart.el) {
                    const dist = Math.hypot(e.clientX - lockDragStart.x, e.clientY - lockDragStart.y);
                    if (dist > 5) {
                        lockDragStart.el.classList.add('is-dragging-locked');
                    }
                }
            });
            document.addEventListener('mouseup', () => {
                if (lockDragStart.el) {
                    lockDragStart.el.classList.remove('is-dragging-locked');
                    lockDragStart.el = null;
                }
            });

            function clearDragMarks() {
                document.querySelectorAll('#moduleTabs .tab-btn[data-module]').forEach(el => {
                    el.classList.remove('dragging', 'drag-over-top', 'drag-over-bottom');
                    el.style.opacity = ''; // 彻底清除内联透明度
                    const w = el.closest('.custom-tab-wrapper');
                    if (w) w.style.opacity = ''; // 彻底清除外壳内联透明度
                });
            }

            function setupTabDrag() {
                document.querySelectorAll('#moduleTabs .tab-btn[data-module]').forEach(tab => {
                    const wrapper = tab.closest('.custom-tab-wrapper') || tab;

                    wrapper.addEventListener('dragstart', (e) => {
                        if (!tab.classList.contains('custom-module')) {
                            e.preventDefault();
                            return;
                        }
                        dragSrcTab = wrapper; 
                        // 拖拽时让整个壳子和里面的叉子透明度变低，而不是只变按钮
                        wrapper.style.opacity = '0.4'; 
                        e.dataTransfer.effectAllowed = 'move';
                        e.dataTransfer.setData('text/plain', tab.dataset.module);
                    });

                    wrapper.addEventListener('dragend', () => {
                        dragSrcTab = null;
                        wrapper.style.opacity = '1'; // 恢复外壳透明度
                        tab.style.opacity = '1'; // 恢复按钮透明度
                        clearDragMarks();
                    });
                    wrapper.addEventListener('dragover', (e) => {
                        if (!dragSrcTab || dragSrcTab === wrapper) return;
                        e.preventDefault();
                        e.dataTransfer.dropEffect = 'move';
                        // 用 wrapper 来算插入线位置，保证视觉和实际一致
                        const rect = wrapper.getBoundingClientRect();
                        const isAbove = (e.clientY - rect.top) < rect.height / 2;
                        tab.classList.toggle('drag-over-top', isAbove);
                        tab.classList.toggle('drag-over-bottom', !isAbove);
                    });

                    wrapper.addEventListener('dragleave', () => {
                        tab.classList.remove('drag-over-top', 'drag-over-bottom');
                    });

                    wrapper.addEventListener('drop', (e) => {
                        if (!dragSrcTab || dragSrcTab === wrapper) return;
                        e.preventDefault();
                        const container = wrapper.parentNode;
                        const rect = wrapper.getBoundingClientRect();
                        const isAbove = (e.clientY - rect.top) < rect.height / 2;

                        // 如果目标是固定部件，依然允许自定义部件插进去
                        if (isAbove) {
                            container.insertBefore(dragSrcTab, wrapper);
                        } else {
                            container.insertBefore(dragSrcTab, wrapper.nextSibling);
                        }

                        // 强制固定 7 个部件保持默认相对顺序（不影响自定义部件位置）
                        let lastFixed = null;
                        DEFAULT_LAYER_ORDER.forEach(moduleKey => {
                            const btn = container.querySelector(`.tab-btn[data-module="${moduleKey}"]`);
                            if (!btn) return;
                            const bWrap = btn.closest('.custom-tab-wrapper') || btn;
                            if (lastFixed && !(lastFixed.compareDocumentPosition(bWrap) & Node.DOCUMENT_POSITION_FOLLOWING)) {
                                container.insertBefore(bWrap, lastFixed.nextSibling);
                            }
                            lastFixed = bWrap;
                        });

                        clearDragMarks();
                        drawPreview();
                    });
                });
            }

            // 按窗口宽、高共同缩放，取能完整放下的最小比例；最小 0.5 防止字小到看不清
            function applyResponsiveScale() {
                const outer = document.querySelector('.app-outer');
                if (!outer) return;
                const scaler = outer.parentElement;
                const titleEl = document.querySelector('.page-title');
                const footerEl = document.querySelector('.page-footer');
                // 先还原，量出设计尺寸
                outer.style.transform = 'none';
                const designWidth = outer.scrollWidth;
                const designHeight = outer.scrollHeight;
                // 页面顶部标题与底部署名占用的高度，也必须从可用高度里扣掉
                const titleH = titleEl ? titleEl.offsetHeight + 24 : 0;
                const footerH = footerEl ? footerEl.offsetHeight + 24 : 0;
                // 多留 32px 安全边距，避免不同系统滚动条或边框把边缘吃掉
                const availW = window.innerWidth - 32;
                const availH = window.innerHeight - titleH - footerH - 32;
                if (designWidth <= 0 || designHeight <= 0 || availH <= 0) return;
                const scaleW = availW / designWidth;
                const scaleH = availH / designHeight;
                const scale = Math.min(1, Math.max(0.45, Math.min(scaleW, scaleH)));
                outer.style.transform = `scale(${scale})`;
                outer.style.transformOrigin = 'top center';
                // 同步设置包装容器占位，避免缩小后留白不对称、边缘被吞
                if (scaler) {
                    scaler.style.width = (designWidth * scale) + 'px';
                    scaler.style.height = (designHeight * scale) + 'px';
                    scaler.style.margin = '0 auto';
                }
            }

            window.addEventListener('resize', applyResponsiveScale);

            // 全局点击隐藏右键菜单
            document.addEventListener('click', (e) => {
                const menu = document.getElementById('contextMenu');
                if (menu && menu.classList.contains('show') && e.target !== document.getElementById('menuEditBtn')) {
                    menu.classList.remove('show');
                }
            });
            // 缩放窗口时隐藏右键菜单
            window.addEventListener('resize', () => {
                const menu = document.getElementById('contextMenu');
                if (menu) menu.classList.remove('show');
            });

            // 屏蔽页面右键菜单，输入框和文本域除外，保证输入时仍可粘贴/复制
            document.addEventListener('contextmenu', (e) => {
                const tag = (e.target && e.target.tagName) ? e.target.tagName.toLowerCase() : '';
                if (tag === 'input' || tag === 'textarea') return;
                e.preventDefault();
            });

            function init() {
                applyCanvasSize(baseWidth, baseHeight);
                tabs.forEach(tab => {
                    tab.addEventListener('click', () => {
                        setActiveModule(tab.dataset.module);
                    });
                });
                setupTabDrag();

                // 初始化第一个角色数据（作为初始占位，分发包加载时会覆盖掉）
                characters = [{
                    name: '审神者',
                    selected: { accessory: null, frontHair: null, face: null, coat: null, clothes: null, body: null, backHair: null },
                    colorData: {
                        accessory: { tint: '#ffffff', hue: 0, sat: 100, bri: 100 },
                        frontHair: { tint: '#ffffff', hue: 0, sat: 100, bri: 100 },
                        face: { tint: '#ffffff', hue: 0, sat: 100, bri: 100 },
                        coat: { tint: '#ffffff', hue: 0, sat: 100, bri: 100 },
                        clothes: { tint: '#ffffff', hue: 0, sat: 100, bri: 100 },
                        body: { tint: '#ffffff', hue: 0, sat: 100, bri: 100 },
                        backHair: { tint: '#ffffff', hue: 0, sat: 100, bri: 100 }
                    }
                }];
                activeCharIndex = 0;
                
                renderCharacterTabs();
                setActiveModule('accessory');
                renderOptionsPanel();
                drawPreview();
                startDynPreview();
                applyResponsiveScale();
                loadInjectedAssets();

                // 监听内容尺寸变化，自动重新计算缩放比例，避免导入素材后界面错乱
                if (window.ResizeObserver) {
                    const ro = new ResizeObserver(() => {
                        applyResponsiveScale();
                    });
                    ro.observe(document.querySelector('.app'));
                }
            }

            init();
        })();
    </script>

</body></html>
