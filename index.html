                // === 数据瘦身 ===
                const s = {}; // 存选中的部件
                const c = {}; // 存非默认的调色
                const sc = {}; // 存非默认的副部件调色
                
                // 1. 提取非空选中项
                for (const k in characters[activeCharIndex].selected) {
                    if (characters[activeCharIndex].selected[k]) {
                        s[k] = characters[activeCharIndex].selected[k];
                    }
                }
                
                // 2. 提取非默认的颜色（只有不是全白、0、100、100 才存）
                for (const k in characters[activeCharIndex].colorData) {
                    const cd = characters[activeCharIndex].colorData[k];
                    if (cd.tint !== '#ffffff' || cd.hue !== 0 || cd.sat !== 100 || cd.bri !== 100) {
                        c[k] = cd;
                    }
                }

                // 3. 提取副部件的非默认颜色
                const charSubColor = characters[activeCharIndex].subColor || subColor;
                for (const imgKey in charSubColor) {
                    for (const subTag in charSubColor[imgKey]) {
                        const scd = charSubColor[imgKey][subTag];
                        if (scd.tint !== '#ffffff' || scd.hue !== 0 || scd.sat !== 100 || scd.bri !== 100) {
                            if (!sc[imgKey]) sc[imgKey] = {};
                            sc[imgKey][subTag] = scd;
                        }
                    }
                }

                // 4. 生成精简数据（短键名）
                const exportData = {
                    n: characters[activeCharIndex].name || '',

                    sc: sc, // 新增：副部件颜色
                    l: getLayerOrder()
                };
                
                // 使用 LZ-String 或类似算法太复杂，我们用最基础的替换把 JSON 里的无用括号和引号去掉
                const jsonStr = JSON.stringify(exportData);
                // encodeURIComponent 会把中文变成 3 个字节，压缩成 Base64 后依旧很大
                // 我们直接用 btoa 配合 unescape 简化
                const code = btoa(unescape(encodeURIComponent(jsonStr)));
                
                // 尝试直接复制到剪切板

            // ---------------- 导出素体 ----------------

            // ---------------- 初始化 ----------------

            // ---------------- 批量新建逻辑 ----------------
            const selectKeysModal = document.getElementById('selectKeysModal');

            function registerNewModule(displayName, key) {
                // 动态注册到各表，后续选中、调色、排序、导入都按这个 key 走
                MODULE_NAMES[key] = displayName;
                dynamicOptions[key] = [];
                selected[key] = null;
                colorData[key] = { tint: '#ffffff', hue: 0, sat: 100, bri: 100 };

                const container = document.getElementById('moduleTabs');

                wrapper.className = 'custom-tab-wrapper';
                wrapper.style.cssText = 'position: relative; width: 130px; flex-shrink: 0; display: flex; justify-content: flex-end; margin-bottom: 5px;';

                // 主按钮
                const btn = document.createElement('button');
                btn.className = 'tab-btn custom-module';
                btn.dataset.module = key;
                btn.draggable = true;
                btn.style.cssText = 'width: 110px; box-sizing: border-box;';
                btn.innerHTML = `<span class="tab-name">${displayName}</span>`;
                
                wrapper.appendChild(btn);
                container.appendChild(wrapper);

                btn.addEventListener('click', () => setActiveModule(key));
                
                // 封装一个弹出菜单的方法，右键和长按共用
                const showModuleMenu = (clientX, clientY) => {
                    const menu = document.getElementById('contextMenu');
                    // 防止菜单超出屏幕右侧或下方（手机适配）
                    const menuX = Math.min(clientX, window.innerWidth - 130);
                    const menuY = Math.min(clientY, window.innerHeight - 100);
                    
                    menu.style.left = menuX + 'px';
                    menu.style.top = menuY + 'px';
                    menu.classList.add('show');

                    // 修改名称
                    document.getElementById('menuEditBtn').onclick = () => {
                        menu.classList.remove('show');
                        openEditModuleModal(key, displayName);

                    // 绑定删除部件
                    const delMenuBtn = document.getElementById('menuDeleteCharBtn');
                    delMenuBtn.style.display = 'block';
                    delMenuBtn.textContent = '删除部件';
                    delMenuBtn.onclick = () => {
                        menu.classList.remove('show');
                        removeModule(key, displayName);
                    };
                };

                // 1. 电脑端：右键弹出菜单
                btn.addEventListener('contextmenu', (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    showModuleMenu(e.clientX, e.clientY);
                });

                // 2. 手机端：长按弹出菜单
                let longPressTimer = null;
                let startX = 0;
                let startY = 0;
                let isLongPress = false;

                btn.addEventListener('touchstart', (e) => {
                    // 如果已经触发过长按，阻止默认行为
                    if (isLongPress) return;
                    
                    const touch = e.touches[0];
                    startX = touch.clientX;
                    startY = touch.clientY;
                    isLongPress = false;

                    longPressTimer = setTimeout(() => {
                        isLongPress = true;
                        // 震动一下（部分手机支持）
                        if (navigator.vibrate) navigator.vibrate(50);
                        showModuleMenu(startX, startY);
                    }, 600); // 600ms 算长按
                }, { passive: false });

                btn.addEventListener('touchmove', (e) => {
                    const touch = e.touches[0];
                    // 如果手指移动超过 10 像素，说明是在滑动拖拽，取消长按
                    if (Math.abs(touch.clientX - startX) > 10 || Math.abs(touch.clientY - startY) > 10) {
                        clearTimeout(longPressTimer);
                    }
                });

                btn.addEventListener('touchend', (e) => {
                    clearTimeout(longPressTimer);
                    // 如果触发了长按，阻止之后的 click 事件
                    if (isLongPress) {
                        e.preventDefault();
                        e.stopPropagation();
                    }
                });

                setupTabDrag();
                setActiveModule(key);
                drawPreview();
                startDynPreview();
            }

            // 修改自定义部件的逻辑
            function handleEditModule(oldKey, newName, newKey) {
                // 1. 如果名称没变且 key 没变，直接关窗
                if (oldKey === newKey && MODULE_NAMES[oldKey] === newName) {
                    closeNewModuleModal();
                    return;
                }

                // 2. 更新名称表
                MODULE_NAMES[newKey] = newName;
                delete MODULE_NAMES[oldKey];

                // 3. 迁移 dynamicOptions
                dynamicOptions[newKey] = dynamicOptions[oldKey] || [];
                delete dynamicOptions[oldKey];

                // 4. 迁移 selected
                selected[newKey] = selected[oldKey];
                delete selected[oldKey];

                // 5. 迁移 colorData
                colorData[newKey] = colorData[oldKey] || { tint: '#ffffff', hue: 0, sat: 100, bri: 100 };
                delete colorData[oldKey];

                // 6. 迁移 imageCache 和 thumbCache 的 key 前缀
                if (oldKey !== newKey) {
                    for (const cache of [imageCache, thumbCache]) {
                        for (const k in cache) {
                            if (k.startsWith(oldKey + '_')) {
                                const newK = k.replace(oldKey + '_', newKey + '_');
                                cache[newK] = cache[k];
                                delete cache[k];
                            }
                        }
                    }
                }

                // 7. 更新 DOM
                const btn = document.querySelector(`.tab-btn[data-module="${oldKey}"]`);
                if (btn) {
                    btn.dataset.module = newKey;
                    const nameEl = btn.querySelector('.tab-name');
                    if (nameEl) nameEl.textContent = newName;
                    
                    // 增加防崩溃判断（因为咱们之前去掉了 key 的显示，导致这里找不到 .tab-key 会报错）
                    const keyEl = btn.querySelector('.tab-key');
                    if (keyEl) keyEl.textContent = `key: ${newKey}`;
                }

                // 8. 如果当前选中的就是这个部件，同步 activeModule
                if (activeModule === oldKey) {
                    activeModule = newKey;
                }

                closeNewModuleModal();
                editingModuleKey = null;

                renderOptionsPanel();
                updateTunePanelUI();
                drawPreview();
                
                showConfirm(`部件已修改为「${newName}」(key: ${newKey})，请确保后续导入的文件名以 ${newKey}_ 开头。`, () => {
                    document.getElementById('confirmModal').classList.remove('show');
                }, () => {
                    document.getElementById('confirmModal').classList.remove('show');
                });
            }

            // 删除自定义部件
            function removeModule(key, displayName) {
                showConfirm(`确定删除部件「${displayName}」吗？它名下的素材也会一起清掉。`, () => {
                    const opts = dynamicOptions[key] || [];
                    opts.forEach(opt => {
                        const imgKey = `${key}_${opt.id}`;
                        delete imageCache[imgKey];
                        delete thumbCache[imgKey];
                    });

                    delete MODULE_NAMES[key];
                    delete dynamicOptions[key];
                    delete selected[key];
                    delete colorData[key];

                    const container = document.getElementById('moduleTabs');
                    const btn = container.querySelector(`.tab-btn[data-module="${key}"]`);
                    if (btn) {
                        const wrapper = btn.closest('.custom-tab-wrapper');
                        if (wrapper) {
                            wrapper.remove();
                        } else {
                            btn.remove();
                        }
                    }

                    if (activeModule === key) {
                        setActiveModule('accessory');
                    }
                    drawPreview();
                });
            }

            document.getElementById('addModuleBtn').addEventListener('click', openNewModuleModal);
            document.getElementById('newModuleCancel').addEventListener('click', () => {
                pendingUnmatched = [];
                pendingUnmatchedFiles = {};
                closeNewModuleModal();
            });

            document.getElementById('newModuleOk').addEventListener('click', () => {
                const errEl = document.getElementById('newModuleErr');

                if (editingModuleKey) {
                    const nameEl = document.getElementById('newModuleName');
                    const keyEl = document.getElementById('newModuleKey');
                    if (!nameEl || !keyEl) return;
                    const displayName = nameEl.value.trim();
                    const key = keyEl.value.trim();

                    if (!displayName) { errEl.textContent = '请填写显示名称'; return; }
                    // 允许大小写字母
                    if (!/^[a-zA-Z]+$/.test(key)) { errEl.textContent = 'key 只能用英文字母'; return; }
                    if (MODULE_NAMES[key] && key !== editingModuleKey) { errEl.textContent = '这个 key 已被占用，换一个'; return; }

                    handleEditModule(editingModuleKey, displayName, key);
                    return;
                }

                if (batchCreatingKeys.length > 0) {
                    const inputs = document.querySelectorAll('.batch-name-input');
                    let allNames = [];
                    for (let input of inputs) {
                        const name = input.value.trim();
                        if (!name) {
                            errEl.textContent = '所有的显示名称都必须填写';
                            return;
                        }
                        allNames.push({ key: input.dataset.key, name });
                    }

                    closeNewModuleModal();
                    let totalFiles = 0;
                    allNames.forEach((item) => {
                        registerNewModule(item.name, item.key);
                        const files = pendingUnmatchedFiles[item.key] || [];
                        totalFiles += files.length;
                        if (files.length > 0) loadFilesForModule(files, item.key);
                    });

                    pendingUnmatched = [];
                    pendingUnmatchedFiles = {};
                    batchCreatingKeys = [];

                    showConfirm(`已成功创建 ${allNames.length} 个部件，并自动补入 ${totalFiles} 张素材。`, () => {
                        showConfirm('请通过拖拽左侧的选项卡调整图层顺序。', () => {}, () => {});
                    });
                    return;
                }

                const nameEl = document.getElementById('newModuleName');
                const keyEl = document.getElementById('newModuleKey');
                if (!nameEl || !keyEl) return;

                const displayName = nameEl.value.trim();
                const key = keyEl.value.trim();

                if (!displayName) { errEl.textContent = '请填写显示名称'; return; }
                // 允许大小写字母
                if (!/^[a-zA-Z]+$/.test(key)) { errEl.textContent = 'key 只能用英文字母'; return; }
                if (MODULE_NAMES[key] && key !== editingModuleKey) { errEl.textContent = '这个 key 已被占用，换一个'; return; }

                registerNewModule(displayName, key);
                const filesForThisKey = pendingUnmatchedFiles[key] || [];
                if (filesForThisKey.length > 0) {
                    loadFilesForModule(filesForThisKey, key);
                }

                closeNewModuleModal();

                let msg = filesForThisKey.length > 0 
                    ? `部件「${displayName}」已创建，本次导入的 ${filesForThisKey.length} 张素材已自动补入。`
                    : '部件已创建，请重新导入素材。';

                showConfirm(msg, () => {
                    showConfirm('请通过拖拽左侧的选项卡调整图层顺序。', () => {}, () => {});
                });
            });

            // 把玩家选中的文件按序号挂到指定 key 下（文件名里的模块名部分不强制，序号取数字）
            function loadFilesForModule(files, key) {
                const fileArr = Array.from(files);
                let loadedCount = 0;
                let idx = dynamicOptions[key].length;

                fileArr.forEach(file => {
                    idx++;
                    const optionId = String(idx).padStart(2, '0');
                    const uniqueKey = `${key}_${optionId}`;
                    const reader = new FileReader();
                    reader.onload = (event) => {
                        const img = new Image();
                        img.onload = () => {
                            imageCache[uniqueKey] = img;
                            // 自定义部件不遵循行走图 3×4 网格，缩略图直接整图居中缩放
                            thumbCache[uniqueKey] = generateThumbnail(img, key);
                            
                            // 核心修复：提取文件名里括号的中文，如果没有括号则使用纯非数字后缀
                            const baseNameWithoutExt = file.name.substring(0, file.name.lastIndexOf('.'));
                            const namePart = baseNameWithoutExt.replace(`${key}_`, '');
                            
                            let displayName = `${MODULE_NAMES[key]} ${optionId}`;
                            const matchName = namePart.match(/[\(（](.+?)[\)）]/);
                            if (matchName) {
                                displayName = matchName[1].trim();
                            } else if (!/^\d+$/.test(namePart)) {
                                displayName = namePart;
                            }

                            dynamicOptions[key].push({ id: optionId, name: displayName });

                            loadedCount++;
                            if (loadedCount === fileArr.length) {
                                // 全部加载完再统一收尾：排序、选第一张、切到该模块、刷新面板和画布
                                dynamicOptions[key].sort((a, b) => parseInt(a.id) - parseInt(b.id));
                                if (selected[key] === null || selected[key] === undefined) {
                                    selected[key] = dynamicOptions[key][0].id;
                                }
                                setActiveModule(key);
                                renderOptionsPanel();
                                updateTunePanelUI();
                                drawPreview();
                            }
                        };
                        img.src = event.target.result;
                    };
                    reader.readAsDataURL(file);
                });
            }

            let dragSrcTab = null;

            // 检测默认图层上的“试图拖拽”行为
            let lockDragStart = { x: 0, y: 0, el: null };
            document.querySelectorAll('#moduleTabs .tab-btn[data-tooltip]').forEach(tab => {
                tab.addEventListener('mousedown', (e) => {
                    lockDragStart = { x: e.clientX, y: e.clientY, el: tab };
                });
            });
            document.addEventListener('mousemove', (e) => {
                if (lockDragStart.el) {
                    const dist = Math.hypot(e.clientX - lockDragStart.x, e.clientY - lockDragStart.y);
                    if (dist > 5) {
                        lockDragStart.el.classList.add('is-dragging-locked');
                    }
                }
            });
            document.addEventListener('mouseup', () => {
                if (lockDragStart.el) {
                    lockDragStart.el.classList.remove('is-dragging-locked');
                    lockDragStart.el = null;
                }
            });

            function clearDragMarks() {
                document.querySelectorAll('#moduleTabs .tab-btn[data-module]').forEach(el => {
                    el.classList.remove('dragging', 'drag-over-top', 'drag-over-bottom');
                    el.style.opacity = ''; // 彻底清除内联透明度
                    const w = el.closest('.custom-tab-wrapper');
                    if (w) w.style.opacity = ''; // 彻底清除外壳内联透明度
                });
            }

            const dragLine = document.createElement('div');
            dragLine.className = 'drag-indicator-line';
            document.body.appendChild(dragLine);

            function setupTabDrag() {
                const container = document.getElementById('moduleTabs');

                function hideDragLine() {
                    dragLine.style.display = 'none';
                }

                function clearDragMarks() {
                    document.querySelectorAll('#moduleTabs .tab-btn').forEach(el => {
                        el.classList.remove('dragging', 'drag-over-top', 'drag-over-bottom');
                    });
                }

                document.querySelectorAll('#moduleTabs .tab-btn[data-module]').forEach(tab => {
                    const wrapper = tab.closest('.custom-tab-wrapper') || tab;

                    // 1. 电脑端拖拽逻辑
                    wrapper.addEventListener('dragstart', (e) => {
                        if (!tab.classList.contains('custom-module')) {
                            e.preventDefault();
                            return;
                        }
                        dragSrcTab = wrapper; 
                        wrapper.style.opacity = '0.4'; 
                        e.dataTransfer.effectAllowed = 'move';
                        e.dataTransfer.setData('text/plain', tab.dataset.module);
                    });

                    wrapper.addEventListener('dragend', () => {
                        dragSrcTab = null;
                        wrapper.style.opacity = '1'; 
                        hideDragLine();
                        clearDragMarks();
                    });

                    // 2. 手机端触摸拖拽逻辑
                    if (tab.classList.contains('custom-module')) {
                        let touchMoved = false;
                        let touchTimer = null;

                        wrapper.addEventListener('touchstart', (e) => {
                            // 长按 200ms 才触发拖拽，防止和普通点击/长按菜单冲突
                            touchTimer = setTimeout(() => {
                                dragSrcTab = wrapper;
                                wrapper.style.opacity = '0.4';
                                touchMoved = true;
                                if (navigator.vibrate) navigator.vibrate(30);
                            }, 200);
                        }, { passive: false });

                        wrapper.addEventListener('touchmove', (e) => {
                            if (!dragSrcTab) {
                                // 如果移动了但还没进入拖拽状态，取消定时器
                                if (e.touches.length > 0) clearTimeout(touchTimer);
                                return;
                            }
                            
                            e.preventDefault(); // 阻止页面滚动
                            
                            const touch = e.touches[0];
                            const targetEl = document.elementFromPoint(touch.clientX, touch.clientY);
                            
                            if (targetEl) {
                                const targetTab = targetEl.closest('.tab-btn[data-module]');
                                if (targetTab && targetTab !== dragSrcTab.querySelector('.tab-btn')) {
                                    // 更新紫色的提示线位置
                                    const rect = targetTab.getBoundingClientRect();
                                    const isAbove = touch.clientY < rect.top + rect.height / 2;
                                    const lineY = isAbove ? rect.top - 5 : rect.bottom + 5;
                                    
                                    dragLine.style.display = 'block';
                                    dragLine.style.top = (lineY + window.scrollY) + 'px';
                                    dragLine.style.left = rect.left + 'px';
                                }
                            }
                        }, { passive: false });

                        wrapper.addEventListener('touchend', (e) => {
                            clearTimeout(touchTimer);
                            if (!dragSrcTab) return;
                            
                            e.preventDefault();
                            dragLine.style.display = 'none';
                            wrapper.style.opacity = '1';

                            const touch = e.changedTouches[0];
                            const targetEl = document.elementFromPoint(touch.clientX, touch.clientY);
                            
                            if (targetEl) {
                                const targetTab = targetEl.closest('.tab-btn[data-module]');
                                if (targetTab && targetTab !== dragSrcTab.querySelector('.tab-btn')) {
                                    const rect = targetTab.getBoundingClientRect();
                                    const isAbove = touch.clientY < rect.top + rect.height / 2;
                                    const targetWrapper = targetTab.closest('.custom-tab-wrapper') || targetTab;
                                    
                                    if (isAbove) {
                                        targetWrapper.parentNode.insertBefore(dragSrcTab, targetWrapper);
                                    } else {
                                        targetWrapper.parentNode.insertBefore(dragSrcTab, targetWrapper.nextSibling);
                                    }
                                    
                                    // 强制基础卡片顺序
                                    let lastFixed = null;
                                    DEFAULT_LAYER_ORDER.forEach(moduleKey => {
                                        const btn = container.querySelector(`.tab-btn[data-module="${moduleKey}"]`);
                                        if (!btn) return;
                                        const bWrap = btn.closest('.custom-tab-wrapper') || btn;
                                        if (lastFixed && !(lastFixed.compareDocumentPosition(bWrap) & Node.DOCUMENT_POSITION_FOLLOWING)) {
                                            container.insertBefore(bWrap, lastFixed.nextSibling);
                                        }
                                        lastFixed = bWrap;
                                    });
                                    
                                    drawPreview();
                                }
                            }
                            dragSrcTab = null;
                        });
                    }

                    wrapper.addEventListener('dragover', (e) => {
                        if (!dragSrcTab || dragSrcTab === wrapper) return;
                        e.preventDefault();
                        e.dataTransfer.dropEffect = 'move';

                        const rect = wrapper.getBoundingClientRect();
                        const isAbove = (e.clientY - rect.top) < rect.height / 2;
                        
                        // 找到容器的所有有效卡片
                        const allTabs = Array.from(document.querySelectorAll('#moduleTabs .tab-btn[data-module]'));
                        const validTabs = allTabs.filter(el => el !== dragSrcTab && el !== dragSrcTab.querySelector('.tab-btn'));
                        const idx = validTabs.indexOf(tab);
                        
                        let lineY = 0;
                        if (isAbove) {
                            // 想插在前面：画在当前卡片上边缘，和上一张卡片下边缘的正中间
                            if (idx > 0) {
                                const prevRect = validTabs[idx - 1].getBoundingClientRect();
                                lineY = (prevRect.bottom + rect.top) / 2;
                            } else {
                                lineY = rect.top - 5;
                            }
                        } else {
                            // 想插在后面：画在当前卡片下边缘，和下一张卡片上边缘的正中间
                            if (idx < validTabs.length - 1) {
                                const nextRect = validTabs[idx + 1].getBoundingClientRect();
                                lineY = (rect.bottom + nextRect.top) / 2;
                            } else {
                                lineY = rect.bottom + 5;
                            }
                        }
                        
                        dragLine.style.display = 'block';
                        dragLine.style.top = (lineY + window.scrollY - 2) + 'px';
                        dragLine.style.left = rect.left + 'px'; /* 去掉 -28，让左边缘和按钮对齐 */
                    });

                    wrapper.addEventListener('dragleave', () => {
                        hideDragLine();
                    });

                    wrapper.addEventListener('drop', (e) => {
                        if (!dragSrcTab || dragSrcTab === wrapper) return;
                        e.preventDefault();
                        const container = wrapper.parentNode;
                        const rect = wrapper.getBoundingClientRect();
                        const isAbove = (e.clientY - rect.top) < rect.height / 2;

                        // 插入 DOM
                        if (isAbove) {
                            container.insertBefore(dragSrcTab, wrapper);
                        } else {
                            container.insertBefore(dragSrcTab, wrapper.nextSibling);
                        }

                        // 强制固定基础顺序
                        let lastFixed = null;
                        DEFAULT_LAYER_ORDER.forEach(moduleKey => {
                            const btn = container.querySelector(`.tab-btn[data-module="${moduleKey}"]`);
                            if (!btn) return;
                            const bWrap = btn.closest('.custom-tab-wrapper') || btn;
                            if (lastFixed && !(lastFixed.compareDocumentPosition(bWrap) & Node.DOCUMENT_POSITION_FOLLOWING)) {
                                container.insertBefore(bWrap, lastFixed.nextSibling);
                            }
                            lastFixed = bWrap;
                        });

                        hideDragLine();
                        drawPreview();
                    });
                });

                // 全局强制拦截：不论拖到哪里，只要越过首尾卡片中线，统统置顶或沉底
                document.addEventListener('dragover', (e) => {
                    if (!dragSrcTab) return;
                    
                    const allTabs = Array.from(container.querySelectorAll('.tab-btn[data-module]'));
                    const validTabs = allTabs.filter(el => el !== dragSrcTab && el !== dragSrcTab.querySelector('.tab-btn'));
                    if (validTabs.length === 0) return;

                    const firstTab = validTabs[0];
                    const lastTab = validTabs[validTabs.length - 1];
                    const firstRect = firstTab.getBoundingClientRect();
                    const lastRect = lastTab.getBoundingClientRect();
                    
                    // 1. 越过最后一张卡片中线 -> 沉底
                    if (e.clientY > lastRect.top + lastRect.height / 2) {
                        e.preventDefault();
                        e.dataTransfer.dropEffect = 'move';
                        dragLine.style.display = 'block';
                        dragLine.style.top = (lastRect.bottom + 5 + window.scrollY) + 'px';
                        
                        const lastWrapper = lastTab.closest('.custom-tab-wrapper') || lastTab;
                        dragLine.style.left = lastWrapper.getBoundingClientRect().left + 'px';
                    }
                    // 2. 越过第一张卡片中线 -> 置顶
                    else if (e.clientY < firstRect.top + firstRect.height / 2) {
                        e.preventDefault();
                        e.dataTransfer.dropEffect = 'move';
                        dragLine.style.display = 'block';
                        dragLine.style.top = (firstRect.top - 7 + window.scrollY) + 'px';
                        
                        const firstWrapper = firstTab.closest('.custom-tab-wrapper') || firstTab;
                        dragLine.style.left = firstWrapper.getBoundingClientRect().left + 'px';
                    }
                });

                document.addEventListener('drop', (e) => {
                    if (!dragSrcTab) return;
                    
                    const allTabs = Array.from(container.querySelectorAll('.tab-btn[data-module]'));
                    const validTabs = allTabs.filter(el => el !== dragSrcTab && el !== dragSrcTab.querySelector('.tab-btn'));
                    if (validTabs.length === 0) return;

                    const firstTab = validTabs[0];
                    const lastTab = validTabs[validTabs.length - 1];
                    const firstRect = firstTab.getBoundingClientRect();
                    const lastRect = lastTab.getBoundingClientRect();
                    
                    // 1. 如果在最后一张下方松手 -> 沉底
                    if (e.clientY > lastRect.top + lastRect.height / 2) {
                        e.preventDefault();
                        e.stopPropagation();
                        
                        container.appendChild(dragSrcTab);
                        
                        let lastFixed = null;
                        DEFAULT_LAYER_ORDER.forEach(moduleKey => {
                            const btn = container.querySelector(`.tab-btn[data-module="${moduleKey}"]`);
                            if (!btn) return;
                            const bWrap = btn.closest('.custom-tab-wrapper') || btn;
                            if (lastFixed && !(lastFixed.compareDocumentPosition(bWrap) & Node.DOCUMENT_POSITION_FOLLOWING)) {
                                container.insertBefore(bWrap, lastFixed.nextSibling);
                            }
                            lastFixed = bWrap;
                        });
                        
                        hideDragLine();
                        dragSrcTab = null; 
                        drawPreview();
                    }
                    // 2. 如果在第一张上方松手 -> 置顶
                    else if (e.clientY < firstRect.top + firstRect.height / 2) {
                        e.preventDefault();
                        e.stopPropagation();
                        
                        container.insertBefore(dragSrcTab, firstTab.closest('.custom-tab-wrapper') || firstTab);
                        
                        let lastFixed = null;
                        DEFAULT_LAYER_ORDER.forEach(moduleKey => {
                            const btn = container.querySelector(`.tab-btn[data-module="${moduleKey}"]`);
                            if (!btn) return;
                            const bWrap = btn.closest('.custom-tab-wrapper') || btn;
                            if (lastFixed && !(lastFixed.compareDocumentPosition(bWrap) & Node.DOCUMENT_POSITION_FOLLOWING)) {
                                container.insertBefore(bWrap, lastFixed.nextSibling);
                            }
                            lastFixed = bWrap;
                        });
                        
                        hideDragLine();
                        dragSrcTab = null;
                        drawPreview();
                    }
                });
            }
            // 按窗口宽、高共同缩放，取能完整放下的最小比例；最小 0.5 防止字小到看不清
            function applyResponsiveScale() {
                const outer = document.querySelector('.app-outer');
                if (!outer) return;
                const scaler = outer.parentElement;
                const titleEl = document.querySelector('.page-title');
                const footerEl = document.querySelector('.page-footer');
                // 先还原，量出设计尺寸
                outer.style.transform = 'none';
                const designWidth = outer.scrollWidth;
                const designHeight = outer.scrollHeight;
                // 页面顶部标题与底部署名占用的高度，也必须从可用高度里扣掉
                const titleH = titleEl ? titleEl.offsetHeight + 24 : 0;
                const footerH = footerEl ? footerEl.offsetHeight + 24 : 0;
                // 多留 32px 安全边距，避免不同系统滚动条或边框把边缘吃掉
                const availW = window.innerWidth - 32;
                const availH = window.innerHeight - titleH - footerH - 32;
                if (designWidth <= 0 || designHeight <= 0 || availH <= 0) return;
                const scaleW = availW / designWidth;
                const scaleH = availH / designHeight;
                const scale = Math.min(1, Math.max(0.45, Math.min(scaleW, scaleH)));
                outer.style.transform = `scale(${scale})`;
                outer.style.transformOrigin = 'top center';
                // 同步设置包装容器占位，避免缩小后留白不对称、边缘被吞
                if (scaler) {
                    scaler.style.width = (designWidth * scale) + 'px';
                    scaler.style.height = (designHeight * scale) + 'px';
                    scaler.style.margin = '0 auto';
                }

                // 【新增】动态限制左侧滚动区域，避免卡片遮挡按钮
                const appEl = document.querySelector('.app');
                const tabsEl = document.getElementById('moduleTabs');
                const bottomFloat = document.getElementById('tabsBottomFloat');
                if (appEl && tabsEl && bottomFloat) {
                    // 计算底部按钮占用的真实高度（包括 margin 和 padding）
                    const floatHeight = bottomFloat.offsetHeight + 30; 
                    // 将左侧列表的最大高度，限制在 大框高度减去 悬浮按钮高度
                    tabsEl.style.maxHeight = (appEl.offsetHeight - floatHeight) + 'px';
                }
            }

            window.addEventListener('resize', applyResponsiveScale);

            // 全局点击隐藏右键菜单
            document.addEventListener('click', (e) => {
                const menu = document.getElementById('contextMenu');
                if (menu && menu.classList.contains('show') && e.target !== document.getElementById('menuEditBtn')) {
                    menu.classList.remove('show');
                }
            });
            // 缩放窗口时隐藏右键菜单
            window.addEventListener('resize', () => {
                const menu = document.getElementById('contextMenu');
                if (menu) menu.classList.remove('show');
            });

            // 屏蔽页面右键菜单，输入框和文本域除外，保证输入时仍可粘贴/复制
            document.addEventListener('contextmenu', (e) => {
                const tag = (e.target && e.target.tagName) ? e.target.tagName.toLowerCase() : '';
                if (tag === 'input' || tag === 'textarea') return;
                e.preventDefault();
            });

            function init() {
                applyCanvasSize(baseWidth, baseHeight);
                tabs.forEach(tab => {
                    tab.addEventListener('click', () => {
                        if (tab.dataset.module) {
                            setActiveModule(tab.dataset.module);
                        }
                    });

                    // 拦截默认部件的右键（电脑）
                    tab.addEventListener('contextmenu', (e) => {
                        if (!tab.classList.contains('custom-module')) {
                            e.preventDefault();
                            e.stopPropagation();
                            showProtectTip(tab);
                        }
                    });

                    // 鼠标离开时，立即移除提示
                    tab.addEventListener('mouseleave', () => {
                        tab.classList.remove('show-protect-tip');
                        tab.style.removeProperty('--tip-content');
                    });

                    // 拦截默认部件的长按（手机）
                    let protectTimer = null;
                    tab.addEventListener('touchstart', (e) => {
                        if (!tab.classList.contains('custom-module')) {
                            protectTimer = setTimeout(() => {
                                showProtectTip(tab);
                                if (navigator.vibrate) navigator.vibrate(50);
                            }, 600);
                        }
                    });
                    
                    // 手指抬起或滑动时，清除定时器并移除提示
                    const hideTouchTip = () => {
                        clearTimeout(protectTimer);
                        tab.classList.remove('show-protect-tip');
                        tab.style.removeProperty('--tip-content');
                    };
                    tab.addEventListener('touchend', hideTouchTip);
                    tab.addEventListener('touchmove', hideTouchTip);
                });
                
                // 弹提示的辅助函数
                function showProtectTip(el) {
                    document.querySelectorAll('.show-protect-tip').forEach(item => {
                        item.classList.remove('show-protect-tip');
                        item.style.removeProperty('--tip-content');
                    });
                    
                    // 直接注入纯文本，颜色和背景由继承的 data-tooltip 样式接管
                    el.style.setProperty('--tip-content', `"🔒 默认部件不可重命名和删除"`);
                    
                    void el.offsetWidth; 
                    el.classList.add('show-protect-tip');
                    
                    setTimeout(() => {
                        el.classList.remove('show-protect-tip');
                        el.style.removeProperty('--tip-content');
                    }, 2000);
                }
                
                setupTabDrag();
                // 初始化第一个角色数据（作为初始占位，分发包加载时会覆盖掉）
                characters = [{
                    name: '审神者',
                    selected: { papa: null, hat: null, accessory: null, frontHair: null, face: null, coat: null, clothes: null, body: null, backHair: null },
                    colorData: {
                        papa: { tint: '#ffffff', hue: 0, sat: 100, bri: 100 },
                        hat: { tint: '#ffffff', hue: 0, sat: 100, bri: 100 },
                        accessory: { tint: '#ffffff', hue: 0, sat: 100, bri: 100 },
                        ear: { tint: '#ffffff', hue: 0, sat: 100, bri: 100 },
                        frontHair: { tint: '#ffffff', hue: 0, sat: 100, bri: 100 },
                        backHair: { tint: '#ffffff', hue: 0, sat: 100, bri: 100 },
                        face: { tint: '#ffffff', hue: 0, sat: 100, bri: 100 },
                        coat: { tint: '#ffffff', hue: 0, sat: 100, bri: 100 },
                        clothes: { tint: '#ffffff', hue: 0, sat: 100, bri: 100 },
                        body: { tint: '#ffffff', hue: 0, sat: 100, bri: 100 }
                    }
                }];
                activeCharIndex = 0;
                
                renderCharacterTabs();
                // 自动获取左侧排在最前面的部件，并将其设为激活状态
                const firstTab = document.querySelector('#moduleTabs .tab-btn[data-module]');
                if (firstTab) {
                    setActiveModule(firstTab.dataset.module);
                } else {
                    setActiveModule('accessory');
                }
                renderOptionsPanel();
                drawPreview();
                startDynPreview();
                applyResponsiveScale();
                loadInjectedAssets();

                // 监听内容尺寸变化，自动重新计算缩放比例，避免导入素材后界面错乱
                if (window.ResizeObserver) {
                    const ro = new ResizeObserver(() => {
                        applyResponsiveScale();
                    });
                    ro.observe(document.querySelector('.app'));
                }
            }

            // 全局暴露一个复制方法，供弹窗里的动态按钮调用
            window.copyKeyText = function(key) {
                // 封装一个通用的深色提示函数
                const showSuccess = () => {
                    // 隐藏弹窗里不需要的元素
                    document.getElementById('codeInputWrap').style.display = 'none';
                    document.getElementById('pureModeCheckWrap').style.display = 'none';
                    document.getElementById('exportOptionsWrap').style.display = 'none';
                    
                    // 隐藏取消按钮，变成单确定按钮的提示框
                    document.getElementById('confirmCancel').style.display = 'none';
                    
                    showConfirm(`【${key}】 已复制到剪贴板！`, () => {
                        document.getElementById('confirmModal').classList.remove('show');
                        // 恢复取消按钮的显示，以免影响其他弹窗
                        document.getElementById('confirmCancel').style.display = 'block';
                    }, () => {});
                };

                navigator.clipboard.writeText(key).then(() => {
                    showSuccess();
                }).catch(err => {
                    // 兼容部分不支持的安全环境，老办法复制
                    const textarea = document.createElement('textarea');
                    textarea.value = key;
                    document.body.appendChild(textarea);
                    textarea.select();
                    document.execCommand('copy');
                    document.body.removeChild(textarea);
                    showSuccess();
                });
            };

            // ===== 全局悬浮提示框逻辑 =====
            const globalTooltip = document.getElementById('globalTooltip');
            
            function bindTooltip(elementId, text) {
                const el = document.getElementById(elementId);
                if (!el || !globalTooltip) return;

                el.addEventListener('mouseenter', (e) => {
                    globalTooltip.textContent = text;
                    globalTooltip.style.display = 'block';
                    
                    // 获取按钮位置，将提示框定在按钮正下方
                    const rect = el.getBoundingClientRect();
                    // 水平居中：按钮中心点 X 坐标
                    const centerX = rect.left + rect.width / 2;
                    globalTooltip.style.left = centerX + 'px';
                    globalTooltip.style.top = (rect.bottom + 8) + 'px';
                    
                    // 等浏览器渲染出 display: block 后，再加 show 类触发动画
                    requestAnimationFrame(() => {
                        globalTooltip.classList.add('show');
                    });
                });

                el.addEventListener('mouseleave', () => {
                    globalTooltip.classList.remove('show');
                    // 等动画结束（0.2秒）后彻底隐藏
                    setTimeout(() => {
                        if (!globalTooltip.classList.contains('show')) {
                            globalTooltip.style.display = 'none';
                        }
                    }, 200);
                });
            }

            bindTooltip('exportBodyBtn', '单独导出当前选择的素体');
            // 导入素材的提示已删除

            init();
        })();
    </script><div class="drag-indicator-line"></div>
