            const dragLine = document.createElement('div');
            dragLine.className = 'drag-indicator-line';
            document.body.appendChild(dragLine);

            function setupTabDrag() {
                const container = document.getElementById('moduleTabs');

                function hideDragLine() {
                    dragLine.style.display = 'none';
                }

                function clearDragMarks() {
                    document.querySelectorAll('#moduleTabs .tab-btn').forEach(el => {
                        el.classList.remove('dragging', 'drag-over-top', 'drag-over-bottom');
                    });
                }

                document.querySelectorAll('#moduleTabs .tab-btn[data-module]').forEach(tab => {
                    const wrapper = tab.closest('.custom-tab-wrapper') || tab;

                    // 1. 电脑端拖拽逻辑
                    wrapper.addEventListener('dragstart', (e) => {
                        if (!tab.classList.contains('custom-module')) {
                            e.preventDefault();
                            return;
                        }
                        dragSrcTab = wrapper; 
                        wrapper.style.opacity = '0.4'; 
                        e.dataTransfer.effectAllowed = 'move';
                        e.dataTransfer.setData('text/plain', tab.dataset.module);
                    });

                    wrapper.addEventListener('dragend', () => {
                        dragSrcTab = null;
                        wrapper.style.opacity = '1'; 
                        hideDragLine();
                        clearDragMarks();
                    });

                    // 2. 手机端触摸拖拽逻辑
                    if (tab.classList.contains('custom-module')) {
                        let touchMoved = false;
                        let touchTimer = null;

                        wrapper.addEventListener('touchstart', (e) => {
                            // 长按 200ms 才触发拖拽，防止和普通点击/长按菜单冲突
                            touchTimer = setTimeout(() => {
                                dragSrcTab = wrapper;
                                wrapper.style.opacity = '0.4';
                                touchMoved = true;
                                if (navigator.vibrate) navigator.vibrate(30);
                            }, 200);
                        }, { passive: false });

                        wrapper.addEventListener('touchmove', (e) => {
                            if (!dragSrcTab) {
                                // 如果移动了但还没进入拖拽状态，取消定时器
                                if (e.touches.length > 0) clearTimeout(touchTimer);
                                return;
                            }
                            
                            e.preventDefault(); // 阻止页面滚动
                            
                            const touch = e.touches[0];
                            const targetEl = document.elementFromPoint(touch.clientX, touch.clientY);
                            
                            if (targetEl) {
                                const targetTab = targetEl.closest('.tab-btn[data-module]');
                                if (targetTab && targetTab !== dragSrcTab.querySelector('.tab-btn')) {
                                    // 更新紫色的提示线位置
                                    const rect = targetTab.getBoundingClientRect();
                                    const isAbove = touch.clientY < rect.top + rect.height / 2;
                                    const lineY = isAbove ? rect.top - 5 : rect.bottom + 5;
                                    
                                    dragLine.style.display = 'block';
                                    dragLine.style.top = (lineY + window.scrollY) + 'px';
                                    dragLine.style.left = rect.left + 'px';
                                }
                            }
                        }, { passive: false });

                        wrapper.addEventListener('touchend', (e) => {
                            clearTimeout(touchTimer);
                            if (!dragSrcTab) return;
                            
                            e.preventDefault();
                            dragLine.style.display = 'none';
                            wrapper.style.opacity = '1';

                            const touch = e.changedTouches[0];
                            const targetEl = document.elementFromPoint(touch.clientX, touch.clientY);
                            
                            if (targetEl) {
                                const targetTab = targetEl.closest('.tab-btn[data-module]');
                                if (targetTab && targetTab !== dragSrcTab.querySelector('.tab-btn')) {
                                    const rect = targetTab.getBoundingClientRect();
                                    const isAbove = touch.clientY < rect.top + rect.height / 2;
                                    const targetWrapper = targetTab.closest('.custom-tab-wrapper') || targetTab;
                                    
                                    if (isAbove) {
                                        targetWrapper.parentNode.insertBefore(dragSrcTab, targetWrapper);
                                    } else {
                                        targetWrapper.parentNode.insertBefore(dragSrcTab, targetWrapper.nextSibling);
                                    }
                                    
                                    // 强制基础卡片顺序
                                    let lastFixed = null;
                                    DEFAULT_LAYER_ORDER.forEach(moduleKey => {
                                        const btn = container.querySelector(`.tab-btn[data-module="${moduleKey}"]`);
                                        if (!btn) return;
                                        const bWrap = btn.closest('.custom-tab-wrapper') || btn;
                                        if (lastFixed && !(lastFixed.compareDocumentPosition(bWrap) & Node.DOCUMENT_POSITION_FOLLOWING)) {
                                            container.insertBefore(bWrap, lastFixed.nextSibling);
                                        }
                                        lastFixed = bWrap;
                                    });
                                    
                                    drawPreview();
                                }
                            }
                            dragSrcTab = null;
                        });
                    }

                    wrapper.addEventListener('dragover', (e) => {
                        if (!dragSrcTab || dragSrcTab === wrapper) return;
                        e.preventDefault();
                        e.dataTransfer.dropEffect = 'move';

                        const rect = wrapper.getBoundingClientRect();
                        const isAbove = (e.clientY - rect.top) < rect.height / 2;
                        
                        // 找到容器的所有有效卡片
                        const allTabs = Array.from(document.querySelectorAll('#moduleTabs .tab-btn[data-module]'));
                        const validTabs = allTabs.filter(el => el !== dragSrcTab && el !== dragSrcTab.querySelector('.tab-btn'));
                        const idx = validTabs.indexOf(tab);
                        
                        let lineY = 0;
                        if (isAbove) {
                            // 想插在前面：画在当前卡片上边缘，和上一张卡片下边缘的正中间
                            if (idx > 0) {
                                const prevRect = validTabs[idx - 1].getBoundingClientRect();
                                lineY = (prevRect.bottom + rect.top) / 2;
                            } else {
                                lineY = rect.top - 5;
                            }
                        } else {
                            // 想插在后面：画在当前卡片下边缘，和下一张卡片上边缘的正中间
                            if (idx < validTabs.length - 1) {
                                const nextRect = validTabs[idx + 1].getBoundingClientRect();
                                lineY = (rect.bottom + nextRect.top) / 2;
                            } else {
                                lineY = rect.bottom + 5;
                            }
                        }
                        
                        dragLine.style.display = 'block';
                        dragLine.style.top = (lineY + window.scrollY - 2) + 'px';
                        dragLine.style.left = rect.left + 'px'; /* 去掉 -28，让左边缘和按钮对齐 */
                    });

                    wrapper.addEventListener('dragleave', () => {
                        hideDragLine();
                    });

                    wrapper.addEventListener('drop', (e) => {
                        if (!dragSrcTab || dragSrcTab === wrapper) return;
                        e.preventDefault();
                        const container = wrapper.parentNode;
                        const rect = wrapper.getBoundingClientRect();
                        const isAbove = (e.clientY - rect.top) < rect.height / 2;

                        // 插入 DOM
                        if (isAbove) {
                            container.insertBefore(dragSrcTab, wrapper);
                        } else {
                            container.insertBefore(dragSrcTab, wrapper.nextSibling);
                        }

                        // 强制固定基础顺序
                        let lastFixed = null;
                        DEFAULT_LAYER_ORDER.forEach(moduleKey => {
                            const btn = container.querySelector(`.tab-btn[data-module="${moduleKey}"]`);
                            if (!btn) return;
                            const bWrap = btn.closest('.custom-tab-wrapper') || btn;
                            if (lastFixed && !(lastFixed.compareDocumentPosition(bWrap) & Node.DOCUMENT_POSITION_FOLLOWING)) {
                                container.insertBefore(bWrap, lastFixed.nextSibling);
                            }
                            lastFixed = bWrap;
                        });

                        hideDragLine();
                        drawPreview();
                    });
                });

                // 全局强制拦截：不论拖到哪里，只要越过首尾卡片中线，统统置顶或沉底
                document.addEventListener('dragover', (e) => {
                    if (!dragSrcTab) return;
                    
                    const allTabs = Array.from(container.querySelectorAll('.tab-btn[data-module]'));
                    const validTabs = allTabs.filter(el => el !== dragSrcTab && el !== dragSrcTab.querySelector('.tab-btn'));
                    if (validTabs.length === 0) return;

                    const firstTab = validTabs[0];
                    const lastTab = validTabs[validTabs.length - 1];
                    const firstRect = firstTab.getBoundingClientRect();
                    const lastRect = lastTab.getBoundingClientRect();
                    
                    // 1. 越过最后一张卡片中线 -> 沉底
                    if (e.clientY > lastRect.top + lastRect.height / 2) {
                        e.preventDefault();
                        e.dataTransfer.dropEffect = 'move';
                        dragLine.style.display = 'block';
                        dragLine.style.top = (lastRect.bottom + 5 + window.scrollY) + 'px';
                        
                        const lastWrapper = lastTab.closest('.custom-tab-wrapper') || lastTab;
                        dragLine.style.left = lastWrapper.getBoundingClientRect().left + 'px';
                    }
                    // 2. 越过第一张卡片中线 -> 置顶
                    else if (e.clientY < firstRect.top + firstRect.height / 2) {
                        e.preventDefault();
                        e.dataTransfer.dropEffect = 'move';
                        dragLine.style.display = 'block';
                        dragLine.style.top = (firstRect.top - 7 + window.scrollY) + 'px';
                        
                        const firstWrapper = firstTab.closest('.custom-tab-wrapper') || firstTab;
                        dragLine.style.left = firstWrapper.getBoundingClientRect().left + 'px';
                    }
                });

                document.addEventListener('drop', (e) => {
                    if (!dragSrcTab) return;
                    
                    const allTabs = Array.from(container.querySelectorAll('.tab-btn[data-module]'));
                    const validTabs = allTabs.filter(el => el !== dragSrcTab && el !== dragSrcTab.querySelector('.tab-btn'));
                    if (validTabs.length === 0) return;

                    const firstTab = validTabs[0];
                    const lastTab = validTabs[validTabs.length - 1];
                    const firstRect = firstTab.getBoundingClientRect();
                    const lastRect = lastTab.getBoundingClientRect();
                    
                    // 1. 如果在最后一张下方松手 -> 沉底
                    if (e.clientY > lastRect.top + lastRect.height / 2) {
                        e.preventDefault();
                        e.stopPropagation();
                        
                        container.appendChild(dragSrcTab);
                        
                        let lastFixed = null;
                        DEFAULT_LAYER_ORDER.forEach(moduleKey => {
                            const btn = container.querySelector(`.tab-btn[data-module="${moduleKey}"]`);
                            if (!btn) return;
                            const bWrap = btn.closest('.custom-tab-wrapper') || btn;
                            if (lastFixed && !(lastFixed.compareDocumentPosition(bWrap) & Node.DOCUMENT_POSITION_FOLLOWING)) {
                                container.insertBefore(bWrap, lastFixed.nextSibling);
                            }
                            lastFixed = bWrap;
                        });
                        
                        hideDragLine();
                        dragSrcTab = null; 
                        drawPreview();
                    }
                    // 2. 如果在第一张上方松手 -> 置顶
                    else if (e.clientY < firstRect.top + firstRect.height / 2) {
                        e.preventDefault();
                        e.stopPropagation();
                        
                        container.insertBefore(dragSrcTab, firstTab.closest('.custom-tab-wrapper') || firstTab);
                        
                        let lastFixed = null;
                        DEFAULT_LAYER_ORDER.forEach(moduleKey => {
                            const btn = container.querySelector(`.tab-btn[data-module="${moduleKey}"]`);
                            if (!btn) return;
                            const bWrap = btn.closest('.custom-tab-wrapper') || btn;
                            if (lastFixed && !(lastFixed.compareDocumentPosition(bWrap) & Node.DOCUMENT_POSITION_FOLLOWING)) {
                                container.insertBefore(bWrap, lastFixed.nextSibling);
                            }
                            lastFixed = bWrap;
                        });
                        
                        hideDragLine();
                        dragSrcTab = null;
                        drawPreview();
                    }
                });
            }
            // 按窗口宽、高共同缩放，取能完整放下的最小比例；最小 0.5 防止字小到看不清
            function applyResponsiveScale() {
                const outer = document.querySelector('.app-outer');
                if (!outer) return;
                
                // 如果是手机屏幕尺寸（<= 768px），不进行强制缩放，完全依靠 CSS 上下堆叠
                if (window.innerWidth <= 768) {
                    outer.style.transform = 'none';
                    const scaler = outer.parentElement;
                    if (scaler) {
                        scaler.style.width = '100%';
                        scaler.style.height = '100%';
                    }
                    return;
                }

                const scaler = outer.parentElement;
                const titleEl = document.querySelector('.page-title');
                const footerEl = document.querySelector('.page-footer');
                // 先还原，量出设计尺寸
                outer.style.transform = 'none';
                const designWidth = outer.scrollWidth;
                const designHeight = outer.scrollHeight;
                // 页面顶部标题与底部署名占用的高度，也必须从可用高度里扣掉
                const titleH = titleEl ? titleEl.offsetHeight + 24 : 0;
                const footerH = footerEl ? footerEl.offsetHeight + 24 : 0;
                // 多留 32px 安全边距，避免不同系统滚动条或边框把边缘吃掉
                const availW = window.innerWidth - 32;
                const availH = window.innerHeight - titleH - footerH - 32;
                if (designWidth <= 0 || designHeight <= 0 || availH <= 0) return;
                const scaleW = availW / designWidth;
                const scaleH = availH / designHeight;
                const scale = Math.min(1, Math.max(0.45, Math.min(scaleW, scaleH)));
                outer.style.transform = `scale(${scale})`;
                outer.style.transformOrigin = 'top center';
                // 同步设置包装容器占位，避免缩小后留白不对称、边缘被吞
                if (scaler) {
                    scaler.style.width = (designWidth * scale) + 'px';
                    scaler.style.height = (designHeight * scale) + 'px';
                    scaler.style.margin = '0 auto';
                }

                // 【新增】动态限制左侧滚动区域（仅在 PC 端需要，手机端已经改成横向且自然滑动）
                const appEl = document.querySelector('.app');
                const tabsEl = document.getElementById('moduleTabs');
                const bottomFloat = document.getElementById('tabsBottomFloat');
                if (appEl && tabsEl && bottomFloat && window.innerWidth > 768) {
                    // 计算底部按钮占用的真实高度（包括 margin 和 padding）
                    const floatHeight = bottomFloat.offsetHeight + 30; 
                    // 将左侧列表的最大高度，限制在 大框高度减去 悬浮按钮高度
                    tabsEl.style.maxHeight = (appEl.offsetHeight - floatHeight) + 'px';
                }
            }

            window.addEventListener('resize', applyResponsiveScale);

            // 全局暴露一个复制方法，供弹窗里的动态按钮调用
            window.copyKeyText = function(key) {

                const showSuccess = () => {
                    // 隐藏弹窗里不需要的元素
                    document.getElementById('codeInputWrap').style.display = 'none';

                    showConfirm(`【${key}】 已复制到剪贴板！`, () => {
                        document.getElementById('confirmModal').classList.remove('show');
                        // 恢复取消按钮的显示，以免影响其他弹窗
                        document.getElementById('confirmCancel').style.display = 'block';
                    }, () => {});
                };

                navigator.clipboard.writeText(key).then(() => {
                    showSuccess();
                }).catch(err => {
                    // 兼容部分不支持的安全环境，老办法复制
                    const textarea = document.createElement('textarea');

                    document.execCommand('copy');

            };

            // ===== 全局悬浮提示框逻辑 =====
            const globalTooltip = document.getElementById('globalTooltip');
            
            function bindTooltip(elementId, text) {
                const el = document.getElementById(elementId);
                if (!el || !globalTooltip) return;

                el.addEventListener('mouseenter', (e) => {
                    globalTooltip.textContent = text;
                    globalTooltip.style.display = 'block';
                    
                    // 获取按钮位置，将提示框定在按钮正下方
                    const rect = el.getBoundingClientRect();
                    // 水平居中：按钮中心点 X 坐标
                    const centerX = rect.left + rect.width / 2;
                    globalTooltip.style.left = centerX + 'px';
                    globalTooltip.style.top = (rect.bottom + 8) + 'px';
                    
                    // 等浏览器渲染出 display: block 后，再加 show 类触发动画
                    requestAnimationFrame(() => {
                        globalTooltip.classList.add('show');
                    });
                });

                el.addEventListener('mouseleave', () => {
                    globalTooltip.classList.remove('show');
                    // 等动画结束（0.2秒）后彻底隐藏
                    setTimeout(() => {
                        if (!globalTooltip.classList.contains('show')) {
                            globalTooltip.style.display = 'none';
                        }
                    }, 200);
                });
            }

            bindTooltip('exportBodyBtn', '单独导出当前选择的素体');
            // 导入素材的提示已删除

            init();

            // 每次打开网页都弹出提示（测试用，去掉了 localStorage 缓存判断）
            setTimeout(() => {
                const isMobile = window.innerWidth <= 768;
                
                // 强制关闭可能还在转场的旧弹窗
                document.getElementById('confirmModal').classList.remove('show');

                const modalTitle = document.querySelector('#confirmModal .modal-title');
                if (modalTitle) modalTitle.style.display = 'none';
                document.getElementById('confirmCancel').style.display = 'none';
                
                const okBtn = document.getElementById('confirmOk');
                if (okBtn) {
                    okBtn.style.flex = '0 0 160px';
                    okBtn.style.margin = '0 auto';
                }
                const btnWrap = document.querySelector('#confirmModal .confirm-actions');
                if (btnWrap) {
                    btnWrap.style.justifyContent = 'center';
                }

                let msg = '<div style="text-align: left; font-size: 13px; line-height: 1.6; color: #b7b7d0; padding: 0 5px;">';

                // 1. 手机端阉割警告（前置）
                if (isMobile) {
                    msg += `
                        <div style="color: #d4b872; font-weight: 600; margin-bottom: 8px; font-size: 14px;">手机端注意事项：</div>
                        <div style="color: #d4b872; margin-bottom: 10px;">IOS和鸿蒙系统暂时无法正常使用调色功能（或许还有其他系统但暂时没有bug反馈）。</div>
                        <div style="color: #d4b872; margin-bottom: 10px;">且出于排版的考量，手机版阉割掉了一些支持自主上传素材的功能，如果想完整体验，请尽量在PC端使用本网页。</div>
                    `;
                    // 手机端加一条分割线
                    msg += '<div style="height: 1px; background: rgba(255,255,255,0.1); margin: 15px 0;"></div>'; 
                }

                // 2. 使用规约
                msg += `
                    <div style="color: #e5e5ff; font-weight: 600; margin-bottom: 8px; font-size: 14px;">使用规约：</div>
                    <div style="margin-bottom: 10px; color: #b7b7d0;">本网站所使用的所有行走图素材均为本人绘制，主要目的是让不会绘制像素行走图的同事也能在【刀剑乱舞线上only】中定制一套比较个性化的入场行走图。</div>
                    <div style="color: #ff8f8f; margin-bottom: 10px; font-weight: 600;">禁止任何形式的商用，也不可以用来印刷物料。</div>
                    <div style="margin-bottom: 10px; color: #b7b7d0;">可以在制作同人游戏时使用，需要保留署名并且向我报备一下。</div>
                `;

                msg += '</div>';

                showConfirm(msg, () => {
                    document.getElementById('confirmModal').classList.remove('show');
                    
                    // 恢复弹窗默认样式
                    if (modalTitle) {
                        modalTitle.style.display = 'block';
                        modalTitle.textContent = '提示';
                    }
                    document.getElementById('confirmCancel').style.display = 'block';
                    if (okBtn) {
                        okBtn.style.flex = '';
                        okBtn.style.margin = '';
                    }
                    if (btnWrap) {
                        btnWrap.style.justifyContent = '';
                    }
                }, () => {});
                
            }, 500);
        })();
    </script><div class="drag-indicator-line"></div>

</body></html>
