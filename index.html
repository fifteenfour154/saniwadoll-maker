                const rowHeight = Math.floor(h / 4);

                let bestBlock = { x: 0, y: 0 };

                if (moduleKey === 'accessory') {
                    const imgData = tempCtx.getImageData(0, 0, w, h);
                    const data = imgData.data;
                    const midColIndex = 1; 
                    let maxPixels = -1;
                    for (let row = 0; row < 4; row++) {
                        const startX = midColIndex * colWidth;
                        const startY = row * rowHeight;
                        let opaqueCount = 0;
                        for (let y = startY; y < startY + rowHeight; y++) {
                            for (let x = startX; x < startX + colWidth; x++) {
                                const index = (y * w + x) * 4;
                                if (data[index + 3] > 10) opaqueCount++;
                            }
                        }
                        if (opaqueCount > maxPixels) {
                            maxPixels = opaqueCount;
                            bestBlock = { x: startX, y: startY };
                        }
                    }
                } else if (moduleKey === 'backHair') {
                    const imgData = tempCtx.getImageData(0, 0, w, h);
                    const data = imgData.data;
                    let maxPixels = -1;
                    for (let row = 0; row < 4; row++) {
                        for (let col = 0; col < 3; col++) {
                            const startX = col * colWidth;
                            const startY = row * rowHeight;
                            const endX = Math.min(startX + colWidth, w);
                            const endY = Math.min(startY + rowHeight, h);
                            let opaqueCount = 0;
                            for (let y = startY; y < endY; y++) {
                                for (let x = startX; x < endX; x++) {
                                    const index = (y * w + x) * 4;
                                    if (data[index + 3] > 10) opaqueCount++;
                                }
                            }
                            if (opaqueCount > maxPixels) {
                                maxPixels = opaqueCount;
                                bestBlock = { x: startX, y: startY };
                            }
                        }
                    }
                } else {
                    bestBlock = { x: 1 * colWidth, y: 0 * rowHeight };
                }

                const blockW = Math.min(colWidth, w - bestBlock.x);
                const blockH = Math.min(rowHeight, h - bestBlock.y);

                const blockCanvas = document.createElement('canvas');
                blockCanvas.width = blockW;
                blockCanvas.height = blockH;
                const blockCtx = blockCanvas.getContext('2d');
                blockCtx.drawImage(tempCanvas, bestBlock.x, bestBlock.y, blockW, blockH, 0, 0, blockW, blockH);

                const blockImgData = blockCtx.getImageData(0, 0, blockW, blockH);
                const bData = blockImgData.data;
                let minX = blockW, minY = blockH, maxX = 0, maxY = 0;
                let hasPixel = false;

                for (let y = 0; y < blockH; y++) {
                    for (let x = 0; x < blockW; x++) {
                        const idx = (y * blockW + x) * 4;
                        if (bData[idx + 3] > 10) {
                            hasPixel = true;
                            if (x < minX) minX = x;
                            if (x > maxX) maxX = x;
                            if (y < minY) minY = y;
                            if (y > maxY) maxY = y;
                        }
                    }
                }

                if (!hasPixel) {
                    const outCanvas = document.createElement('canvas');
                    outCanvas.width = 100;
                    outCanvas.height = 100;
                    const outCtx = outCanvas.getContext('2d');
                    outCtx.drawImage(blockCanvas, 0, 0, blockW, blockH, 0, 0, 100, 100);
                    return outCanvas.toDataURL();
                }

                const cropW = maxX - minX + 1;
                const cropH = maxY - minY + 1;

                const thumbSize = 100;
                const outCanvas = document.createElement('canvas');
                outCanvas.width = thumbSize;
                outCanvas.height = thumbSize;
                const outCtx = outCanvas.getContext('2d');
                outCtx.imageSmoothingEnabled = false;

                const scale = Math.min(thumbSize / cropW, thumbSize / cropH);
                const drawW = cropW * scale;
                const drawH = cropH * scale;

                const offsetX = (thumbSize - drawW) / 2;
                const offsetY = (thumbSize - drawH) / 2;

                outCtx.drawImage(
                    blockCanvas,
                    minX, minY, cropW, cropH,
                    offsetX, offsetY, drawW, drawH
                );

                return outCanvas.toDataURL();
            }

            // ---------------- 绘制逻辑（预览：逻辑尺寸 = 原图，CSS 整数倍放大） ----------------
            function drawPreview() {
                // 移除这里的防呆锁，因为它会在导入素材、还没选中时把数据重置为空
                // 角色数据的同步已经在切换标签和拖动滑条时处理了
                
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#2a2737';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#353142';
                for (let i = 0; i < canvas.width; i += 20) {
                    for (let j = 0; j < canvas.height; j += 20) {
                        ctx.fillRect(i, j, 1, 1);
                    }
                }

                const drawOrder = [...getLayerOrder()].reverse(); 
                
                // ===== 特殊处理：后发第一行强行垫底 =====
                const bhOptionId = selected['backHair'];
                if (bhOptionId && bhOptionId !== 'none') {
                    const bhImg = imageCache[`backHair_${bhOptionId}`];
                    if (bhImg && bhImg.complete && bhImg.naturalWidth > 0) {
                        // 只画第一行：原图高度除以4
                        const rowHeight = bhImg.naturalHeight / 4;
                        ctx.save();
                        ctx.beginPath();
                        // 裁剪画布，只允许在第一行的高度范围内绘制
                        ctx.rect(0, 0, canvas.width, rowHeight);
                        ctx.clip();
                        drawFilteredImage(ctx, bhImg, 0, 0, canvas.width, canvas.height, colorData['backHair']);
                        ctx.restore();
                    }
                }

                // ===== 正常渲染其他图层 =====
                for (let moduleKey of drawOrder) {
                    const optionId = selected[moduleKey];
                    if (!optionId || optionId === 'none') continue; 
                    const imgKey = `${moduleKey}_${optionId}`;
                    const img = imageCache[imgKey];
                    if (img && img.complete && img.naturalWidth > 0) {
                        const bhIndex = drawOrder.indexOf('backHair');
                        const bodyIndex = drawOrder.indexOf('body');
                        
                        if (moduleKey === 'backHair' && bhIndex > bodyIndex) {
                            const rowHeight = img.naturalHeight / 4;
                            ctx.save();
                            ctx.beginPath();
                            ctx.rect(0, rowHeight, canvas.width, canvas.height - rowHeight);
                            ctx.clip();
                            drawFilteredImage(ctx, img, 0, 0, canvas.width, canvas.height, colorData[moduleKey]);
                            ctx.restore();
                        } else {
                            drawFilteredImage(ctx, img, 0, 0, canvas.width, canvas.height, colorData[moduleKey]);
                        }
                    }

                    // 【新增】画副部件
                    if (subCache[imgKey]) {
                        for (const subTag in subCache[imgKey]) {
                            const subImg = subCache[imgKey][subTag];
                            // 严格获取该副部件的颜色，如果没有则使用默认白色
                            const sColor = (subColor[imgKey] && subColor[imgKey][subTag]) ? subColor[imgKey][subTag] : { tint: '#ffffff', hue: 0, sat: 100, bri: 100 };
                            
                            if (subImg && subImg.complete && subImg.naturalWidth > 0) {
                                drawFilteredImage(ctx, subImg, 0, 0, canvas.width, canvas.height, sColor);
                            }
                        }
                    }
                }
                drawDynamicFrame();
            }

            function drawFilteredImage(context, img, dx, dy, dw, dh, color) {
                context.save();
                
                let filterStr = '';
                if (color.hue !== 0) filterStr += `hue-rotate(${color.hue}deg) `;
                if (color.sat !== 100) filterStr += `saturate(${color.sat}%) `;
                if (color.bri !== 100) filterStr += `brightness(${color.bri}%) `;
                
                if (filterStr) {
                    context.filter = filterStr.trim();
                }

                context.drawImage(img, dx, dy, dw, dh);

                if (color.tint !== '#ffffff') {
                    const tempCanvas = document.createElement('canvas');
                    tempCanvas.width = dw;
                    tempCanvas.height = dh;
                    const tempCtx = tempCanvas.getContext('2d');
                    // 关闭平滑，防止调色时像素被重采样而变糊
                    tempCtx.imageSmoothingEnabled = false;
                    
                    tempCtx.drawImage(img, 0, 0, dw, dh);
                    
                    tempCtx.globalCompositeOperation = 'multiply';
                    tempCtx.fillStyle = color.tint;
                    tempCtx.fillRect(0, 0, dw, dh);
                    
                    tempCtx.globalCompositeOperation = 'destination-in';
                    tempCtx.drawImage(img, 0, 0, dw, dh);

                    context.filter = ''; 
                    context.drawImage(tempCanvas, dx, dy, dw, dh);
                }

                context.restore();
            }

            // ---------------- 动态预览（1→2→3→2→1 列循环，每列 5 帧） ----------------
            // 按 30 帧/秒计，每列 5 帧即停留约 1/6 秒；列号从 0 起：0=第1列，2=第3列
            const DYN_FRAMES_PER_COL = 5;
            const DYN_COL_SEQUENCE = [0, 1, 2, 1];
            let dynSeqIndex = 0;
            let dynFrameCount = 0;
            let dynRafId = null;

            function drawDynamicFrame() {
                dynCtx.clearRect(0, 0, dynCanvas.width, dynCanvas.height);
                dynCtx.fillStyle = '#2a2737';
                dynCtx.fillRect(0, 0, dynCanvas.width, dynCanvas.height);

                const colIndex = DYN_COL_SEQUENCE[dynSeqIndex];
                // 以原始整图宽度为基准算列宽，动态画布只显示一列
                const fullW = baseWidth;
                const colW = Math.floor(fullW / 3);
                const srcX = colIndex * colW;

                const drawOrder = [...getLayerOrder()].reverse();
                
                // ===== 特殊处理：后发第一行强行垫底（动态预览） =====
                const bhOptionId = selected['backHair'];
                if (bhOptionId && bhOptionId !== 'none') {
                    const bhImg = imageCache[`backHair_${bhOptionId}`];
                    if (bhImg && bhImg.complete && bhImg.naturalWidth > 0) {
                        // 算出单行的高度（总高除以 4）
                        const rowHeight = baseHeight / 4;
                        dynCtx.save();
                        dynCtx.beginPath();
                        // 裁剪画布：只允许在第一行的高度范围内绘制
                        dynCtx.rect(0, 0, dynCanvas.width, rowHeight);
                        dynCtx.clip();
                        // 绘制当前列的第一行
                        drawFilteredImage(dynCtx, bhImg, -srcX, 0, fullW, baseHeight, colorData['backHair']);
                        dynCtx.restore();
                    }
                }

                // ===== 正常渲染其他图层 =====
                for (let moduleKey of drawOrder) {
                    const optionId = selected[moduleKey];
                    if (!optionId || optionId === 'none') continue;
                    const imgKey = `${moduleKey}_${optionId}`;
                    const img = imageCache[imgKey];
                    if (img && img.complete && img.naturalWidth > 0) {
                        const bhIndex = drawOrder.indexOf('backHair');
                        const bodyIndex = drawOrder.indexOf('body');
                        
                        if (moduleKey === 'backHair' && bhIndex > bodyIndex) {
                            // 后发在素体上方：跳过第一行，只画第 2、3、4 行
                            const rowHeight = baseHeight / 4;
                            dynCtx.save();
                            dynCtx.beginPath();
                            // 裁剪掉第一行，保留剩下的区域
                            dynCtx.rect(0, rowHeight, dynCanvas.width, dynCanvas.height - rowHeight);
                            dynCtx.clip();
                            drawFilteredImage(dynCtx, img, -srcX, 0, fullW, baseHeight, colorData[moduleKey]);
                            dynCtx.restore();
                        } else {
                            // 其他图层照常全画
                            dynCtx.save();
                            dynCtx.beginPath();
                            dynCtx.rect(0, 0, dynCanvas.width, dynCanvas.height);
                            dynCtx.clip();
                            drawFilteredImage(dynCtx, img, -srcX, 0, fullW, baseHeight, colorData[moduleKey]);
                            dynCtx.restore();
                        }
                    }

                    // 【新增】画副部件（动态预览）
                    if (subCache[imgKey]) {
                        for (const subTag in subCache[imgKey]) {
                            const subImg = subCache[imgKey][subTag];
                            const sColor = (subColor[imgKey] && subColor[imgKey][subTag]) ? subColor[imgKey][subTag] : defaultColorObj;
                            
                            if (subImg && subImg.complete && subImg.naturalWidth > 0) {
                                dynCtx.save();
                                dynCtx.beginPath();
                                dynCtx.rect(0, 0, dynCanvas.width, dynCanvas.height);
                                dynCtx.clip();
                                drawFilteredImage(dynCtx, subImg, -srcX, 0, fullW, baseHeight, sColor);
                                dynCtx.restore();
                            }
                        }
                    }
                }
            }

            function dynTick() {
                dynFrameCount++;
                if (dynFrameCount >= DYN_FRAMES_PER_COL) {
                    dynFrameCount = 0;
                    dynSeqIndex = (dynSeqIndex + 1) % DYN_COL_SEQUENCE.length;
                    drawDynamicFrame();
                }
            }

            function startDynPreview() {
                if (dynRafId === null) {
                    drawDynamicFrame();
                    // 约 30 帧/秒触发一次，每 5 次换一列
                    dynRafId = setInterval(dynTick, 33);
                }
            }

            // ---------------- 角色标签栏渲染与交互 ----------------
            
            // 封装新的命名弹窗控制逻辑
            const charNameModal = document.getElementById('charNameModal');
            const charNameInput = document.getElementById('charNameInput');
            const charNameErr = document.getElementById('charNameErr');
            const charNameTitle = document.getElementById('charNameTitle');
            let charNameCallback = null;

            function showPrompt(title, defaultVal, callback) {
                charNameCallback = callback;
                charNameTitle.textContent = title;
                charNameInput.value = defaultVal;
                charNameErr.textContent = '';
                charNameModal.classList.add('show');
                charNameInput.focus();
                charNameInput.select();
            }

            document.getElementById('charNameCancel').addEventListener('click', () => {
                charNameModal.classList.remove('show');
                charNameCallback = null;
            });

            document.getElementById('charNameOk').addEventListener('click', () => {
                const name = charNameInput.value.trim();
                if (!name) {
                    charNameErr.textContent = '名称不能为空';
                    return;
                }
                charNameModal.classList.remove('show');
                if (charNameCallback) {
                    charNameCallback(name);
                    charNameCallback = null;
                }
            });

            // 支持回车确认
            charNameInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    document.getElementById('charNameOk').click();
                }
            });

            function renderCharacterTabs() {
                const container = document.getElementById('charTabs');
                let html = '';
                
                characters.forEach((char, index) => {
                    // 优先显示自定义的 name，如果没有则显示默认的“角色 N”
                    const displayName = char.name || `角色 ${index + 1}`;
                    html += `<div class="char-tab ${index === activeCharIndex ? 'active' : ''}" data-index="${index}">${displayName}</div>`;
                });
                
                // 把按钮包在 wrapper 里拼进去，利用 wrapper 的 margin-left: auto 顶到最右边
                html += `<div class="add-char-wrapper"><div class="char-tab add-char" id="addCharBtn">＋ 新建角色</div></div>`;
                container.innerHTML = html;

                // 绑定切换事件
                container.querySelectorAll('.char-tab[data-index]').forEach(tab => {
                    tab.addEventListener('click', () => {
                        const newIndex = parseInt(tab.dataset.index);
                        if (newIndex === activeCharIndex) return;
                        
                        // 1. 把当前角色的最新数据存回数组
                        characters[activeCharIndex].selected = { ...selected };
                        characters[activeCharIndex].colorData = JSON.parse(JSON.stringify(colorData));
                        // 核心修复：把副部件颜色也存进去
                        characters[activeCharIndex].subColor = JSON.parse(JSON.stringify(subColor));
                        
                        // 2. 切换到新角色，并恢复新角色的数据
                        activeCharIndex = newIndex;
                        Object.assign(selected, characters[activeCharIndex].selected || {});
                        
                        // 清空当前的颜色数据，防止其他角色多余的字段污染这里
                        for (let k in colorData) delete colorData[k];
                        Object.assign(colorData, characters[activeCharIndex].colorData || {});
                        // 核心修复：恢复该角色的副部件颜色（如果没有，则清空）
                        for (let k in subColor) delete subColor[k];
                        Object.assign(subColor, characters[activeCharIndex].subColor || {});
                        
                        // 3. 刷新界面
                        activeSubTag = null; // 切换角色时重置子部件选中状态
                        renderCharacterTabs();
                        renderOptionsPanel();
                        renderSubSlots(); // 刷新右侧的调色部件列表
                        updateTunePanelUI();
                        drawPreview();
                    });

                    // 绑定右键弹出菜单
                    tab.addEventListener('contextmenu', (e) => {
                        e.preventDefault();
                        e.stopPropagation();
                        
                        const index = parseInt(tab.dataset.index);
                        const menu = document.getElementById('contextMenu');
                        menu.style.left = e.clientX + 'px';
                        menu.style.top = e.clientY + 'px';
                        menu.classList.add('show');

                        // 右键角色时，显示“删除角色”选项
                        document.getElementById('menuDeleteCharBtn').style.display = 'block';

                        // 覆盖原有的右键菜单点击事件，让它执行修改角色的逻辑
                        document.getElementById('menuEditBtn').onclick = () => {
                            menu.classList.remove('show');
                            showPrompt('修改角色名称', characters[index].name || `角色 ${index + 1}`, (newName) => {
                                if (newName) {
                                    characters[index].name = newName;
                                    renderCharacterTabs();
                                }
                            });
                        };

                        // 绑定删除角色的逻辑
                        document.getElementById('menuDeleteCharBtn').onclick = () => {
                            menu.classList.remove('show');
                            
                            // 如果只剩一个角色，提示不能删除
                            if (characters.length <= 1) {
                                showConfirm('这是唯一的一个角色，无法删除！', () => {
                                    document.getElementById('confirmModal').classList.remove('show');
                                }, () => {
                                    document.getElementById('confirmModal').classList.remove('show');
                                });
                                return;
                            }
                            
                            const charName = characters[index].name || `角色 ${index + 1}`;
                            
                            // 弹出确认框
                            showConfirm(`确定要删除角色「${charName}」吗？此操作不可恢复。`, () => {
                                // 从数组里移除该角色
                                characters.splice(index, 1);
                                
                                // 如果删除的是当前选中的角色（或者在它后面的），修正当前选中的索引
                                if (activeCharIndex >= characters.length) {
                                    activeCharIndex = characters.length - 1;
                                } else if (activeCharIndex > index) {
                                    activeCharIndex--;
                                } else if (activeCharIndex === index) {
                                    // 如果删的就是当前，则默认选中第一个
                                    activeCharIndex = 0;
                                }
                                
                                // 刷新数据状态并重绘
                                Object.assign(selected, characters[activeCharIndex].selected || {});
                                for (let k in colorData) delete colorData[k];
                                Object.assign(colorData, characters[activeCharIndex].colorData || {});
                                
                                renderCharacterTabs();
                                renderOptionsPanel();
                                updateTunePanelUI();
                                drawPreview();
                                
                                // 删除成功后关闭弹窗
                                document.getElementById('confirmModal').classList.remove('show');
                            }, () => {
                                // 取消删除也关闭弹窗
                                document.getElementById('confirmModal').classList.remove('show');
                            });
                        };
                    });
                });

                // 绑定新建事件
                const addBtn = document.getElementById('addCharBtn');
                if (addBtn) {
                    addBtn.addEventListener('click', () => {
                        // 弹出命名窗口
                        showPrompt('新建角色', `审神者 ${characters.length + 1}`, (newName) => {
                            if (!newName) return;
                            
                            // 1. 保存当前角色数据
                            characters[activeCharIndex].selected = { ...selected };
                            characters[activeCharIndex].colorData = JSON.parse(JSON.stringify(colorData));
                            
                            // 2. 新建一个角色（完全复制当前角色的样貌）
                            const newChar = {
                                name: newName,
                                selected: { ...selected },
                                colorData: JSON.parse(JSON.stringify(colorData)),
                                subColor: JSON.parse(JSON.stringify(subColor)) // 核心修复：新建时克隆副部件颜色
                            };
                            
                            // 3. 追加到数组并切换过去
                            characters.push(newChar);
                            activeCharIndex = characters.length - 1;
                            
                            // 4. 刷新界面
                            renderCharacterTabs();
                            drawPreview();
                        });
                    });
                }
            }

            // ---------------- 阵列方块选项面板渲染 ----------------
            const tabs = document.querySelectorAll('.tab-btn');
            const optionsPanel = document.getElementById('optionsPanel');
            let activeModule = 'accessory';

            function renderOptionsPanel() {
                const options = dynamicOptions[activeModule] || [];
                const currentSelectedId = selected[activeModule];

                let html = '';

                const isNoneSelected = (currentSelectedId === 'none' || currentSelectedId === null);
                html += `<div class="option-block none-block ${isNoneSelected ? 'selected' : ''}" data-option-id="none" title="不显示（无）">
                    ❌
                </div>`;

                if (options.length === 0) {
                    html += `<div style="grid-column: 1 / -1; color:#7d7799; font-size:12px; text-align:center; padding:20px;">暂无素材，请点击导入</div>`;
                } else {
                    options.forEach(opt => {
                        const isSelected = (opt.id === currentSelectedId);
                        const imgKey = `${activeModule}_${opt.id}`;
                        const thumbUrl = thumbCache[imgKey] || '';
                        
                        html += `<div class="option-block ${isSelected ? 'selected' : ''}" data-option-id="${opt.id}">
                            ${thumbUrl ? `<img src="${thumbUrl}" alt="${opt.name}">` : ''}
                            <div class="tooltip">${opt.name}</div>
                        </div>`;
                    });
                }

                optionsPanel.innerHTML = html;

                document.querySelectorAll('.option-block').forEach(item => {
                    item.addEventListener('click', () => {
                        const optionId = item.dataset.optionId;
                        if (optionId === 'none') {
                            selected[activeModule] = null;
                        } else {
                            selected[activeModule] = optionId;
                        }
                        
                        document.querySelectorAll('.option-block').forEach(el => el.classList.remove('selected'));
                        item.classList.add('selected');
                        
                        // 实时同步保存到当前角色的数据里
                        characters[activeCharIndex].selected = { ...selected };
                        
                        // 重置子部件选中状态，并刷新右侧调色部件列表
                        activeSubTag = null;
                        renderSubSlots();
                        
                        drawPreview();
                    });
                });
            }

            // 更新调色面板的UI
            const tintColor = document.getElementById('tintColor');
            
            // ===== 自定义色块阵列逻辑 =====
            const colorPaletteModal = document.getElementById('colorPaletteModal');
            const baseColorGrid = document.getElementById('baseColorGrid');
            const shadeColorGrid = document.getElementById('shadeColorGrid');
            const hexInput = document.getElementById('hexInput');
            const colorPaletteCancel = document.getElementById('colorPaletteCancel');

            // 预设的 10 种基础色相
            const baseHues = [
                { h: 0, name: '红' }, { h: 30, name: '橙' }, { h: 60, name: '黄' },
                { h: 120, name: '绿' }, { h: 180, name: '青' }, { h: 210, name: '蓝' },
                { h: 270, name: '紫' }, { h: 300, name: '品红' }, { h: 330, name: '粉' },
                { h: 0, s: 0, name: '灰' }
            ];

            // 生成第一层（基础色）
            function renderBaseGrid() {
                let html = '';
                baseHues.forEach((hue, index) => {
                    const hex = hslToHex(hue.h, hue.s || 100, 50);
                    // 当前选中的高亮
                    html += `<div class="base-color-block" data-hue="${hue.h}" data-s="${hue.s || 100}" data-color="${hex}" style="width: 100%; aspect-ratio: 1; border-radius: 6px; background: ${hex}; cursor: pointer; border: 1px solid rgba(255,255,255,0.1); transition: transform 0.1s;" title="${hue.name}"></div>`;
                });
                baseColorGrid.innerHTML = html;
                
                // 默认选中第一个红色，并生成第二层
                renderShadeGrid(baseHues[0].h, baseHues[0].s || 100);

                baseColorGrid.querySelectorAll('.base-color-block').forEach(block => {
                    block.addEventListener('click', () => {
                        // 清除其他选中状态
                        baseColorGrid.querySelectorAll('.base-color-block').forEach(b => {
                            b.style.border = '1px solid rgba(255,255,255,0.1)';
                            b.style.transform = 'scale(1)';
                        });
                        // 给当前选中的加高亮框
                        block.style.border = '2px solid #ffffff';
                        block.style.transform = 'scale(1.15)';

                        const h = parseInt(block.dataset.hue);
                        const s = parseInt(block.dataset.s);
                        renderShadeGrid(h, s);
                    });
                });
            }

            // 记录打开弹窗时的原始颜色，用于“取消”时恢复
            let originalColorBeforePicker = '#ffffff';
            // 记录当前正在预览的颜色
            let currentPreviewColor = '#ffffff';

            // 生成第二层（基于选中的色相生成白-黑渐变阵列）
            function renderShadeGrid(h, s) {
                if (!shadeColorGrid) return;
                let html = '';
                for (let row = 0; row < 6; row++) {
                    for (let col = 0; col < 10; col++) {
                        const l = 90 - (row * 14); 
                        const sat = 10 + (col * 10);
                        const hex = hslToHex(h, sat, l);
                        const finalHex = (s === 0) ? hslToHex(0, 0, l) : hex;

                        html += `<div class="shade-color-block" data-color="${finalHex}" style="width: 100%; aspect-ratio: 1; border-radius: 2px; background: ${finalHex}; cursor: pointer; border: 1px solid rgba(0,0,0,0.1); transition: transform 0.1s;"></div>`;
                    }
                }
                shadeColorGrid.innerHTML = html;
                
                shadeColorGrid.querySelectorAll('.shade-color-block').forEach(block => {
                    block.addEventListener('click', () => {
                        // 清空其他选中状态
                        shadeColorGrid.querySelectorAll('.shade-color-block').forEach(b => {
                            b.style.border = '1px solid rgba(0,0,0,0.1)';
                            b.style.transform = 'scale(1)';
                        });
                        // 给当前选中的加高亮框
                        block.style.border = '2px solid #ffffff';
                        block.style.transform = 'scale(1.15)';

                        const hex = block.dataset.color;
                        currentPreviewColor = hex;
                        
                        // 实时预览，但不关闭弹窗
                        tintColor.value = hex;
                        tintColor.dispatchEvent(new Event('change', { bubbles: true }));
                    });
                });
            }

            // 生成第一层（基础色）
            function renderBaseGrid() {
                if (!baseColorGrid) return;
                let html = '';
                baseHues.forEach((hue) => {
                    const hex = hslToHex(hue.h, hue.s || 100, 50);
                    html += `<div class="base-color-block" data-hue="${hue.h}" data-s="${hue.s || 100}" data-color="${hex}" style="width: 100%; aspect-ratio: 1; border-radius: 6px; background: ${hex}; cursor: pointer; border: 1px solid rgba(255,255,255,0.1); transition: transform 0.1s;" title="${hue.name}"></div>`;
                });
                baseColorGrid.innerHTML = html;
                
                // 默认选中第一个红色，并生成第二层
                renderShadeGrid(baseHues[0].h, baseHues[0].s || 100);

                baseColorGrid.querySelectorAll('.base-color-block').forEach(block => {
                    block.addEventListener('click', () => {
                        baseColorGrid.querySelectorAll('.base-color-block').forEach(b => {
                            b.style.border = '1px solid rgba(255,255,255,0.1)';
                            b.style.transform = 'scale(1)';
                        });
                        block.style.border = '2px solid #ffffff';
                        block.style.transform = 'scale(1.15)';

                        const h = parseInt(block.dataset.hue);
                        const s = parseInt(block.dataset.s);
                        renderShadeGrid(h, s);
                    });
                });
            }

            // HSL 转 Hex 的辅助函数
            function hslToHex(h, s, l) {
                s /= 100;
                l /= 100;
                const a = s * Math.min(l, 1 - l);
                const f = n => {
                    const k = (n + h / 30) % 12;
                    const color = l - a * Math.max(Math.min(k - 3, 9 - k, 1), -1);
                    return Math.round(255 * color).toString(16).padStart(2, '0');
                };
                return `#${f(0)}${f(8)}${f(4)}`;
            }

            // 自定义输入框
            if (hexInput) {
                hexInput.addEventListener('input', (e) => {
                    let val = e.target.value.trim();
                    if (/^#[0-9A-Fa-f]{6}$/.test(val)) {
                        currentPreviewColor = val;
                        tintColor.value = val;
                        tintColor.dispatchEvent(new Event('change', { bubbles: true }));
                    }
                });
            }

            // 初始化基础网格
            if (baseColorGrid) renderBaseGrid();
            
            // 点击“主色调”文字或色块时，打开面板
            const tintRow = tintColor.closest('.tune-row');
            if (tintRow) {
                tintRow.style.cursor = 'pointer';
                tintRow.addEventListener('click', (e) => {
                    if (e.target.tagName !== 'INPUT' && !e.target.classList.contains('tune-reset')) {
                        // 记录原始颜色用于取消
                        originalColorBeforePicker = tintColor.value;
                        currentPreviewColor = tintColor.value;
                        hexInput.value = currentPreviewColor;
                        
                        // 计算位置
                        const rect = tintRow.getBoundingClientRect();
                        colorPaletteModal.style.display = 'block';
                        
                        // 放在按钮下方，向左对齐（考虑到弹窗宽度 300px，防止超出屏幕右侧）
                        let leftPos = rect.left;
                        if (leftPos + 300 > window.innerWidth) {
                            leftPos = window.innerWidth - 310; // 靠右边留点缝隙
                        }
                        
                        colorPaletteModal.style.left = Math.max(10, leftPos) + 'px';
                        colorPaletteModal.style.top = (rect.bottom + 10) + 'px';
                        
                        if (baseColorGrid) renderBaseGrid();
                    }
                });
            }

            // 取消按钮：恢复原始颜色并关闭
            if (colorPaletteCancel) {
                colorPaletteCancel.addEventListener('click', () => {
                    tintColor.value = originalColorBeforePicker;
                    tintColor.dispatchEvent(new Event('change', { bubbles: true }));
                    colorPaletteModal.style.display = 'none';
                });
            }

            // 确定按钮：保留预览颜色并关闭
            const colorPaletteOk = document.getElementById('colorPaletteOk');
            if (colorPaletteOk) {
                colorPaletteOk.addEventListener('click', () => {
                    colorPaletteModal.style.display = 'none';
                });
            }
            
            // 如果你想保留原生调色板作为“高级选项”，可以给隐藏的 input 加上点击弹窗，但没必要
            // ==============================

            const hueSlider = document.getElementById('hueSlider');
            const satSlider = document.getElementById('satSlider');
            const briSlider = document.getElementById('briSlider');
            const hueVal = document.getElementById('hueVal');
            const satVal = document.getElementById('satVal');
            const briVal = document.getElementById('briVal');
            const resetBtn = document.getElementById('resetBtn');

            function updateTunePanelUI() {
                let data = colorData[activeModule];
                
                // 如果当前选中的是副部件，去读取副部件的数据
                if (activeSubTag !== null) {
                    const optionId = selected[activeModule];
                    const imgKey = `${activeModule}_${optionId}`;
                    if (subColor[imgKey] && subColor[imgKey][activeSubTag]) {
                        data = subColor[imgKey][activeSubTag];
                    } else {
                        // 如果找不到副部件的颜色，使用默认值兜底
                        data = { tint: '#ffffff', hue: 0, sat: 100, bri: 100 };
                    }
                }
                
                tintColor.value = data.tint;
                hueSlider.value = data.hue;
                satSlider.value = data.sat;
                briSlider.value = data.bri;
                hueVal.value = data.hue;
                satVal.value = data.sat;
                briVal.value = data.bri;
            }

            function setActiveModule(moduleKey) {
                activeModule = moduleKey;
                activeSubTag = null; // 切部件时重置子部件选中状态
                
                document.querySelectorAll('#moduleTabs .tab-btn[data-module]').forEach(btn => {
                    if (btn.dataset.module === moduleKey) {
                        btn.classList.add('active');
                    } else {
                        btn.classList.remove('active');
                    }
                });
                renderOptionsPanel();
                renderSubSlots(); // 渲染子部件窗口
                updateTunePanelUI();
            }

            // 渲染右侧的子部件列表
            function renderSubSlots() {
                const listContainer = document.getElementById('colorSlotList');
                if (!listContainer) return;
                
                const optionId = selected[activeModule];
                if (!optionId) {
                    // 如果没有选中任何部件，只显示主部件
                    listContainer.innerHTML = `<div style="font-size: 12px; color: #b7b7d0; text-align: center; padding: 10px 0; background: rgba(138,127,189,0.1); border-radius: 8px; border: 1px solid rgba(138,127,189,0.2);">主部件</div>`;
                    return;
                }

                // 这里的 imgKey 需要精准匹配
                const imgKey = `${activeModule}_${optionId}`;
                
                let html = '';
                // 主部件按钮
                const isMainActive = activeSubTag === null;
                html += `<div onclick="switchSubTag(null)" style="cursor: pointer; font-size: 12px; text-align: center; padding: 10px 0; border-radius: 8px; border: 1px solid ${isMainActive ? '#b9aaff' : 'rgba(138,127,189,0.2)'}; background: ${isMainActive ? 'rgba(138,127,189,0.3)' : 'rgba(138,127,189,0.1)'}; color: ${isMainActive ? '#fff' : '#b7b7d0'};">主部件</div>`;
                
                // 副部件按钮
                if (subCache[imgKey] && Object.keys(subCache[imgKey]).length > 0) {
                    for (const subTag in subCache[imgKey]) {
                        const isSubActive = activeSubTag === subTag;
                        html += `<div onclick="switchSubTag('${subTag}')" style="cursor: pointer; font-size: 12px; text-align: center; padding: 10px 0; border-radius: 8px; border: 1px solid ${isSubActive ? '#b9aaff' : 'rgba(138,127,189,0.2)'}; background: ${isSubActive ? 'rgba(138,127,189,0.3)' : 'rgba(138,127,189,0.1)'}; color: ${isSubActive ? '#fff' : '#b7b7d0'};">${subTag}</div>`;
                    }
                }
                
                listContainer.innerHTML = html;
            }
            
            // 切换子部件的全局方法
            window.switchSubTag = function(tag) {
                activeSubTag = tag;
                renderSubSlots();
                updateTunePanelUI();
            };

            // 同步发色
            function syncHairColor(sourceModule) {
                if (sourceModule === 'frontHair' || sourceModule === 'backHair' || sourceModule === 'ear') {
                    // 只要改动的是这三个之一，就同步给另外两个
                    const sourceData = colorData[sourceModule];
                    colorData['frontHair'] = { ...sourceData };
                    colorData['backHair'] = { ...sourceData };
                    colorData['ear'] = { ...sourceData };
                }
            }

            // 统一处理所有调色滑条的事件监听，并在拖动时实时保存到当前角色的数据中
            const filterSliders = [
                { el: tintColor, field: 'tint', isInt: false },
                { el: hueSlider, field: 'hue', isInt: true, valEl: hueVal },
                { el: satSlider, field: 'sat', isInt: true, valEl: satVal },
                { el: briSlider, field: 'bri', isInt: true, valEl: briVal }
            ];

            filterSliders.forEach(item => {
                if (!item.el) return;
                
                // 提取统一的更新函数
                const updateColorData = (e) => {
                    const currentTarget = e.target || e.srcElement;
                    if (!currentTarget) return;
                    
                    const val = item.isInt ? parseInt(currentTarget.value) : currentTarget.value;
                    if (isNaN(val) && item.isInt) return;

                    // 判断是改主部件还是副部件
                    if (activeSubTag !== null) {
                        const optionId = selected[activeModule];
                        const imgKey = `${activeModule}_${optionId}`;
                        if (!subColor[imgKey]) subColor[imgKey] = {};
                        if (!subColor[imgKey][activeSubTag]) subColor[imgKey][activeSubTag] = { ...defaultColorObj };
                        
                        // 修改副部件颜色
                        subColor[imgKey][activeSubTag][item.field] = val;
                        
                        // 同步保存到当前角色
                        if (characters[activeCharIndex]) {
                            characters[activeCharIndex].subColor = JSON.parse(JSON.stringify(subColor));
                        }
                    } else {
                        // 修改主部件颜色
                        colorData[activeModule][item.field] = val;
                        syncHairColor(activeModule);
                        
                        // 同步保存到当前角色
                        if (characters[activeCharIndex]) {
                            characters[activeCharIndex].colorData = JSON.parse(JSON.stringify(colorData));
                        }
                    }
                    
                    if (item.valEl) item.valEl.value = val;
                    
                    drawPreview();
                    if (activeModule === 'frontHair' || activeModule === 'backHair') {
                        updateTunePanelUI(); 
                    }
                };

                // 电脑端和现代浏览器
                item.el.addEventListener('input', updateColorData);
                
                // 专门针对 iOS 的补救措施
                if (item.field !== 'tint') {
                    // 很多 iOS 版本在拖动 range 时，只有 touchend 会触发 input
                    // 我们加上 touchmove 并在其中手动调用一次
                    item.el.addEventListener('touchmove', (e) => {
                        // 这里必须用 requestAnimationFrame 节流，否则滑动太快会卡死
                        if (window.requestAnimationFrame) {
                            window.requestAnimationFrame(() => updateColorData(e));
                        } else {
                            updateColorData(e);
                        }
                    }, { passive: true });
                    
                    item.el.addEventListener('touchend', updateColorData);
                } else {
                    // 颜色选择器监听 change
                    item.el.addEventListener('change', updateColorData);
                }

                // 【新增】如果存在数字输入框，监听手动输入
                if (item.valEl) {
                    // 阻止输入框的滚轮改变数值（防止页面滚动时误触）
                    item.valEl.addEventListener('wheel', (e) => e.preventDefault(), { passive: false });
                    
                    item.valEl.addEventListener('input', () => {
                        let val = parseInt(item.valEl.value);
                        const min = parseInt(item.el.min);
                        const max = parseInt(item.el.max);
                        
                        if (isNaN(val)) return; // 如果为空则不处理
                        
                        // 边界限制
                        if (val < min) val = min;
                        if (val > max) val = max;
                        
                        // 更新滑块和颜色
                        item.el.value = val;
                        updateColorData({ target: item.el });
                    });

                    item.valEl.addEventListener('change', () => {
                        // 如果失去焦点时为空，恢复为滑块当前的值
                        if (item.valEl.value === '') {
                            item.valEl.value = item.el.value;
                        }
                    });
                }
            });

            resetBtn.addEventListener('click', () => {
                if (activeSubTag !== null) {
                    // 如果正在调副部件，只重置副部件的颜色
                    const optionId = selected[activeModule];
                    const imgKey = `${activeModule}_${optionId}`;
                    if (subColor[imgKey] && subColor[imgKey][activeSubTag]) {
                        subColor[imgKey][activeSubTag] = { ...defaultColorObj };
                    }
                } else {
                    // 否则重置主部件
                    colorData[activeModule] = { ...defaultColorObj };
                    syncHairColor(activeModule);
                }
                updateTunePanelUI();
                drawPreview();
            });

            // 单行重置：只把当前模块的某一项恢复默认值
            const FIELD_DEFAULTS = { tint: '#ffffff', hue: 0, sat: 100, bri: 100 };
            document.querySelectorAll('.tune-reset').forEach(btn => {
                btn.addEventListener('click', () => {
                    const field = btn.dataset.resetField;
                    
                    if (activeSubTag !== null) {
                        // 重置副部件的单行
                        const optionId = selected[activeModule];
                        const imgKey = `${activeModule}_${optionId}`;
                        if (subColor[imgKey] && subColor[imgKey][activeSubTag]) {
                            subColor[imgKey][activeSubTag][field] = FIELD_DEFAULTS[field];
                        }
                    } else {
                        // 重置主部件的单行
                        colorData[activeModule][field] = FIELD_DEFAULTS[field];
                        syncHairColor(activeModule);
                    }
                    
                    updateTunePanelUI();
                    drawPreview();
                });
            });

            // ---------------- 打包分发包 ----------------
            function packAndExport(isPure = false) {
                // 1. 收集当前所有图片的 base64（包含主部件和副部件）
                const images = {};
                
                // 收集主部件
                for (const key in imageCache) {
                    const img = imageCache[key];
                    if (!img || !img.src) continue;
                    let src = img.src;
                    if (!src.startsWith('data:')) {
                        const tmp = document.createElement('canvas');
                        tmp.width = img.naturalWidth;
                        tmp.height = img.naturalHeight;
                        const tctx = tmp.getContext('2d');
                        tctx.imageSmoothingEnabled = false;
                        tctx.drawImage(img, 0, 0);
                        src = tmp.toDataURL('image/png');
                    }
                    images[key] = { src };
                }
                
                // 收集副部件（将它们命名为 key@subTag，以便打包后还原）
                for (const baseKey in subCache) {
                    for (const subTag in subCache[baseKey]) {
                        const img = subCache[baseKey][subTag];
                        if (!img || !img.src) continue;
                        let src = img.src;
                        if (!src.startsWith('data:')) {
                            const tmp = document.createElement('canvas');
                            tmp.width = img.naturalWidth;
                            tmp.height = img.naturalHeight;
                            const tctx = tmp.getContext('2d');
                            tctx.imageSmoothingEnabled = false;
                            tctx.drawImage(img, 0, 0);
                            src = tmp.toDataURL('image/png');
                        }
                        images[`${baseKey}@${subTag}`] = { src };
                    }
                }

                // 2. 序列化设置
                const layerOrder = Array.from(document.querySelectorAll('#moduleTabs .tab-btn[data-module]')).map(el => el.dataset.module);
                // 记录所有自定义部件，保证分发包恢复时能认出它们
                const customModules = [];
                document.querySelectorAll('#moduleTabs .tab-btn.custom-module').forEach(el => {
                    const nameEl = el.querySelector('.tab-name');
                    if (el.dataset.module && nameEl) {
                        customModules.push({
                            key: el.dataset.module,
                            name: nameEl.textContent
                        });
                    }
                });

                // 素材显示名称也要打包，否则分发包恢复时只能按编号拼名称，括号里的文字会丢
                const optionsMeta = {};
                for (const moduleKey in dynamicOptions) {
                    optionsMeta[moduleKey] = (dynamicOptions[moduleKey] || []).map(opt => ({
                        id: opt.id,
                        name: opt.name
                    }));
                }

                // 在打包前，把当前正在编辑的数据同步给当前角色，防止漏掉最新操作
                if (characters[activeCharIndex]) {
                    characters[activeCharIndex].selected = { ...selected };
                    characters[activeCharIndex].colorData = JSON.parse(JSON.stringify(colorData));
                    // 【核心修复】把副部件的调色数据也存进去
                    characters[activeCharIndex].subColor = JSON.parse(JSON.stringify(subColor));
                }

                const payload = {
                    images,
                    subColor: JSON.parse(JSON.stringify(subColor)), // 打包副部件的调色数据
                    layerOrder,
                    customModules,
                    optionsMeta,
                    characters: JSON.parse(JSON.stringify(characters)),
                    activeCharIndex: activeCharIndex
                };

                // 3. 安全地取源码，塞入 payload
                // 【核心修复】打包时，先把自定义部件暂时从 DOM 里移出，确保源码纯净
                const container = document.getElementById('moduleTabs');
                const customNodes = Array.from(container.querySelectorAll('.custom-tab-wrapper'));
                customNodes.forEach(node => node.remove());

                // 获取没有自定义部件干扰的纯净 HTML
                let html = document.documentElement.outerHTML;
                
                // 获取完 HTML 后，立刻把部件放回去，不影响当前页面继续使用
                customNodes.forEach(node => container.appendChild(node));

                const placeholder = 'const INJECTED_ASSETS = null;';
                if (!html.includes(placeholder)) {
                    alert('源码里找不到内置变量占位，无法打包。请确认页面没有被压缩或修改。');
                    return;
                }
                html = html.replace(placeholder, `const INJECTED_ASSETS = ${JSON.stringify(payload)};`);

                // ===== 纯净模式：不删标签，而是给标签加内联样式隐藏 =====
                if (isPure) {
                    // 给按钮加上 style="display: none;"
                    html = html.replace(/id="importBtn"/g, 'id="importBtn" style="display: none;"');
                    html = html.replace(/id="packExportBtn"/g, 'id="packExportBtn" style="display: none;"');
                    html = html.replace(/id="addModuleBtn"/g, 'id="addModuleBtn" style="display: none;"');
                    html = html.replace(/id="viewKeysBtn"/g, 'id="viewKeysBtn" style="display: none;"');
                    html = html.replace(/id="namingRuleBtn"/g, 'id="namingRuleBtn" style="display: none;"');
                    html = html.replace(/class="tabs-tip"/g, 'class="tabs-tip" style="display: none;"');
                    
                    // 【新增】隐藏导出素体按钮
                    html = html.replace(/id="exportBodyBtn"/g, 'id="exportBodyBtn" style="display: none;"');
                    
                    // 纯净模式下，左侧列表整体上移，填补按钮空缺
                    html = html.replace(/id="moduleTabs"/g, 'id="moduleTabs" style="top: 10px;"');
                }

                // 4. 下载
                const blob = new Blob([html], { type: 'text/html' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.download = `审神者捏人_分发包_${new Date().getTime()}.html`;
                link.href = url;
                link.click();
                URL.revokeObjectURL(url);
            }

            document.getElementById('packExportBtn').addEventListener('click', () => {
                // 隐藏其他不需要的元素
                document.getElementById('codeInputWrap').style.display = 'none';
                document.getElementById('exportOptionsWrap').style.display = 'none';

                // 显示勾选框
                const checkWrap = document.getElementById('pureModeCheckWrap');
                checkWrap.style.display = 'flex';
                document.getElementById('pureModeCheck').checked = false;

                // 临时隐藏标题栏的“提示”字样
                const modalTitle = document.querySelector('#confirmModal .modal-title');
                if (modalTitle) modalTitle.style.display = 'none';

                // 显示通用确认弹窗
                showConfirm('确定打包分发包吗？\n打包分发包可以使素材内置。', () => {
                    // 获取勾选状态
                    const isPure = document.getElementById('pureModeCheck').checked;
                    packAndExport(isPure);
                    
                    // 关闭弹窗并隐藏勾选框
                    checkWrap.style.display = 'none';
                    document.getElementById('confirmModal').classList.remove('show');
                    if (modalTitle) modalTitle.style.display = 'block'; // 恢复
                }, () => {
                    // 如果用户点取消，也把勾选框隐藏掉
                    checkWrap.style.display = 'none';
                    if (modalTitle) modalTitle.style.display = 'block'; // 恢复
                });
            });

            // ---------------- 导入与解析 ----------------
            document.getElementById('importBtn').addEventListener('click', () => {
                document.getElementById('fileInput').click();
            });

            document.getElementById('fileInput').addEventListener('change', (e) => {
                const files = e.target.files;
                if (!files.length) return;

                // 【核心修复】移除清空图库的代码，改为合并模式
                // for (let key in dynamicOptions) dynamicOptions[key] = [];
                // for (let key in selected) selected[key] = null;
                // for (let key in thumbCache) delete thumbCache[key];

                let loadedCount = 0;
                const uniqueIds = new Set();
                
                // 收集未匹配到任何部件的 key 及对应文件，供新建后自动补入
                const unmatchedKeys = new Set();
                const unmatchedFiles = {};
                // 收集命名格式错误的文件名
                const invalidFiles = [];

                // 新增：用于统计尺寸的变量
                const sizeStats = {}; // 格式: { "160x192": count }
                const tempImageStore = []; // 暂存读入的图片数据，等待统计完尺寸后再正式入库
                let loadedFileCount = 0; // 记录已解析完的图片数量，用于判断是否全部读完

                for (let file of files) {
                    const fileName = file.name;
                    const baseName = fileName.substring(0, fileName.lastIndexOf('.'));

                    // 严格校验：必须是 字母_ 开头，且下划线后面紧跟的第一个字符必须是数字
                    // 比如 hat_01, hat_01@bow, hat_01(遮阳帽) 是合法的
                    // 比如 hat_abc, hat_中文 是非法的
                    const formatCheck = baseName.match(/^[a-zA-Z]+_[0-9]/);
                    
                    if (!formatCheck) {
                        // 如果格式不对（比如 hat_中文），记录下来并跳过这个文件
                        invalidFiles.push(fileName);
                        continue;
                    }
                    
                    // 允许中文、字母、数字、下划线、横杠、@、括号作为后缀
                    const match = baseName.match(/^([a-zA-Z]+)_([a-zA-Z0-9_\-@()（）\u4e00-\u9fa5]+)$/);
                    if (match) {
                        const moduleKey = match[1];
                        const seqNum = match[2];
                        
                        if (!MODULE_NAMES[moduleKey]) {
                            unmatchedKeys.add(moduleKey);
                            if (!unmatchedFiles[moduleKey]) unmatchedFiles[moduleKey] = [];
                            unmatchedFiles[moduleKey].push(file);
                        }
                        if (MODULE_NAMES[moduleKey]) {
                            const rawId = seqNum;
                            const isSub = rawId.includes('@');
                            let baseId = rawId;
                            let subTag = null;

                            if (isSub) {
                                const parts = rawId.split('@');
                                baseId = parts[0];
                                subTag = parts[1] || 'sub'; // 比如 bow
                            }

                            const uniqueKey = `${moduleKey}_${baseId}`;

                            if (!dynamicOptions[moduleKey]) dynamicOptions[moduleKey] = [];
                            
                            // 如果是主部件，才放入面板选项
                            if (!isSub) {
                                let displayName = `${MODULE_NAMES[moduleKey]} ${baseId}`;
                                const matchName = baseId.match(/[\(（](.+?)[\)）]/);
                                if (matchName) displayName = matchName[1].trim();
                                else if (!/^\d+$/.test(baseId)) displayName = baseId;

                                // 防止重复添加（如果已经存在，更新名字，或者直接跳过）
                                const existingOpt = dynamicOptions[moduleKey].find(o => o.id === baseId);
                                if (!existingOpt) {
                                    dynamicOptions[moduleKey].push({ id: baseId, name: displayName });
                                } else {
                                    // 可选：如果同名覆盖，更新显示名
                                    existingOpt.name = displayName;
                                }
                            }

                            const reader = new FileReader();
                            reader.onload = (event) => {
                                const img = new Image();
                                img.onload = () => {
                                    // 记录尺寸出现次数
                                    const sizeKey = `${img.naturalWidth}x${img.naturalHeight}`;
                                    sizeStats[sizeKey] = (sizeStats[sizeKey] || 0) + 1;
                                    
                                    // 同一次导入中，如果遇到完全同名的文件，让后面的覆盖前面的
                                    const existingIdx = tempImageStore.findIndex(item => item.uniqueKey === uniqueKey && item.subTag === subTag);
                                    if (existingIdx > -1) {
                                        tempImageStore[existingIdx] = { fileName, moduleKey, baseId, isSub, subTag, uniqueKey, img };
                                    } else {
                                        // 暂存数据，等全部读完再处理
                                        tempImageStore.push({
                                            fileName, moduleKey, baseId, isSub, subTag, uniqueKey, img
                                        });
                                    }

                                    loadedFileCount++;
                                    if (loadedFileCount === files.length) {
                                        // 全部读取完毕，开始执行“少数服从多数”逻辑
                                        processLoadedImages();
                                    }
                                };
                                img.src = event.target.result;
                            };
                            reader.readAsDataURL(file);
                            loadedCount++;
                        }
                    }
                }

                // ===== 核心逻辑：处理读取完毕的图片，判断尺寸 =====
                function processLoadedImages() {
                    if (tempImageStore.length === 0) return;

                    // 1. 找出出现次数最多的尺寸作为基准
                    let maxCount = 0;
                    let bestSizeKey = '';
                    for (const sizeKey in sizeStats) {
                        if (sizeStats[sizeKey] > maxCount) {
                            maxCount = sizeStats[sizeKey];
                            bestSizeKey = sizeKey;
                        }
                    }

                    if (!bestSizeKey) return;
                    
                    // 解析基准尺寸
                    baseWidth = parseInt(bestSizeKey.split('x')[0]);
                    baseHeight = parseInt(bestSizeKey.split('x')[1]);
                    applyCanvasSize(baseWidth, baseHeight);
                    firstImgLoaded = true;

                    // 2. 检查是否有不同的尺寸
                    const mismatchedFiles = [];
                    const sizeMismatchSet = new Set();

                    // 3. 将合格的图片存入缓存，不合格的挑出来
                    tempImageStore.forEach(item => {
                        const imgSizeKey = `${item.img.naturalWidth}x${item.img.naturalHeight}`;
                        
                        if (imgSizeKey !== bestSizeKey) {
                            // 尺寸不符
                            mismatchedFiles.push(item.fileName);
                            sizeMismatchSet.add(item.fileName);
                            
                            // 【核心修复】如果是主部件，把它从 dynamicOptions 里删掉，避免出现空壳
                            if (!item.isSub) {
                                const optIdx = dynamicOptions[item.moduleKey].findIndex(o => o.id === item.baseId);
                                if (optIdx > -1) {
                                    dynamicOptions[item.moduleKey].splice(optIdx, 1);
                                }
                            }
                            return; // 跳过这个图
                        }

                        // 尺寸符合，执行入库（直接覆盖同名旧图）
                        if (item.isSub) {
                            if (!subCache[item.uniqueKey]) subCache[item.uniqueKey] = {};
                            subCache[item.uniqueKey][item.subTag] = item.img;
                            if (!subColor[item.uniqueKey]) subColor[item.uniqueKey] = {};
                            if (!subColor[item.uniqueKey][item.subTag]) {
                                subColor[item.uniqueKey][item.subTag] = { ...defaultColorObj };
                            }
                        } else {
                            imageCache[item.uniqueKey] = item.img;
                            thumbCache[item.uniqueKey] = generateThumbnail(item.img, item.moduleKey);
                            if (selected[item.moduleKey] === null) selected[item.moduleKey] = item.baseId;
                            
                            // 核心：如果这个名字已经存在，更新它的显示名称
                            const optIdx = dynamicOptions[item.moduleKey].findIndex(o => o.id === item.baseId);
                            if (optIdx > -1) {
                                // 重新解析一次名字，用于覆盖旧名字
                                let displayName = `${MODULE_NAMES[item.moduleKey]} ${item.baseId}`;
                                const matchName = item.baseId.match(/[\(（](.+?)[\)）]/);
                                if (matchName) displayName = matchName[1].trim();
                                else if (!/^\d+$/.test(item.baseId)) displayName = item.baseId;
                                
                                dynamicOptions[item.moduleKey][optIdx].name = displayName;
                            }
                        }
                    });

                    // 4. 如果有尺寸错误，弹窗报错
                    if (sizeMismatchSet.size > 0) {
                        const uniqMismatch = Array.from(sizeMismatchSet);
                        const showMismatch = uniqMismatch.slice(0, 5).map(f => `「${f}」`).join('、');
                        const moreMismatch = uniqMismatch.length > 5 ? ` 等 ${uniqMismatch.length} 个文件` : '';

                        const modalTitle = document.querySelector('#confirmModal .modal-title');
                        if (modalTitle) modalTitle.style.display = 'none';

                        showConfirm(`<div style="text-align: center;"><div style="color: #ff8f8f; font-weight: bold; margin-bottom: 8px;">发现以下文件与其他文件的尺寸不同，请修正并重新导入。</div><div style="font-size: 13px; color: #b7b7d0; line-height: 1.6; text-align: left; padding: 0 10px; max-height: 150px; overflow-y: auto;">${uniqMismatch.map(f => '· ' + f).join('<br>')}</div></div>`, () => {
                            document.getElementById('confirmModal').classList.remove('show');
                            if (modalTitle) modalTitle.style.display = 'block';
                        }, () => {
                            document.getElementById('confirmModal').classList.remove('show');
                            if (modalTitle) modalTitle.style.display = 'block';
                        });
                    }

                    // 5. 触发界面刷新
                    drawPreview();
                    if (activeModule) renderOptionsPanel();
                    
                    // 清空暂存区，防止内存泄漏
                    tempImageStore.length = 0;
                }

                // 原有的排序逻辑
                for (let key in dynamicOptions) {
                    dynamicOptions[key].sort((a, b) => parseInt(a.id) - parseInt(b.id));
                    if (dynamicOptions[key].length > 0) {
                        // 强制要求至少有一个选中，如果是空的，直接取第一个
                        if (!selected[key]) {
                            selected[key] = dynamicOptions[key][0].id;
                        }
                    }
                }
                
                // 导入完成后，把最新的选中状态保存到当前角色里，防止被切角色覆盖
                if (characters[activeCharIndex]) {
                    characters[activeCharIndex].selected = { ...selected };
                }

                renderOptionsPanel();

                if (loadedCount > 0) {
                    setTimeout(() => {
                        renderOptionsPanel();
                        updateTunePanelUI();
                        drawPreview();
                    }, 100);
                } else {
                    alert("未识别到匹配的图片，请确保文件名格式如：body_01.png 或 coat_01.png");
                }

                // 如果有命名不规范的素材，弹窗提示
                if (invalidFiles.length > 0) {
                    // 去重并截取前几个显示
                    const uniqInvalid = [...new Set(invalidFiles)];
                    const showFiles = uniqInvalid.slice(0, 5).map(f => `「${f}」`).join('、');
                    const moreText = uniqInvalid.length > 5 ? ` 等 ${uniqInvalid.length} 个文件` : '';
                    
                    // 隐藏“提示”标题
                    const modalTitle = document.querySelector('#confirmModal .modal-title');
                    if (modalTitle) modalTitle.style.display = 'none';

                    showConfirm(`<div style="text-align: center;"><div style="color: #ff8f8f; font-weight: bold; margin-bottom: 8px;">发现命名格式不正确的素材！</div><div style="font-size: 13px; color: #b7b7d0; line-height: 1.6;">${showFiles}${moreText} 未被加载。<br><br><span style="color: #d4b872;">请查看命名规则并重命名文件。</span></div></div>`, () => {
                        document.getElementById('confirmModal').classList.remove('show');
                        if (modalTitle) modalTitle.style.display = 'block'; // 恢复标题
                    }, () => {
                        document.getElementById('confirmModal').classList.remove('show');
                        if (modalTitle) modalTitle.style.display = 'block'; // 恢复标题
                    });
                }

                // 有未匹配的 key：弹出勾选框
                if (unmatchedKeys.size > 0) {
                    pendingUnmatched = Array.from(unmatchedKeys);
                    pendingUnmatchedFiles = unmatchedFiles;
                    showSelectKeys();
                }
            });


            // ---------------- 保存透明PNG (1x / 4x) ----------------
            function saveImage(scaleFactor = 1) {
                let w = baseWidth || 400;
                let h = baseHeight || 480;
                const exportW = Math.round(w * scaleFactor);
                const exportH = Math.round(h * scaleFactor);

                const exportCanvas = document.createElement('canvas');
                exportCanvas.width = exportW;
                exportCanvas.height = exportH;
                const exportCtx = exportCanvas.getContext('2d');

                // 导出时关闭平滑，保证像素画锐利
                exportCtx.imageSmoothingEnabled = false;

                const drawOrder = [...getLayerOrder()].reverse(); 
                
                // 1. 特殊处理：后发第一行强行垫底（导出）
                const bhOptionId = selected['backHair'];
                if (bhOptionId && bhOptionId !== 'none') {
                    const bhImg = imageCache[`backHair_${bhOptionId}`];
                    if (bhImg && bhImg.complete && bhImg.naturalWidth > 0) {
                        // 算出导出时单行的高度（原图高度 / 4 * 放大倍数）
                        const exportRowHeight = (bhImg.naturalHeight / 4) * scaleFactor;
                        exportCtx.save();
                        exportCtx.beginPath();
                        // 裁剪画布，只允许在第一行高度范围内绘制
                        exportCtx.rect(0, 0, exportW, exportRowHeight);
                        exportCtx.clip();
                        drawFilteredImage(exportCtx, bhImg, 0, 0, exportW, exportH, colorData['backHair']);
                        exportCtx.restore();
                    }
                }

                // 2. 正常渲染其他图层
                const bhIndex = drawOrder.indexOf('backHair');
                const bodyIndex = drawOrder.indexOf('body');
                
                for (let moduleKey of drawOrder) {
                    const optionId = selected[moduleKey];
                    if (!optionId || optionId === 'none') continue;
                    const imgKey = `${moduleKey}_${optionId}`;
                    const img = imageCache[imgKey];
                    if (img && img.complete && img.naturalWidth > 0) {
                        if (moduleKey === 'backHair' && bhIndex > bodyIndex) {
                            // 后发在素体上方：跳过第一行，只画后面的行
                            const exportRowHeight = (img.naturalHeight / 4) * scaleFactor;
                            exportCtx.save();
                            exportCtx.beginPath();
                            // 裁剪掉第一行的高度，从第二行开始画
                            exportCtx.rect(0, exportRowHeight, exportW, exportH - exportRowHeight);
                            exportCtx.clip();
                            drawFilteredImage(exportCtx, img, 0, 0, exportW, exportH, colorData[moduleKey]);
                            exportCtx.restore();
                        } else {
                            // 其他情况正常全画
                            drawFilteredImage(exportCtx, img, 0, 0, exportW, exportH, colorData[moduleKey]);
                        }
                    }

                    // 【新增】画副部件（导出）
                    if (subCache[imgKey]) {
                        for (const subTag in subCache[imgKey]) {
                            const subImg = subCache[imgKey][subTag];
                            const sColor = (subColor[imgKey] && subColor[imgKey][subTag]) ? subColor[imgKey][subTag] : defaultColorObj;
                            
                            if (subImg && subImg.complete && subImg.naturalWidth > 0) {
                                drawFilteredImage(exportCtx, subImg, 0, 0, exportW, exportH, sColor);
                            }
                        }
                    }
                }

                const dataUrl = exportCanvas.toDataURL('image/png');
                const link = document.createElement('a');
                const suffix = scaleFactor === 1 ? '1x' : (scaleFactor + 'x');
                link.download = `审神者捏人_${suffix}_${new Date().getTime()}.png`;
                link.href = dataUrl;
                link.click();
            }

            // 查看 Key 列表按钮

                // 获取当前左侧所有的部件（按 DOM 顺序）

                if (!listHtml) listHtml = '<div style="text-align: center;">当前没有任何部件。</div>';

                showConfirm(`<div style="margin-bottom: 10px; font-weight: bold;">当前所有部件 Key</div>${listHtml}`, () => {

                    if (modalTitle) modalTitle.style.display = 'block'; // 恢复

            // 绑定导出PNG按钮
            document.getElementById('exportPngBtn').addEventListener('click', () => {
                // 隐藏其他弹窗元素
                document.getElementById('codeInputWrap').style.display = 'none';
                document.getElementById('pureModeCheckWrap').style.display = 'none';
                
                // 显示单选按钮区域
                const optWrap = document.getElementById('exportOptionsWrap');
                optWrap.style.display = 'flex';
                
                // 默认选中 1x
                const radios = document.getElementsByName('exportSize');
                if (radios.length > 0) radios[0].checked = true;

                // 隐藏弹窗的“提示”标题
                const modalTitle = document.querySelector('#confirmModal .modal-title');
                if (modalTitle) modalTitle.style.display = 'none';

                // 弹窗提示（加入版权声明）
                const msgHtml = `请选择导出的图片尺寸：<br><br><span style="font-size: 13px; color: #b09a6a; line-height: 1.6; display: block; text-align: left; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 12px;">本行走图素材仅可用作「刀剑乱舞线上only」的入场行走图，若希望将此套素材用作他用，请联系作者@拾伍司154。</span>`;
                
                showConfirm(msgHtml, () => {

                }, () => {

                });

            // 命名规则提示按钮
            document.getElementById('namingRuleBtn').addEventListener('click', () => {
                // 隐藏确认框里的多余元素
                document.getElementById('codeInputWrap').style.display = 'none';
                document.getElementById('pureModeCheckWrap').style.display = 'none';
                document.getElementById('exportOptionsWrap').style.display = 'none';
                
                // 临时改变弹窗的标题文字
                const modalTitle = document.querySelector('#confirmModal .modal-title');
                if (modalTitle) {
                    modalTitle.style.display = 'block';
                    modalTitle.textContent = '关于导入';
                }

                // 【新增】隐藏取消按钮，只保留确定
                document.getElementById('confirmCancel').style.display = 'none';

                // 拼接全新的说明文字（支持 HTML 换行和颜色）
                const ruleText = `<div style="text-align: justify; text-justify: inter-ideograph; font-size: 13px; line-height: 1.5; color: #b7b7d0; padding-right: 8px;"><div style="margin-bottom: 8px; color: #e5e5ff; text-align: left;">您可以导入一整套自己的素材，将它当做纸娃娃工具来使用。</div><div style="color: #d4b872; font-weight: bold; margin-bottom: 4px; margin-top: 12px; font-size: 14px; text-align: left;">1. 命名规则</div><div style="margin-bottom: 8px; padding-left: 8px;"><span style="color: #fff;">英文key_编号（显示名称）</span><br>示例：<span style="color: #b8f0c8;">hat_01</span> 或 <span style="color: #b8f0c8;">hat_01(遮阳帽)</span><br><span style="font-size: 12px; color: #8f8ab3;">注：括号内的中文会作为显示名称，不写括号则直接显示编号。</span><br><span style="color: #fff;">英文key_编号@子部件名</span><br>示例：<span style="color: #b8f0c8;">hat_01@bow</span><br><span style="font-size: 12px; color: #8f8ab3;">注：它会被识别为“hat_01”的调色图层，不会作为单独的部件出现，仅出现在调色窗口右侧的调色部件栏中。</span><div style="margin-top: 6px; font-size: 12px; color: #8f8ab3;">💡 提示：key列表可以从左上角的“查看 Key 列表”查看。</div></div><div style="color: #d4b872; font-weight: bold; margin-bottom: 4px; margin-top: 12px; font-size: 14px; text-align: left;">2. 图层规则</div><div style="margin-bottom: 8px; padding-left: 8px;"><div style="margin-bottom: 2px;"><span style="color: #ff8f8f;">①</span> 一般情况下，图层顺序按照左侧部件标签卡的顺序从上到下排列。</div><div style="margin-bottom: 2px;"><span style="color: #ff8f8f;">②</span> 自定义部件可以通过拖拽改变图层顺序，默认图层无法改变图层顺序。</div><div style="margin-bottom: 2px;"><span style="color: #ff8f8f;">③</span> 【后发】部件的图层较为特殊：请将后发的四行放在同一张图里，第一行会自动被渲染在【素体】的下方。</div></div><div style="color: #d4b872; font-weight: bold; margin-bottom: 4px; margin-top: 12px; font-size: 14px; text-align: left;">3. 注意事项</div><div style="padding-left: 8px;"><div style="margin-bottom: 2px;"><span style="color: #ff8f8f;">①</span> 所有素材的尺寸必须相同。</div><div style="margin-bottom: 2px;"><span style="color: #ff8f8f;">②</span> 导入时可以直接全选文件夹内的所有文件，会自动根据 key 分配部件。</div><div style="margin-bottom: 2px;"><span style="color: #ff8f8f;">③</span> 如果导入的素材与原有的素材文件名相同，会自动覆盖之前的文件。</div><div style="margin-bottom: 2px;"><span style="color: #ff8f8f;">④</span> 如果遇到导入素材之后所有框都是空白的情况，请检查是否有不符合命名规则的文件。</div></div></div>`;
                
                showConfirm(ruleText, () => {
