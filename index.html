                                    activeCharIndex--;
                                } else if (activeCharIndex === index) {
                                    // 如果删的就是当前，则默认选中第一个
                                    activeCharIndex = 0;
                                }

                                // 1. 恢复目标角色的全部数据：选项、主调色、副调色。
                                // 原来漏了 subColor，导致删除后全局副调色还停留在旧角色上，
                                // 表现为“未删除角色的调色被重置/串色”；selected 也先清空再赋值，
                                // 防止旧角色多出来的键污染新角色。与切换角色路径保持一致。
                                const activeChar = characters[activeCharIndex] || {};
                                for (let k in selected) delete selected[k];
                                Object.assign(selected, activeChar.selected || {});
                                for (let k in colorData) delete colorData[k];
                                Object.assign(colorData, activeChar.colorData || {});
                                for (let k in subColor) delete subColor[k];
                                Object.assign(subColor, activeChar.subColor || {});

                                // 2. 子部件选中态不能指向被删角色的部件，重置后重绘调色列表
                                activeSubTag = null;

                                renderCharacterTabs();
                                renderOptionsPanel();
                                renderSubSlots();
                                updateTunePanelUI();
                                drawPreview();

                                // 删除成功后关闭弹窗
                                document.getElementById('confirmModal').classList.remove('show');
                            }, () => {
                                // 取消删除也关闭弹窗
                                document.getElementById('confirmModal').classList.remove('show');
                            });
                        };
                    });
                });

            }

            // 「+」按钮在静态 HTML 里固定不动，只需绑定一次
            const addCharBtnEl = document.getElementById('addCharBtn');
            if (addCharBtnEl) {
                addCharBtnEl.addEventListener('click', () => {
                    if (characters.length >= getMaxCharacters()) {
                        showCharLimitTip();
                        return;
                    }
                    // 弹出命名窗口
                    showPrompt('新建角色', `审神者 ${characters.length + 1}`, (newName) => {
                        if (!newName) return;
                        // 弹窗打开期间数量可能已变化，提交时再校验一次
                        if (characters.length >= getMaxCharacters()) {
                            showCharLimitTip();
                            return;
                        }
                        
                        // 1. 保存当前角色数据
                        characters[activeCharIndex].selected = { ...selected };
                        characters[activeCharIndex].colorData = JSON.parse(JSON.stringify(colorData));
                        
                        // 2. 新建一个角色（完全复制当前角色的样貌）
                        const newChar = {
                            name: newName,
                            selected: { ...selected },
                            colorData: JSON.parse(JSON.stringify(colorData)),
                            subColor: JSON.parse(JSON.stringify(subColor))
                        };
                        
                        // 3. 追加到数组并切换过去
                        characters.push(newChar);
                        activeCharIndex = characters.length - 1;
                        
                        // 4. 刷新界面
                        renderCharacterTabs();
                        drawPreview();
                    });
                });
            }

            // ---------------- 阵列方块选项面板渲染 ----------------
            const tabs = document.querySelectorAll('.tab-btn');
            const optionsPanel = document.getElementById('optionsPanel');
            let activeModule = 'accessory';

            function renderOptionsPanel() {
                const options = dynamicOptions[activeModule] || [];
                const currentSelectedId = selected[activeModule];
                const hasOptions = options.length > 0;

                let html = '';

                // 没有素材时「不显示（无）」没有任何意义（本来就没有可取消显示的部件），
                // 只剩一个孤零零的红叉还会把提示文字顶偏，因此只在有素材时才渲染它。
                if (hasOptions) {
                    // 判断当前模块是否不允许隐藏
                    const forbiddenNone = ['frontHair', 'backHair', 'face', 'clothes', 'body'].includes(activeModule);
                    const isNoneSelected = (currentSelectedId === 'none' || currentSelectedId === null);

                    if (forbiddenNone) {
                        // 显示置灰的、不可点击的“无”，并用 data-tooltip 记录提示文字
                        html += `<div class="option-block none-block disabled-none-block" style="opacity: 0.2; cursor: not-allowed;" data-tooltip="该部件不可隐藏">
                            ❌
                        </div>`;
                    } else {
                        // 正常可点击的“无”
                        html += `<div class="option-block none-block ${isNoneSelected ? 'selected' : ''}" data-option-id="none" title="不显示（无）">
                            ❌
                        </div>`;
                    }
                }

                if (!hasOptions) {
                    html += `<div class="empty-hint" style="grid-column: 1 / -1; color:#7d7799; font-size:12px; text-align:center; padding:20px;">暂无素材，请点击导入</div>`;
                } else {
                    options.forEach(opt => {
                        const isSelected = (opt.id === currentSelectedId);
                        const imgKey = `${activeModule}_${opt.id}`;
                        const thumbUrl = thumbCache[imgKey] || '';
                        
                        html += `<div class="option-block ${isSelected ? 'selected' : ''}" data-option-id="${escapeHtml(opt.id)}">
                            ${thumbUrl ? `<img src="${escapeHtml(thumbUrl)}" alt="${escapeHtml(opt.name)}">` : ''}
                            <div class="tooltip">${escapeHtml(opt.name)}</div>
                        </div>`;
                    });
                }

                optionsPanel.innerHTML = html;
                // 没导入素材时禁止空面板滚动（滚动条滑块已由 CSS 隐藏）
                optionsPanel.classList.toggle('is-empty', options.length === 0);

                // 为置灰的方块绑定自定义悬浮提示
                document.querySelectorAll('.disabled-none-block').forEach(item => {
                    item.addEventListener('mouseenter', (e) => {
                        const text = e.currentTarget.getAttribute('data-tooltip');
                        if (!text || !globalTooltip) return;
                        
                        globalTooltip.textContent = text;
                        globalTooltip.style.display = 'block';
                        
                        const rect = e.currentTarget.getBoundingClientRect();
                        globalTooltip.style.left = (rect.left + rect.width / 2) + 'px';
                        globalTooltip.style.top = (rect.top - 40) + 'px'; // 显示在按钮上方
                        
                        requestAnimationFrame(() => {
                            globalTooltip.classList.add('show');
                        });
                    });
                    
                    item.addEventListener('mouseleave', () => {
                        globalTooltip.classList.remove('show');
                        setTimeout(() => {
                            if (!globalTooltip.classList.contains('show')) {
                                globalTooltip.style.display = 'none';
                            }
                        }, 200);
                    });
                });

                document.querySelectorAll('.option-block').forEach(item => {
                    item.addEventListener('click', () => {
                        const optionId = item.dataset.optionId;
                        if (!optionId) {
                            // 如果点的是置灰的不可隐藏方块
                            if (item.classList.contains('disabled-none-block') && globalTooltip) {
                                globalTooltip.textContent = '该部件不可隐藏';
                                globalTooltip.style.display = 'block';
                                const rect = item.getBoundingClientRect();
                                globalTooltip.style.left = (rect.left + rect.width / 2) + 'px';
                                globalTooltip.style.top = (rect.top - 40) + 'px';
                                requestAnimationFrame(() => {
                                    globalTooltip.classList.add('show');
                                });
                                setTimeout(() => {
                                    globalTooltip.classList.remove('show');
                                    setTimeout(() => {
                                        if (!globalTooltip.classList.contains('show')) {
                                            globalTooltip.style.display = 'none';
                                        }
                                    }, 200);
                                }, 1500); // 手机上点击后显示 1.5 秒自动消失
                            }
                            return; 
                        }
                        
                        if (optionId === 'none') {
                            selected[activeModule] = null;
                        } else {
                            selected[activeModule] = optionId;
                        }
                        
                        document.querySelectorAll('.option-block').forEach(el => el.classList.remove('selected'));
                        item.classList.add('selected');
                        
                        // 实时同步保存到当前角色的数据里
                        characters[activeCharIndex].selected = { ...selected };
                        
                        // 重置子部件选中状态，并刷新右侧调色部件列表
                        activeSubTag = null;
                        renderSubSlots();
                        
                        drawPreview();
                    });
                });
            }

            // 更新调色面板的UI
            const tintColor = document.getElementById('tintColor');
            const tintDisplay = document.getElementById('tintDisplay');

            // 记录主色调面板上次选中的色相和具体色块，重新打开时据此恢复高亮
            let lastPaletteBaseHue = 0;
            let lastPaletteShadeHex = null;

            // 让「主色调」右侧方块的颜色始终跟随当前选中的 tint
            function syncTintDisplay(color) {
                const hex = (typeof color === 'string' && /^#[0-9A-Fa-f]{6}$/.test(color)) ? color : '#ffffff';
                if (tintDisplay) tintDisplay.style.background = hex;

                // 切换部件/角色、重置或载入旧数据后，面板状态跟随实际正在使用的颜色
                if (hex.toLowerCase() === '#ffffff') {
                    lastPaletteShadeHex = null;
                } else {
                    lastPaletteShadeHex = hex.toLowerCase();
                    lastPaletteBaseHue = hexToHsl(hex).h;
                }
            }
            
            // ===== 自定义色块阵列逻辑 =====
            const colorPaletteModal = document.getElementById('colorPaletteModal');
            const baseColorGrid = document.getElementById('baseColorGrid');
            const shadeColorGrid = document.getElementById('shadeColorGrid');
            const hexInput = document.getElementById('hexInput');
            const colorPaletteCancel = document.getElementById('colorPaletteCancel');

            // 第一行基础色：把 360° 等分成 10 份，只取前 10 个（0°、36°…324°）
            // 不能取满 10 份再含末尾的 360°——360° 与 0° 是同一个颜色，首尾会重复
            const BASE_HUE_COUNT = 10;
            const BASE_HUE_STEP = 360 / BASE_HUE_COUNT;
            const baseHues = Array.from({ length: BASE_HUE_COUNT }, (_, index) => {
                const h = Math.round(BASE_HUE_STEP * index);
                return { h, name: `${h}°` };
            });

            // 记录打开弹窗时的原始颜色，用于“取消”时恢复

            let originalColorBeforePicker = '#ffffff';
            // 记录当前正在预览的颜色
            let currentPreviewColor = '#ffffff';

            // 生成第二层（基于选中的色相生成白-黑渐变阵列）
            // selectedHex 不为空时，重新渲染后仍会把最接近的色块高亮
            function renderShadeGrid(h, s, selectedHex) {
                if (!shadeColorGrid) return;
                let html = '';
                for (let row = 0; row < 6; row++) {
                    for (let col = 0; col < 10; col++) {
                        const l = 90 - (row * 14); 
                        const sat = 10 + (col * 10);
                        const hex = hslToHex(h, sat, l);
                        const finalHex = (s === 0) ? hslToHex(0, 0, l) : hex;

                        html += `<div class="shade-color-block" data-color="${finalHex}" style="width: 100%; aspect-ratio: 1; border-radius: 2px; background: ${finalHex}; cursor: pointer; border: 1px solid rgba(0,0,0,0.1); transition: transform 0.1s;"></div>`;
                    }
                }
                shadeColorGrid.innerHTML = html;

                const blocks = Array.from(shadeColorGrid.querySelectorAll('.shade-color-block'));
                if (selectedHex) highlightShadeBlock(selectedHex, blocks);

                blocks.forEach(block => {
                    block.addEventListener('click', () => {
                        const hex = block.dataset.color;
                        lastPaletteShadeHex = hex.toLowerCase();
                        lastPaletteBaseHue = hexToHsl(hex).h;
                        currentPreviewColor = hex;
                        if (hexInput) hexInput.value = hex;
                        highlightShadeBlock(hex, blocks);
                        highlightBaseBlock(findNearestBaseHue(lastPaletteBaseHue, 100).h);

                        // 实时预览，但不关闭弹窗
                        tintColor.value = hex;
                        tintColor.dispatchEvent(new Event('change', { bubbles: true }));
                    });
                });
            }

            // 生成第一层（基础色）
            function renderBaseGrid() {
                if (!baseColorGrid) return;
                let html = '';
                baseHues.forEach((hue) => {
                    const hex = hslToHex(hue.h, 100, 50);
                    html += `<div class="base-color-block" data-hue="${hue.h}" data-s="100" data-color="${hex}" style="width: 100%; aspect-ratio: 1; border-radius: 6px; background: ${hex}; cursor: pointer; border: 1px solid rgba(255,255,255,0.1); transition: transform 0.1s;" title="${hue.name}"></div>`;
                });
                baseColorGrid.innerHTML = html;

                // 恢复到上次选中的色相与色块，而不是每次都回到第一个
                const restoreHue = Number.isFinite(lastPaletteBaseHue) ? lastPaletteBaseHue : 0;
                const nearest = findNearestBaseHue(restoreHue, 100);
                highlightBaseBlock(nearest.h);
                renderShadeGrid(nearest.h, 100, lastPaletteShadeHex);

                baseColorGrid.querySelectorAll('.base-color-block').forEach(block => {
                    block.addEventListener('click', () => {
                        const h = parseInt(block.dataset.hue, 10);
                        const s = parseInt(block.dataset.s, 10);
                        // 只切换色相时不改变实际 tint，但记住这个色相，下次打开仍高亮
                        lastPaletteBaseHue = h;
                        highlightBaseBlock(h);
                        renderShadeGrid(h, s, null);
                    });
                });
            }

            // HSL 转 Hex 的辅助函数
            function hslToHex(h, s, l) {
                s /= 100;
                l /= 100;
                const a = s * Math.min(l, 1 - l);
                const f = n => {
                    const k = (n + h / 30) % 12;
                    const color = l - a * Math.max(Math.min(k - 3, 9 - k, 1), -1);
                    return Math.round(255 * color).toString(16).padStart(2, '0');
                };
                return `#${f(0)}${f(8)}${f(4)}`;
            }

            // Hex 转 RGB / HSL，用来把当前正在使用的颜色映射回面板里的色相和色块
            function hexToRgb(hex) {
                const h = String(hex).replace('#', '');
                return [
                    parseInt(h.slice(0, 2), 16),
                    parseInt(h.slice(2, 4), 16),
                    parseInt(h.slice(4, 6), 16)
                ];
            }

            function hexToHsl(hex) {
                const [r0, g0, b0] = hexToRgb(hex);
                const r = r0 / 255, g = g0 / 255, b = b0 / 255;
                const max = Math.max(r, g, b), min = Math.min(r, g, b);
                const d = max - min;
                let h = 0, s = 0;
                const l = (max + min) / 2;
                if (d !== 0) {
                    s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
                    if (max === r) h = ((g - b) / d + (g < b ? 6 : 0));
                    else if (max === g) h = (b - r) / d + 2;
                    else h = (r - g) / d + 4;
                    h *= 60;
                }
                return { h: Math.round(h), s: Math.round(s * 100), l: Math.round(l * 100) };
            }

            // 找最接近的顶层色相；环形距离保证 350° 和 10° 是近邻
            function findNearestBaseHue(h, s) {
                if (s <= 2) return baseHues[0];
                let best = baseHues[0];
                let bestDiff = Infinity;
                baseHues.forEach(item => {
                    let diff = Math.abs(item.h - h);
                    diff = Math.min(diff, 360 - diff);
                    if (diff < bestDiff) {
                        bestDiff = diff;
                        best = item;
                    }
                });
                return best;
            }

            function highlightBaseBlock(hue) {
                if (!baseColorGrid) return;
                baseColorGrid.querySelectorAll('.base-color-block').forEach(b => {
                    const active = parseInt(b.dataset.hue, 10) === hue;
                    b.style.border = active ? '2px solid #ffffff' : '1px solid rgba(255,255,255,0.1)';
                    b.style.transform = active ? 'scale(1.15)' : 'scale(1)';
                });
            }

            function highlightShadeBlock(hex, blocks) {
                if (!shadeColorGrid) return;
                const list = blocks || Array.from(shadeColorGrid.querySelectorAll('.shade-color-block'));
                list.forEach(b => {
                    b.style.border = '1px solid rgba(0,0,0,0.1)';
                    b.style.transform = 'scale(1)';
                });
                if (!hex) return;

                const [tr, tg, tb] = hexToRgb(hex);
                let best = null;
                let bestDist = Infinity;
                list.forEach(b => {
                    const [r, g, blue] = hexToRgb(b.dataset.color);
                    const dist = (r - tr) * (r - tr) + (g - tg) * (g - tg) + (blue - tb) * (blue - tb);
                    if (dist < bestDist) {
                        bestDist = dist;
                        best = b;
                    }
                });
                if (best) {
                    best.style.border = '2px solid #ffffff';
                    best.style.transform = 'scale(1.15)';
                }
            }

            // 自定义输入框
            if (hexInput) {
                hexInput.addEventListener('input', (e) => {
                    let val = e.target.value.trim();
                    if (/^#[0-9A-Fa-f]{6}$/.test(val)) {
                        currentPreviewColor = val;
                        lastPaletteShadeHex = val.toLowerCase();
                        lastPaletteBaseHue = hexToHsl(val).h;
                        highlightBaseBlock(findNearestBaseHue(lastPaletteBaseHue, 100).h);
                        highlightShadeBlock(lastPaletteShadeHex);
                        tintColor.value = val;
                        tintColor.dispatchEvent(new Event('change', { bubbles: true }));
                    }
                });
            }

            // 初始化基础网格
            if (baseColorGrid) renderBaseGrid();
            
            // 点击“主色调”文字或色块时，打开面板
            const tintRow = tintColor.closest('.tune-row');
            if (tintRow) {
                tintRow.style.cursor = 'pointer';
                tintRow.addEventListener('click', (e) => {
                    if (e.target.tagName !== 'INPUT' && !e.target.classList.contains('tune-reset')) {
                        // 记录原始颜色用于取消
                        originalColorBeforePicker = tintColor.value;
                        currentPreviewColor = tintColor.value;
                        hexInput.value = currentPreviewColor;
                        
                        // 计算位置
                        const rect = tintRow.getBoundingClientRect();
                        colorPaletteModal.style.display = 'block';
                        
                        // 放在按钮下方，向左对齐（考虑到弹窗宽度 300px，防止超出屏幕右侧）
                        let leftPos = rect.left;
                        if (leftPos + 300 > window.innerWidth) {
                            leftPos = window.innerWidth - 310; // 靠右边留点缝隙
                        }
                        
                        colorPaletteModal.style.left = Math.max(10, leftPos) + 'px';
                        colorPaletteModal.style.top = (rect.bottom + 10) + 'px';
                        
                        if (baseColorGrid) renderBaseGrid();
                    }
                });
            }

            // 取消按钮：恢复原始颜色并关闭
            if (colorPaletteCancel) {
                colorPaletteCancel.addEventListener('click', () => {
                    tintColor.value = originalColorBeforePicker;
                    tintColor.dispatchEvent(new Event('change', { bubbles: true }));
                    colorPaletteModal.style.display = 'none';
                });
            }

            // 确定按钮：保留预览颜色并关闭。外层点击也复用同一个动作（视同确定）
            function confirmColorPicker() {
                colorPaletteModal.style.display = 'none';
            }
            const colorPaletteOk = document.getElementById('colorPaletteOk');
            if (colorPaletteOk) {
                colorPaletteOk.addEventListener('click', confirmColorPicker);
            }

            // PC 端：点击主色调面板以外的区域 = 保存并关闭（等价于点「确定」）。
            // 手机端不启用，避免手指在面板附近操作时误触关闭。
            document.addEventListener('click', (e) => {
                if (!colorPaletteModal || colorPaletteModal.style.display !== 'block') return;
                if (window.matchMedia && !window.matchMedia('(min-width: 769px)').matches) return;
                // 面板内部不算外部点击
                if (colorPaletteModal.contains(e.target)) return;
                // 用来打开面板的「主色调」行本身排除，否则刚点开就会被立刻关掉
                if (tintRow && tintRow.contains(e.target)) return;
                confirmColorPicker();
            });

            
            // 如果你想保留原生调色板作为“高级选项”，可以给隐藏的 input 加上点击弹窗，但没必要
            // ==============================

            const hueSlider = document.getElementById('hueSlider');
            const satSlider = document.getElementById('satSlider');
            const briSlider = document.getElementById('briSlider');
            const hueVal = document.getElementById('hueVal');
            const satVal = document.getElementById('satVal');
            const briVal = document.getElementById('briVal');
            const resetBtn = document.getElementById('resetBtn');

            // 明度：上限收到 350%。
            // 滑块位置仍用 0~100，50 为中性点（100% 明度 = 无变化）：
            //   左半段 0~50  -> 0~100   （100 个数值占一半轨道）
            //   右半段 50~100 -> 100~350 （250 个数值占一半轨道）
            // 两边数值范围不同，但中性点始终在正中间。
            const BRI_MAX = 350;
            const BRI_CENTER_POS = 50;
            const BRI_SLIDER_POS_MAX = 100;

            function briValueToPos(value) {
                const raw = Number(value);
                const v = Math.max(0, Math.min(BRI_MAX, isFinite(raw) ? raw : 100));
                return v <= 100
                    ? v / (100 / BRI_CENTER_POS)
                    : BRI_CENTER_POS + (v - 100) / ((BRI_MAX - 100) / (BRI_SLIDER_POS_MAX - BRI_CENTER_POS));
            }

            function briPosToValue(pos) {
                const raw = Number(pos);
                const p = Math.max(0, Math.min(BRI_SLIDER_POS_MAX, isFinite(raw) ? raw : BRI_CENTER_POS));
                const v = p <= BRI_CENTER_POS
                    ? p * (100 / BRI_CENTER_POS)
                    : 100 + (p - BRI_CENTER_POS) * ((BRI_MAX - 100) / (BRI_SLIDER_POS_MAX - BRI_CENTER_POS));
                return Math.round(v);
            }

            function updateTunePanelUI() {
                let data = colorData[activeModule];
                
                // 如果当前选中的是副部件，去读取副部件的数据
                if (activeSubTag !== null) {
                    const optionId = selected[activeModule];
                    const imgKey = `${activeModule}_${optionId}`;
                    if (subColor[imgKey] && subColor[imgKey][activeSubTag]) {
                        data = subColor[imgKey][activeSubTag];
                    } else {
                        // 如果找不到副部件的颜色，使用默认值兜底
                        data = { tint: '#ffffff', hue: 0, sat: 100, bri: 100 };
                    }
                }
                
                tintColor.value = data.tint;
                syncTintDisplay(data.tint);
                hueSlider.value = data.hue;
                satSlider.value = data.sat;
                // 旧角色代码里可能还存着 500，载入时收敛到新的 350 上限
                const rawBri = Number(data.bri);
                data.bri = Math.max(0, Math.min(BRI_MAX, isFinite(rawBri) ? rawBri : 100));
                briSlider.value = briValueToPos(data.bri);
                hueVal.value = data.hue;
                satVal.value = data.sat;
                briVal.value = data.bri;
            }

            function setActiveModule(moduleKey) {
                activeModule = moduleKey;
                activeSubTag = null; // 切部件时重置子部件选中状态
                
                document.querySelectorAll('#moduleTabs .tab-btn[data-module]').forEach(btn => {
                    if (btn.dataset.module === moduleKey) {
                        btn.classList.add('active');
                    } else {
                        btn.classList.remove('active');
                    }
                });
                renderOptionsPanel();
                renderSubSlots(); // 渲染子部件窗口
                updateTunePanelUI();
            }

            // 渲染右侧的子部件列表
            function renderSubSlots() {
                const listContainer = document.getElementById('colorSlotList');
                if (!listContainer) return;
                
                const optionId = selected[activeModule];
                if (!optionId) {
                    // 如果没有选中任何部件，只显示主部件
                    listContainer.innerHTML = `<div style="font-size: 12px; color: #b7b7d0; text-align: center; padding: 10px 0; background: rgba(138,127,189,0.1); border-radius: 8px; border: 1px solid rgba(138,127,189,0.2);">主部件</div>`;
                    return;
                }

                // 这里的 imgKey 需要精准匹配
                const imgKey = `${activeModule}_${optionId}`;
                
                let html = '';
                // 主部件按钮
                const isMainActive = activeSubTag === null;
                html += `<div data-sub-tag="__main__" style="cursor: pointer; font-size: 12px; text-align: center; padding: 10px 0; border-radius: 8px; border: 1px solid ${isMainActive ? '#b9aaff' : 'rgba(138,127,189,0.2)'}; background: ${isMainActive ? 'rgba(138,127,189,0.3)' : 'rgba(138,127,189,0.1)'}; color: ${isMainActive ? '#fff' : '#b7b7d0'};">主部件</div>`;
                
                // 副部件按钮
                if (subCache[imgKey] && Object.keys(subCache[imgKey]).length > 0) {
                    for (const subTag in subCache[imgKey]) {
                        const isSubActive = activeSubTag === subTag;
                        html += `<div data-sub-tag="${escapeHtml(subTag)}" style="cursor: pointer; font-size: 12px; text-align: center; padding: 10px 0; border-radius: 8px; border: 1px solid ${isSubActive ? '#b9aaff' : 'rgba(138,127,189,0.2)'}; background: ${isSubActive ? 'rgba(138,127,189,0.3)' : 'rgba(138,127,189,0.1)'}; color: ${isSubActive ? '#fff' : '#b7b7d0'};">${escapeHtml(subTag)}</div>`;
                    }
                }
                
                listContainer.innerHTML = html;
            }
            
            // 切换子部件的全局方法
            window.switchSubTag = function(tag) {
                activeSubTag = tag;
                renderSubSlots();
                updateTunePanelUI();
            };

            // 副部件按钮走事件委托：容器不随 innerHTML 重建，也不再把 subTag 拼进 onclick
            const colorSlotListEl = document.getElementById('colorSlotList');
            if (colorSlotListEl) {
                colorSlotListEl.addEventListener('click', (e) => {
                    const el = e.target.closest('[data-sub-tag]');
                    if (!el) return;
                    const tag = el.dataset.subTag;
                    window.switchSubTag(tag === '__main__' ? null : tag);
                });
            }

            // 同步发色
            function syncHairColor(sourceModule) {
                if (sourceModule === 'frontHair' || sourceModule === 'backHair' || sourceModule === 'ear') {
                    // 只要改动的是这三个之一，就同步给另外两个
                    const sourceData = colorData[sourceModule];
                    colorData['frontHair'] = { ...sourceData };
                    colorData['backHair'] = { ...sourceData };
                    colorData['ear'] = { ...sourceData };
                }
            }

            // 统一处理所有调色滑条的事件监听，并在拖动时实时保存到当前角色的数据中
            const filterSliders = [
                { el: tintColor, field: 'tint', isInt: false },
                { el: hueSlider, field: 'hue', isInt: true, valEl: hueVal },
                { el: satSlider, field: 'sat', isInt: true, valEl: satVal },
                {
                    el: briSlider, field: 'bri', isInt: true, valEl: briVal,
                    sliderToValue: briPosToValue,
                    valueToSlider: briValueToPos,
                    min: 0, max: BRI_MAX
                }
            ];

            filterSliders.forEach(item => {
                if (!item.el) return;
                
                // 提取统一的更新函数
                const updateColorData = (e, forcedValue) => {
                    const currentTarget = e.target || e.srcElement;
                    if (!currentTarget) return;

                    // 明度滑条是非线性的：位置要先换算成真正的亮度百分比。
                    // 数字框输入时直接传 forcedValue，避免把「100」当成滑块位置再换算一次。
                    const rawValue = forcedValue !== undefined ? forcedValue : currentTarget.value;
                    const val = item.sliderToValue
                        ? item.sliderToValue(rawValue)
                        : (item.isInt ? parseInt(rawValue, 10) : rawValue);
                    if (isNaN(val) && item.isInt) return;

                    // 判断是改主部件还是副部件
                    if (activeSubTag !== null) {
                        const optionId = selected[activeModule];
                        const imgKey = `${activeModule}_${optionId}`;
                        if (!subColor[imgKey]) subColor[imgKey] = {};
                        if (!subColor[imgKey][activeSubTag]) subColor[imgKey][activeSubTag] = { ...defaultColorObj };
                        
                        // 修改副部件颜色
                        subColor[imgKey][activeSubTag][item.field] = val;
                        
                        // 同步保存到当前角色
                        if (characters[activeCharIndex]) {
                            characters[activeCharIndex].subColor = JSON.parse(JSON.stringify(subColor));
                        }
                    } else {
                        // 修改主部件颜色
                        colorData[activeModule][item.field] = val;
                        syncHairColor(activeModule);
                        
                        // 同步保存到当前角色
                        if (characters[activeCharIndex]) {
                            characters[activeCharIndex].colorData = JSON.parse(JSON.stringify(colorData));
                        }
                    }
                    
                    if (item.valEl) item.valEl.value = val;

                    // 主色调变化时，让右侧色块实时跟随预览色
                    if (item.field === 'tint') syncTintDisplay(val);
                    
                    drawPreview();
                    if (activeModule === 'frontHair' || activeModule === 'backHair') {
                        updateTunePanelUI(); 
                    }
                };

                // 电脑端和现代浏览器
                item.el.addEventListener('input', updateColorData);
                
                // 专门针对 iOS 的补救措施
                if (item.field !== 'tint') {
                    // 很多 iOS 版本在拖动 range 时，只有 touchend 会触发 input
                    // 我们加上 touchmove 并在其中手动调用一次
                    item.el.addEventListener('touchmove', (e) => {
                        // 这里必须用 requestAnimationFrame 节流，否则滑动太快会卡死
                        if (window.requestAnimationFrame) {
                            window.requestAnimationFrame(() => updateColorData(e));
                        } else {
                            updateColorData(e);
                        }
                    }, { passive: true });
                    
                    item.el.addEventListener('touchend', updateColorData);
                } else {
                    // 颜色选择器监听 change
                    item.el.addEventListener('change', updateColorData);
                }

                // 【新增】如果存在数字输入框，监听手动输入
                if (item.valEl) {
                    // 阻止输入框的滚轮改变数值（防止页面滚动时误触）
                    item.valEl.addEventListener('wheel', (e) => e.preventDefault(), { passive: false });
                    
                    item.valEl.addEventListener('input', () => {
                        let val = parseInt(item.valEl.value, 10);
                        // 明度的数字框范围取 0~350，不能用滑条的 0~100 位置范围来夹
                        const min = item.min !== undefined ? item.min : parseInt(item.el.min, 10);
                        const max = item.max !== undefined ? item.max : parseInt(item.el.max, 10);

                        if (isNaN(val)) return; // 如果为空则不处理

                        // 边界限制
                        if (val < min) val = min;
                        if (val > max) val = max;

                        // 更新滑块和颜色
                        item.el.value = item.valueToSlider ? item.valueToSlider(val) : val;
                        updateColorData({ target: item.el }, val);
                    });

                    item.valEl.addEventListener('change', () => {
                        // 如果失去焦点时为空，恢复为滑块当前对应的值
                        if (item.valEl.value === '') {
                            item.valEl.value = item.sliderToValue
                                ? item.sliderToValue(item.el.value)
                                : item.el.value;
                        }
                    });
                }
            });

            resetBtn.addEventListener('click', () => {
                if (activeSubTag !== null) {
                    // 如果正在调副部件，只重置副部件的颜色
                    const optionId = selected[activeModule];
                    const imgKey = `${activeModule}_${optionId}`;
                    if (subColor[imgKey] && subColor[imgKey][activeSubTag]) {
                        subColor[imgKey][activeSubTag] = { ...defaultColorObj };
                    }
                } else {
                    // 否则重置主部件
                    colorData[activeModule] = { ...defaultColorObj };
                    syncHairColor(activeModule);
                }
                updateTunePanelUI();
                drawPreview();
            });

            // 单行重置：只把当前模块的某一项恢复默认值
            const FIELD_DEFAULTS = { tint: '#ffffff', hue: 0, sat: 100, bri: 100 };
            document.querySelectorAll('.tune-reset').forEach(btn => {
                btn.addEventListener('click', () => {
                    const field = btn.dataset.resetField;
                    
                    if (activeSubTag !== null) {
                        // 重置副部件的单行
                        const optionId = selected[activeModule];
                        const imgKey = `${activeModule}_${optionId}`;
                        if (subColor[imgKey] && subColor[imgKey][activeSubTag]) {
                            subColor[imgKey][activeSubTag][field] = FIELD_DEFAULTS[field];
                        }
                    } else {
                        // 重置主部件的单行
                        colorData[activeModule][field] = FIELD_DEFAULTS[field];
                        syncHairColor(activeModule);
                    }
                    
                    updateTunePanelUI();
                    drawPreview();
                });
            });

            // ---------------- 打包分发包 ----------------
            function packAndExport(isPure = false) {
                // 1. 收集当前所有图片的 base64（包含主部件和副部件）
                const images = {};
                
                // 收集主部件
                for (const key in imageCache) {
                    const img = imageCache[key];
                    if (!img || !img.src) continue;
                    let src = img.src;
                    if (!src.startsWith('data:')) {
                        const tmp = document.createElement('canvas');
                        tmp.width = img.naturalWidth;
                        tmp.height = img.naturalHeight;
                        const tctx = tmp.getContext('2d');
                        tctx.imageSmoothingEnabled = false;
                        tctx.drawImage(img, 0, 0);
                        src = tmp.toDataURL('image/png');
                    }
                    images[key] = { src };
                }
                
                // 收集副部件（将它们命名为 key@subTag，以便打包后还原）
                for (const baseKey in subCache) {
                    for (const subTag in subCache[baseKey]) {
                        const img = subCache[baseKey][subTag];
                        if (!img || !img.src) continue;
                        let src = img.src;
                        if (!src.startsWith('data:')) {
                            const tmp = document.createElement('canvas');
                            tmp.width = img.naturalWidth;
                            tmp.height = img.naturalHeight;
                            const tctx = tmp.getContext('2d');
                            tctx.imageSmoothingEnabled = false;
                            tctx.drawImage(img, 0, 0);
                            src = tmp.toDataURL('image/png');
                        }
                        images[`${baseKey}@${subTag}`] = { src };
                    }
                }

                // WU-34：收集挂载图（将它们命名为 srcKey$targetKey，以便打包后还原）
                for (const tKey in mountCache) {
                    for (const m of mountCache[tKey]) {
                        const img = m.img;
                        if (!img || !img.src) continue;
                        let src = img.src;
                        if (!src.startsWith('data:')) {
                            const tmp = document.createElement('canvas');
                            tmp.width = img.naturalWidth;
                            tmp.height = img.naturalHeight;
                            const tctx = tmp.getContext('2d');
                            tctx.imageSmoothingEnabled = false;
                            tctx.drawImage(img, 0, 0);
                            src = tmp.toDataURL('image/png');
                        }
                        images[`${m.srcKey}$${tKey}`] = { src };
                    }
                }

                // 2. 序列化设置
                const layerOrder = Array.from(document.querySelectorAll('#moduleTabs .tab-btn[data-module]')).map(el => el.dataset.module);
                // 记录所有自定义部件，保证分发包恢复时能认出它们
                const customModules = [];
                document.querySelectorAll('#moduleTabs .tab-btn.custom-module').forEach(el => {
                    const nameEl = el.querySelector('.tab-name');
                    if (el.dataset.module && nameEl) {
                        customModules.push({
                            key: el.dataset.module,
                            name: nameEl.textContent
                        });
                    }
                });

                // 素材显示名称也要打包，否则分发包恢复时只能按编号拼名称，括号里的文字会丢
                const optionsMeta = {};
                for (const moduleKey in dynamicOptions) {
                    optionsMeta[moduleKey] = (dynamicOptions[moduleKey] || []).map(opt => ({
                        id: opt.id,
                        name: opt.name
                    }));
                }

                // 在打包前，把当前正在编辑的数据同步给当前角色，防止漏掉最新操作
                if (characters[activeCharIndex]) {
                    characters[activeCharIndex].selected = { ...selected };
                    characters[activeCharIndex].colorData = JSON.parse(JSON.stringify(colorData));
                    // 【核心修复】把副部件的调色数据也存进去
                    characters[activeCharIndex].subColor = JSON.parse(JSON.stringify(subColor));
                }

                const payload = {
                    images,
                    subColor: JSON.parse(JSON.stringify(subColor)), // 打包副部件的调色数据
                    layerOrder,
                    customModules,
                    optionsMeta,
                    characters: JSON.parse(JSON.stringify(characters)),
                    activeCharIndex: activeCharIndex
                };

                // 3. 用「页面初始源码快照 + 当前脚本文本」组装分发包
                // 不再取 documentElement.outerHTML：运行时 DOM 里有缩略图 dataURL、
                // 弹窗状态和 JS 写入的内联样式，会让分发包体积翻倍并带脏状态；
                // 也不再移动真实 DOM，打包不会打乱当前会话的图层顺序。
                const scriptEl = document.querySelector('script');
                if (!scriptEl) {
                    alert('源码快照不可用，无法打包。请确认页面脚本完整。');
                    return;
                }
                const scriptLines = scriptEl.textContent.split('\n');
                const assetLineIdx = scriptLines.findIndex(l => /^[ \t]*const INJECTED_ASSETS = /.test(l));
                if (assetLineIdx < 0) {
                    alert('源码里找不到内置变量占位，无法打包。请确认页面没有被压缩或修改。');
                    return;
                }
                // 按行整行重建，兼容「分发包里这一行已经是巨大 payload」的二次打包场景
                // （不能用 lastIndexOf(';') 截尾：data:image/png;base64 里的分号会截错）
                const oldAssetLine = scriptLines[assetLineIdx];
                const indent = oldAssetLine.match(/^[ \t]*/)[0];
                scriptLines[assetLineIdx] = indent + 'const INJECTED_ASSETS = ' + JSON.stringify(payload) + ';';
                const newScriptBody = scriptLines.join('\n');

                // 纯净模式：在源码快照的 DOM 副本上改属性。
                // 用 DOM 操作而不是字符串替换，既不会误伤 JS 源码，也修正了
                // 「元素本来已有 style 属性时，追加第二个 style 属性不生效」的问题。
                let pageHtml = PAGE_SOURCE;
                if (isPure) {
                    const doc = new DOMParser().parseFromString(pageHtml, 'text/html');
                    ['importBtn', 'packExportBtn', 'addModuleBtn', 'viewKeysBtn', 'namingRuleBtn', 'exportBodyBtn'].forEach(id => {
                        const el = doc.getElementById(id);
                        if (el) el.style.setProperty('display', 'none', 'important');
                    });
                    doc.querySelectorAll('.tabs-tip').forEach(el => {
                        el.style.setProperty('display', 'none', 'important');
                    });
                    // 只在 PC 端上移左侧列表，避免手机端和固定的角色卡重叠
                    const pureStyle = doc.createElement('style');
                    pureStyle.textContent = '@media (min-width: 769px) { html.pure-mode .tabs { top: 10px; } }';
                    doc.head.appendChild(pureStyle);
                    doc.documentElement.classList.add('pure-mode');
                    pageHtml = '<!DOCTYPE html>\n' + doc.documentElement.outerHTML;
                }

                const scriptTagRe = /(<script\b[^>]*>)[\s\S]*?(<\/script>)/i;
                if (!scriptTagRe.test(pageHtml)) {
                    alert('源码快照不完整，无法打包。');
                    return;
                }
                const html = pageHtml.replace(
                    scriptTagRe,
                    (m, open, close) => open + newScriptBody + close
                );

                // 4. 下载
                const blob = new Blob([html], { type: 'text/html' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.download = `审神者捏人_分发包_${new Date().getTime()}.html`;
                link.href = url;
                link.click();
                // 立即 revoke 在 Safari / Firefox 上可能让大文件下载失败或得到空文件
                setTimeout(() => URL.revokeObjectURL(url), 60000);
            }

            document.getElementById('packExportBtn').addEventListener('click', () => {
                // 隐藏其他不需要的元素
                document.getElementById('codeInputWrap').style.display = 'none';
                document.getElementById('exportOptionsWrap').style.display = 'none';

                // 显示勾选框
                const checkWrap = document.getElementById('pureModeCheckWrap');
                checkWrap.style.display = 'flex';
                document.getElementById('pureModeCheck').checked = false;

                // 临时隐藏标题栏的“提示”字样
                const modalTitle = document.querySelector('#confirmModal .modal-title');
                if (modalTitle) modalTitle.style.display = 'none';

                // 显示通用确认弹窗
                showConfirm('确定打包分发包吗？\n打包分发包可以使素材内置。', () => {
                    // 获取勾选状态
                    const isPure = document.getElementById('pureModeCheck').checked;
                    packAndExport(isPure);
                    
                    // 关闭弹窗并隐藏勾选框
                    checkWrap.style.display = 'none';
                    document.getElementById('confirmModal').classList.remove('show');
                    if (modalTitle) modalTitle.style.display = 'block'; // 恢复
                }, () => {
                    // 如果用户点取消，也把勾选框隐藏掉
                    checkWrap.style.display = 'none';
                    if (modalTitle) modalTitle.style.display = 'block'; // 恢复
                });
            });

            // ---------------- 导入与解析 ----------------
            document.getElementById('importBtn').addEventListener('click', () => {
                document.getElementById('folderInput').click();
            });

            function handleFiles(files) {
                // 【核心修复】移除清空图库的代码，改为合并模式
                // for (let key in dynamicOptions) dynamicOptions[key] = [];
                // for (let key in selected) selected[key] = null;
                // for (let key in thumbCache) delete thumbCache[key];

                let loadedCount = 0;
                const uniqueIds = new Set();
                
                // 收集未匹配到任何部件的 key 及对应文件，供新建后自动补入
                const unmatchedKeys = new Set();
                const unmatchedFiles = {};
                // 收集命名格式错误的文件名
                const invalidFiles = [];
                // WU-34 补修：收集格式不符合规范的文件（用于统一报错）
                const formatErrorFiles = [];
                // 只有所有检查都过关的文件，才能进入这个数组等待读取
                const validFiles = [];

                // 新增：用于统计尺寸的变量
                const sizeStats = {}; // 格式: { "160x192": count }
                const tempImageStore = []; // 暂存读入的图片数据，等待统计完尺寸后再正式入库
                let loadedFileCount = 0; // 记录已解析完的图片数量，用于判断是否全部读完
                // WU-34 补修：用于检测同部件下编号是否重复
                // 结构：idTracker[moduleKey] = Set(基础编号)，如 ear -> Set('01')
                const idTracker = {}; 
                // 结构：duplicateIds[moduleKey] = 重复文件数组，如 ear -> ['ear_01(猫耳).png']
                const duplicateIds = {}; 

                for (let file of files) {
                    const fileName = file.name;
                    const baseName = fileName.substring(0, fileName.lastIndexOf('.'));
                    const pathParts = file.webkitRelativePath ? file.webkitRelativePath.split('/') : [];
                    
                    let moduleKey = null;
                    let seqNum = null;
                    let mountTarget = null;

                    // 强制要求必须是从文件夹导入（webkitRelativePath 有值，且至少有上级文件夹）
                    if (pathParts.length < 2) {
                        formatErrorFiles.push(fileName);
                        continue;
                    }

                    const folderName = pathParts[pathParts.length - 2];
                    // 匹配 01, 01(猫耳), 01$papa, 01(猫耳)$papa
                    const folderMatch = baseName.match(/^([0-9].*?)(?:\$([a-zA-Z]+))?$/);
                    if (!folderMatch) {
                        formatErrorFiles.push(fileName);
                        continue;
                    }
                    
                    moduleKey = folderName;
                    seqNum = folderMatch[1];
                    mountTarget = folderMatch[2] || null;

                    // 白名单校验：提取核心名称，挖掉括号内、@、$
                    let rawName = seqNum.replace(/[()（）].*?[()（）]/g, '').replace(/@.*$/, '').replace(/\$.*$/, '');
                    
                    // 文件夹模式：核心名称只能是纯数字（比如 01）
                    if (!/^\d+$/.test(rawName)) {
                        formatErrorFiles.push(fileName);
                        continue;
                    }

                    // 未知部件不参与读取
                    if (!MODULE_NAMES[moduleKey]) {
                        unmatchedKeys.add(moduleKey);
                        if (!unmatchedFiles[moduleKey]) unmatchedFiles[moduleKey] = [];
                        unmatchedFiles[moduleKey].push(file);
                        continue;
                    }

                    // 4. 解析 ID 和挂载信息
                    const rawId = seqNum;
                    const isSub = rawId.includes('@');
                    let baseId = rawId;
                    let subTag = null;

                    if (isSub) {
                        const parts = rawId.split('@');
                        baseId = parts[0];
                        subTag = parts[1] || 'sub';
                    }

                    const uniqueKey = `${moduleKey}_${baseId}`;
                    const isMount = !!mountTarget;

                    // 5. 查重校验
                    if (!isMount && !isSub) {
                        const numMatch = baseId.match(/^(\d+)/);
                        const pureNum = numMatch ? numMatch[1] : baseId;

                        if (!idTracker[moduleKey]) idTracker[moduleKey] = new Map();
                        
                        if (idTracker[moduleKey].has(pureNum)) {
                            if (!duplicateIds[moduleKey]) duplicateIds[moduleKey] = [];
                            const firstFileName = idTracker[moduleKey].get(pureNum);
                            if (!duplicateIds[moduleKey].includes(firstFileName)) {
                                duplicateIds[moduleKey].push(firstFileName);
                            }
                            if (!duplicateIds[moduleKey].includes(fileName)) {
                                duplicateIds[moduleKey].push(fileName);
                            }
                        } else {
                            idTracker[moduleKey].set(pureNum, fileName);
                        }
                    }

                    // 6. 记录合法文件
                    validFiles.push({ file, fileName, moduleKey, baseId, isSub, subTag, uniqueKey, mountTarget, isMount });
                }

                // 清空旧面板并重新装载合法选项（剔除有冲突的部件）
                for (const key in dynamicOptions) {
                    dynamicOptions[key] = [];
                }
                for (const item of validFiles) {
                    if (item.isSub || item.isMount) continue;
                    if (duplicateIds[item.moduleKey]) continue;

                    let displayName = `${MODULE_NAMES[item.moduleKey]} ${item.baseId}`;
                    const matchName = item.baseId.match(/[\(（](.+?)[\)）]/);
                    if (matchName) displayName = matchName[1].trim();
                    else if (!/^\d+$/.test(item.baseId)) displayName = item.baseId;

                    const existingOpt = dynamicOptions[item.moduleKey].find(o => o.id === item.baseId);
                    if (!existingOpt) {
                        dynamicOptions[item.moduleKey].push({ id: item.baseId, name: displayName });
                    } else {
                        existingOpt.name = displayName;
                    }
                }

                // 7. 只给合法文件读图
                for (const item of validFiles) {
                    if (duplicateIds[item.moduleKey]) continue;
                    
                    const reader = new FileReader();
                    reader.onload = (event) => {
                        const img = new Image();
                        img.onload = () => {
                            const sizeKey = `${img.naturalWidth}x${img.naturalHeight}`;
                            sizeStats[sizeKey] = (sizeStats[sizeKey] || 0) + 1;
                            
                            const existingIdx = tempImageStore.findIndex(t => t.uniqueKey === item.uniqueKey && t.subTag === item.subTag && t.mountTarget === item.mountTarget);
                            const record = { ...item, img };
                            
                            if (existingIdx > -1) {
                                tempImageStore[existingIdx] = record;
                            } else {
                                tempImageStore.push(record);
                            }

                            loadedFileCount++;
                            if (loadedFileCount === validFiles.length) {
                                processLoadedImages();
                            }
                        };
                        img.src = event.target.result;
                    };
                    reader.readAsDataURL(item.file);
                    loadedCount++;
                }

                // 如果全是坏文件，直接结算并报错
                if (validFiles.length === 0) {
                    processLoadedImages();
                }

                // ===== 核心逻辑：处理读取完毕的图片，判断尺寸 =====
                function processLoadedImages() {
                    if (tempImageStore.length === 0) return;

                    // 1. 找出出现次数最多的尺寸作为基准
                    let maxCount = 0;
                    let bestSizeKey = '';
                    for (const sizeKey in sizeStats) {
                        if (sizeStats[sizeKey] > maxCount) {
                            maxCount = sizeStats[sizeKey];
                            bestSizeKey = sizeKey;
                        }
                    }

                    if (!bestSizeKey) return;
                    
                    // 解析基准尺寸
                    baseWidth = parseInt(bestSizeKey.split('x')[0]);
                    baseHeight = parseInt(bestSizeKey.split('x')[1]);
                    applyCanvasSize(baseWidth, baseHeight);
                    firstImgLoaded = true;

                    // 2. 检查是否有不同的尺寸
                    const mismatchedFiles = [];
                    const sizeMismatchSet = new Set();

                    // 3. 将合格的图片存入缓存，不合格的挑出来
                    tempImageStore.forEach(item => {
                        const imgSizeKey = `${item.img.naturalWidth}x${item.img.naturalHeight}`;
                        
                        // WU-34 补修：如果该部件存在编号重复，整件跳过，不读图片
                        // 注意：这里还要查一下挂载图和副部件，如果它们依附的主部件有重复，也一并跳过
                        const parentModule = item.uniqueKey.split('_')[0];
                        if (duplicateIds[parentModule]) {
                            return;
                        }

                        if (imgSizeKey !== bestSizeKey) {
                            // 尺寸不符
                            mismatchedFiles.push(item.fileName);
                            sizeMismatchSet.add(item.fileName);
                            
                            // 【核心修复】如果是主部件，把它从 dynamicOptions 里删掉，避免出现空壳
                            if (!item.isSub) {
                                const optIdx = dynamicOptions[item.moduleKey].findIndex(o => o.id === item.baseId);
                                if (optIdx > -1) {
                                    dynamicOptions[item.moduleKey].splice(optIdx, 1);
                                }
                            }
                            return; // 跳过这个图
                        }

                        // 尺寸符合，执行入库（直接覆盖同名旧图）
                        if (item.isMount) {
                            // WU-34：挂载图按目标部件分组，同一目标下按来源 key 排序后依次叠画
                            const tKey = item.mountTarget;
                            if (!mountCache[tKey]) mountCache[tKey] = [];
                            const existIdx = mountCache[tKey].findIndex(m => m.srcKey === item.uniqueKey);
                            const record = { srcKey: item.uniqueKey, img: item.img };
                            if (existIdx > -1) {
                                mountCache[tKey][existIdx] = record;
                            } else {
                                mountCache[tKey].push(record);
                            }
                            mountCache[tKey].sort((a, b) => a.srcKey.localeCompare(b.srcKey));
                        } else if (item.isSub) {
                            if (!subCache[item.uniqueKey]) subCache[item.uniqueKey] = {};
                            subCache[item.uniqueKey][item.subTag] = item.img;
                            if (!subColor[item.uniqueKey]) subColor[item.uniqueKey] = {};
                            if (!subColor[item.uniqueKey][item.subTag]) {
                                subColor[item.uniqueKey][item.subTag] = { ...defaultColorObj };
                            }
                        } else {
                            imageCache[item.uniqueKey] = item.img;
                            thumbCache[item.uniqueKey] = generateThumbnail(item.img, item.moduleKey);
                            if (selected[item.moduleKey] === null) selected[item.moduleKey] = item.baseId;
                            
                            // 核心：如果这个名字已经存在，更新它的显示名称
                            const optIdx = dynamicOptions[item.moduleKey].findIndex(o => o.id === item.baseId);
                            if (optIdx > -1) {
                                // 重新解析一次名字，用于覆盖旧名字
                                let displayName = `${MODULE_NAMES[item.moduleKey]} ${item.baseId}`;
                                const matchName = item.baseId.match(/[\(（](.+?)[\)）]/);
                                if (matchName) displayName = matchName[1].trim();
                                else if (!/^\d+$/.test(item.baseId)) displayName = item.baseId;
                                
                                dynamicOptions[item.moduleKey][optIdx].name = displayName;
                            }
                        }
                    });

                    // 4. 如果有尺寸错误，弹窗报错
                    if (sizeMismatchSet.size > 0) {
                        const uniqMismatch = Array.from(sizeMismatchSet);
                        const showMismatch = uniqMismatch.slice(0, 5).map(f => `「${f}」`).join('、');
                        const moreMismatch = uniqMismatch.length > 5 ? ` 等 ${uniqMismatch.length} 个文件` : '';

                        const modalTitle = document.querySelector('#confirmModal .modal-title');
                        if (modalTitle) modalTitle.style.display = 'none';

                        showConfirm(`<div style="text-align: center;"><div style="color: #ff8f8f; font-weight: bold; margin-bottom: 8px;">发现以下文件与其他文件的尺寸不同，请修正并重新导入。</div><div style="font-size: 13px; color: #b7b7d0; line-height: 1.6; text-align: left; padding: 0 10px; max-height: 150px; overflow-y: auto;">${uniqMismatch.map(f => '· ' + escapeHtml(f)).join('<br>')}</div></div>`, () => {
                            document.getElementById('confirmModal').classList.remove('show');
                            if (modalTitle) modalTitle.style.display = 'block';
                        }, () => {
                            document.getElementById('confirmModal').classList.remove('show');
                            if (modalTitle) modalTitle.style.display = 'block';
                        });
                    }

                    // 5. 触发界面刷新
                    drawPreview();
                    if (activeModule) renderOptionsPanel();
                    
                    // WU-34 补修：如果有编号重复的部件，弹窗报错
                    if (Object.keys(duplicateIds).length > 0) {
                        let msg = '<div style="text-align: left; width: 100%;">';
                        msg += '<div style="color: #ff8f8f; font-weight: bold; margin-bottom: 12px; text-align: center;">检测到同部件下存在序号相同的素材，已跳过这些部件！</div>';
                        
                        for (const mod in duplicateIds) {
                            msg += `<div style="margin-bottom: 12px;">`;
                            msg += `<div style="color: #d4b872; margin-bottom: 6px; font-weight: 600;">部件【${escapeHtml(MODULE_NAMES[mod] || mod)}】存在以下序号相同的素材：</div>`;
                            msg += `<div style="background: rgba(0,0,0,0.25); border-radius: 8px; padding: 8px 12px; font-size: 13px; color: #c9c6dd; line-height: 1.5; word-break: break-all;">`;
                            // 遍历该部件下所有的冲突文件名
                            const uniqueFiles = [...new Set(duplicateIds[mod])];
                            uniqueFiles.forEach(f => {
                                msg += `<div style="display: flex; align-items: center; gap: 6px; margin-bottom: 4px;"><span style="color: #ff8f8f; font-size: 10px;">●</span> ${escapeHtml(f)}</div>`;
                            });
                            msg += `</div></div>`;
                        }
                        
                        msg += '<div style="color: #ff8f8f; text-align: center; margin-top: 16px;">请修改文件名中的编号后重新导入该部件。</div>';
                        msg += '</div>';

                        const modalTitle = document.querySelector('#confirmModal .modal-title');
                        if (modalTitle) modalTitle.style.display = 'none';

                        showConfirm(msg, () => {
                            document.getElementById('confirmModal').classList.remove('show');
                            if (modalTitle) modalTitle.style.display = 'block';
                        }, () => {
                            document.getElementById('confirmModal').classList.remove('show');
                            if (modalTitle) modalTitle.style.display = 'block';
                        });
                    }
                    
                    // 清空暂存区，防止内存泄漏
                    tempImageStore.length = 0;
                }

                // 原有的排序逻辑
                for (let key in dynamicOptions) {
                    dynamicOptions[key].sort((a, b) => parseInt(a.id) - parseInt(b.id));
                    if (dynamicOptions[key].length > 0) {
                        // 强制要求至少有一个选中，如果是空的，直接取第一个
                        if (!selected[key]) {
                            selected[key] = dynamicOptions[key][0].id;
                        }
                    }
                }
                
                // 导入完成后，把最新的选中状态保存到当前角色里，防止被切角色覆盖
                if (characters[activeCharIndex]) {
                    characters[activeCharIndex].selected = { ...selected };
                }

                renderOptionsPanel();

                if (loadedCount > 0) {
                    setTimeout(() => {
                        renderOptionsPanel();
                        updateTunePanelUI();
                        drawPreview();
                    }, 100);
                } else {
                    alert("未识别到匹配的图片，请确保文件名格式如：body_01.png 或 coat_01.png");
                }

                // 如果有命名格式不规范的素材，弹窗提示
                const allErrorFiles = [...new Set([...invalidFiles, ...formatErrorFiles])];
                if (allErrorFiles.length > 0) {
                    // 隐藏“提示”标题
                    const modalTitle = document.querySelector('#confirmModal .modal-title');
                    if (modalTitle) modalTitle.style.display = 'none';

                    let msg = '<div style="text-align: left; width: 100%;">';
                    msg += '<div style="color: #ff8f8f; font-weight: bold; margin-bottom: 12px; text-align: center;">发现命名格式不符合规范的素材！</div>';
                    msg += '<div style="color: #d4b872; margin-bottom: 6px; font-weight: 600;">以下文件未被加载：</div>';
                    msg += '<div style="background: rgba(0,0,0,0.25); border-radius: 8px; padding: 8px 12px; font-size: 13px; color: #c9c6dd; line-height: 1.5; max-height: 180px; overflow-y: auto; word-break: break-all;">';
                    
                    allErrorFiles.forEach(f => {
                        msg += `<div style="display: flex; align-items: center; gap: 6px; margin-bottom: 4px;"><span style="color: #ff8f8f; font-size: 10px;">●</span> ${escapeHtml(f)}</div>`;
                    });
                    
                    msg += '</div>';
                    msg += '<div style="color: #ff8f8f; text-align: center; margin-top: 16px; line-height: 1.5; font-size: 12px;">请在【关于导入】中查看命名规则并修改文件名。</div>';
                    msg += '</div>';

                    showConfirm(msg, () => {
                        document.getElementById('confirmModal').classList.remove('show');
                        if (modalTitle) modalTitle.style.display = 'block'; // 恢复标题
                    }, () => {
                        document.getElementById('confirmModal').classList.remove('show');
                        if (modalTitle) modalTitle.style.display = 'block'; // 恢复标题
                    });
                }

                // 有未匹配的 key：弹出勾选框
                if (unmatchedKeys.size > 0) {
                    pendingUnmatched = Array.from(unmatchedKeys);
                    pendingUnmatchedFiles = unmatchedFiles;
                    showSelectKeys();
                }
            }

            document.getElementById('folderInput').addEventListener('change', (e) => {
                // 每次选择文件夹后，确保全局弹窗的按钮状态已重置
                document.getElementById('confirmCancel').style.display = 'block';
                document.getElementById('confirmOk').style.display = 'block';
                handleFiles(e.target.files);
                e.target.value = ''; // 允许重复选择同一个文件夹
            });


            // ---------------- 保存透明PNG (1x / 4x) ----------------
            function saveImage(scaleFactor = 1) {
                let w = baseWidth || 400;
                let h = baseHeight || 480;
                const exportW = Math.round(w * scaleFactor);
                const exportH = Math.round(h * scaleFactor);

                const exportCanvas = document.createElement('canvas');
                exportCanvas.width = exportW;
                exportCanvas.height = exportH;
                const exportCtx = exportCanvas.getContext('2d');

                // 导出时关闭平滑，保证像素画锐利
                exportCtx.imageSmoothingEnabled = false;

                const drawOrder = [...getLayerOrder()].reverse(); 
                
                // 1. 特殊处理：后发第一行强行垫底（导出）
                const bhOptionId = selected['backHair'];
                if (bhOptionId && bhOptionId !== 'none') {
                    const bhImg = imageCache[`backHair_${bhOptionId}`];
                    if (bhImg && bhImg.complete && bhImg.naturalWidth > 0) {
                        // 算出导出时单行的高度（原图高度 / 4 * 放大倍数）
                        const exportRowHeight = (bhImg.naturalHeight / 4) * scaleFactor;
                        exportCtx.save();
                        exportCtx.beginPath();
                        // 裁剪画布，只允许在第一行高度范围内绘制
                        exportCtx.rect(0, 0, exportW, exportRowHeight);
                        exportCtx.clip();
                        drawFilteredImage(exportCtx, bhImg, 0, 0, exportW, exportH, colorData['backHair']);

                const ruleText = `<div style="text-align: justify; text-justify: inter-ideograph; font-size: 13px; line-height: 1.6; color: #b7b7d0; padding-right: 8px;"><div style="margin-bottom: 8px; color: #e5e5ff; text-align: left;">您可以导入一整套自己的素材，将它当做纸娃娃工具来使用。</div><div style="color: #d4b872; font-weight: bold; margin-bottom: 8px; margin-top: 16px; font-size: 15px; text-align: left;">1. 命名规则</div><div style="margin-bottom: 8px; padding-left: 8px;"><div style="margin-bottom: 6px; color: #fff; font-weight: 600;">①常规命名</div><div style="padding-left: 10px; margin-bottom: 14px;">将文件命名为 <span style="color: #b8f0c8;">编号</span> 或 <span style="color: #b8f0c8;">编号(显示名称)</span>，并放在对应的 <span style="color: #d4b872;">&lt;key&gt;</span> 文件夹下。<br><br>示例：<br>如果你有一个蝴蝶结，需要加载在【饰品】部件内，你需要将文件命名为：<span style="color: #b8f0c8;">01</span> 或 <span style="color: #b8f0c8;">01(蝴蝶结)</span>，并放在 <span style="color: #d4b872;">&lt;accessory&gt;</span> 文件夹内。<br><span style="font-size: 14px; color: #8ab4f8;">注：括号内的文字会作为显示名称显示在部件的下方，不写名称则直接显示编号。</span></div><div style="margin-bottom: 6px; color: #fff; font-weight: 600;">②调色图层</div><div style="padding-left: 10px; margin-bottom: 14px;">将文件命名为 <span style="color: #b8f0c8;">编号@子部件名</span> 或 <span style="color: #b8f0c8;">编号(显示名称)@子部件名</span>，并放在对应的 <span style="color: #d4b872;">&lt;key&gt;</span> 文件夹下。<br><br>示例：<br>如果你的蝴蝶结上还有一块宝石，你希望它可以单独被调色，你需要把宝石的部分单独扣出来另存为成一个新的文件，并命名为：<span style="color: #b8f0c8;">01@宝石</span> 或 <span style="color: #b8f0c8;">01(蝴蝶结)@宝石</span>，并放在 <span style="color: #d4b872;">&lt;accessory&gt;</span> 文件夹内。<br><span style="font-size: 14px; color: #8ab4f8;">注：它会被识别为 &lt;accessory&gt; 文件夹内“01”号部件的调色图层，并以“宝石”的名字出现在调色窗口右侧的调色部件窗口中。</span></div><div style="margin-bottom: 6px; color: #fff; font-weight: 600;">③挂载图层</div><div style="padding-left: 10px; margin-bottom: 14px;">将文件命名为 <span style="color: #b8f0c8;">联动图层$挂载部件</span>，并放在联动图层对应的 <span style="color: #d4b872;">&lt;key&gt;</span> 文件夹下。<br><br><span style="color: #d4b872;">挂载图层是什么，我们什么时候需要用到挂载图层？</span><br>当一个部件有一部分出现在另一个部件上方，又有一部分需要这个部件遮挡的时候，我们可以使用挂载图层来使原本在下层的部件只有一部分出现在A的上层。<br><br><span style="color: #b7b7d0; font-weight: 600;">联动图层</span>：当前素材的的内容来源，和这个图层联动显示和调色。<br><span style="font-size: 14px; color: #8ab4f8;">说人话：你从哪个文件里抠出来的就把那个文件的文件名复制粘贴到$前。</span><br><br><span style="color: #b7b7d0; font-weight: 600;">挂载图层</span>：当前素材的挂载对象，会挂在挂载对象上层，和挂载对象属于一个部件图层。<br><span style="font-size: 14px; color: #8ab4f8;">说人话：你要遮挡哪个部件就把这个部件的部件key粘贴在后面。</span><br><br><span style="color: #d4b872;">这样说很抽象，我们来用一个详细的示例来进行说明：</span><br>在一般情况下，蝴蝶结是出现在后发上层的，但当后发是马尾（序号04）时，我需要马尾的部分遮挡住蝴蝶结，以做出蝴蝶结是被绑在马尾上的效果。这种情况下，我把马尾需要遮挡蝴蝶结的部分单独扣出来，将它命名为：<span style="color: #b8f0c8;">04$accessory</span>，并放在马尾原本所在的 <span style="color: #d4b872;">&lt;backHair&gt;</span> 后发文件夹内。</div><div style="margin-top: 12px; font-size: 14px; color: #8ab4f8;">💡 提示：key列表可以从左上角的“查看 Key 列表”查看。</div></div><div style="color: #d4b872; font-weight: bold; margin-bottom: 8px; margin-top: 16px; font-size: 15px; text-align: left;">2. 图层规则</div><div style="margin-bottom: 8px; padding-left: 8px;"><div style="margin-bottom: 4px;"><span style="color: #ff8f8f;">①</span> 一般情况下，图层顺序按照左侧部件标签卡的顺序从上到下排列。</div><div style="margin-bottom: 4px;"><span style="color: #ff8f8f;">②</span> 自定义部件可以通过拖拽改变图层顺序，默认图层无法改变图层顺序。</div><div style="margin-bottom: 4px;"><span style="color: #ff8f8f;">③</span> <span style="color: #d4b872;">【后发】</span>部件的图层较为特殊：请将后发的四行放在同一张图里，第一行会自动被渲染在<span style="color: #d4b872;">【素体】</span>的下方。</div></div><div style="color: #d4b872; font-weight: bold; margin-bottom: 8px; margin-top: 16px; font-size: 15px; text-align: left;">3. 注意事项</div><div style="padding-left: 8px;"><div style="margin-bottom: 4px;"><span style="color: #ff8f8f;">①</span> 所有素材的尺寸必须相同。</div><div style="margin-bottom: 4px;"><span style="color: #ff8f8f;">②</span> 导入时需要按照文件夹分开放置每个部件，并直接选择最外层的文件夹。</div><div style="margin-bottom: 4px;"><span style="color: #ff8f8f;">③</span> 如果导入的素材与原有的素材文件名相同，会自动覆盖之前的文件。</div><div style="margin-bottom: 4px;"><span style="color: #ff8f8f;">④</span> 如果遇到导入素材之后所有框都是空白的情况，请检查是否有不符合命名规则的文件，可能有没有被排除的命名不正确的文件被放行了。</div></div></div>`;
                
                const resetModalSize = () => {

            // ---------------- 角色数据分享（紧凑代码） ----------------
            // 默认模块用单个字母代替长 key；自定义模块写成 ~<原名>。
            const CODE_MODULES = ['papa', 'hat', 'accessory', 'ear', 'frontHair', 'backHair', 'face', 'coat', 'clothes', 'body'];
            const escCode = v => String(v == null ? '' : v).replace(/[%~|,;=]/g,
                c => '%' + c.charCodeAt(0).toString(16).padStart(2, '0'));
            const unescCode = v => String(v).replace(/%([0-9a-fA-F]{2})/g,
                (_, h) => String.fromCharCode(parseInt(h, 16)));
            const toModCode = k => {
                const i = CODE_MODULES.indexOf(k);
                return i < 0 ? '~' + escCode(k) : String.fromCharCode(97 + i);
            };
            const fromModCode = s => s.charAt(0) === '~'
                ? unescCode(s.slice(1))
                : (CODE_MODULES[s.charCodeAt(0) - 97] || s);

            // 颜色按 [tint,hue,sat,bri] 定位存值，尾部保持默认的字段直接省略。
            const isDefaultColor = cd => !cd || (
                (cd.tint || '#ffffff') === '#ffffff' && (cd.hue || 0) === 0 &&
                (cd.sat === undefined ? 100 : cd.sat) === 100 &&
                (cd.bri === undefined ? 100 : cd.bri) === 100
            );
            function packColor(cd) {
                const a = [
                    (cd.tint || '#ffffff') === '#ffffff' ? '' : cd.tint,
                    cd.hue || 0,
                    cd.sat === undefined ? 100 : cd.sat,
                    cd.bri === undefined ? 100 : cd.bri
                ];
                while (a.length > 1 && (a[a.length - 1] === 0 || a[a.length - 1] === 100)) a.pop();
                return a.join(',');
            }
            function unpackColor(str) {
                const a = String(str).split(',');
                return {
                    tint: a[0] || '#ffffff',
                    hue: a.length > 1 ? Number(a[1]) : 0,
                    sat: a.length > 2 ? Number(a[2]) : 100,
                    bri: a.length > 3 ? Number(a[3]) : 100
                };
            }

            // UTF-8 <-> Base64URL（无填充，便于复制；不再用废弃的 escape/unescape）
            function codeToB64(text) {
                const bytes = new TextEncoder().encode(text);
                let bin = '';
                for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
                return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
            }
            function codeFromB64(code) {
                let b64 = String(code).trim().replace(/-/g, '+').replace(/_/g, '/');
                while (b64.length % 4) b64 += '=';
                const bin = atob(b64);
                const bytes = new Uint8Array(bin.length);
                for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
                return new TextDecoder().decode(bytes);
            }

            // 一行一个角色：2|名字|选中|主部件调色|副部件调色|图层顺序
            function buildCharCode() {
                const ch = characters[activeCharIndex];
                ch.selected = { ...selected };
                ch.colorData = JSON.parse(JSON.stringify(colorData));
                ch.subColor = JSON.parse(JSON.stringify(subColor));
                const s = [], c = [], sc = [];
                for (const k in ch.selected) {
                    if (ch.selected[k]) s.push(toModCode(k) + '=' + escCode(ch.selected[k]));
                }
                for (const k in ch.colorData) {
                    if (!isDefaultColor(ch.colorData[k])) c.push(toModCode(k) + '=' + packColor(ch.colorData[k]));
                }
                for (const key in ch.subColor) {
                    for (const tag in ch.subColor[key]) {
                        const cd = ch.subColor[key][tag];
                        if (!isDefaultColor(cd)) sc.push(escCode(key) + '=' + escCode(tag) + '=' + packColor(cd));
                    }
                }
                // 图层顺序与默认一致时整段省略（这是旧代码里最大的一块冗余）
                const order = getLayerOrder();
                const def = CODE_MODULES.concat(Object.keys(dynamicOptions).filter(k => CODE_MODULES.indexOf(k) < 0));
                const l = order.join(',') === def.join(',') ? '' : order.map(toModCode).join(',');
                return codeToB64(['2', escCode(ch.name || ''), s.join(','), c.join(';'), sc.join(';'), l].join('|'));
            }

            // 兼容旧版（短键名 / 长键名的 Base64 JSON）与新版紧凑代码
            function parseCharCode(code) {
                const text = codeFromB64(code);
                if (text.slice(0, 2) !== '2|') {
                    let d;
                    try { d = JSON.parse(text); }
                    catch (e) { d = JSON.parse(decodeURIComponent(text)); } // 极早期版本把中文做了百分号编码
                    return {
                        name: d.name || d.n || '',
                        selected: d.selected || d.s || {},
                        colorData: d.colorData || d.c || {},
                        subColor: d.subColor || d.sc || {},
                        layerOrder: d.layerOrder || d.l || null
                    };
                }
                const f = text.split('|');
                const selected = {}, colorData = {}, subColor = {};
                const each = (str, sep, fn) => (str || '').split(sep).forEach(r => { if (r) fn(r); });
                each(f[2], ',', r => {
                    const i = r.indexOf('=');
                    selected[fromModCode(r.slice(0, i))] = unescCode(r.slice(i + 1));
                });
                each(f[3], ';', r => {
                    const i = r.indexOf('=');
                    colorData[fromModCode(r.slice(0, i))] = unpackColor(r.slice(i + 1));
                });
                each(f[4], ';', r => {
                    const p = r.split('=');
                    const key = unescCode(p[0]);
                    (subColor[key] = subColor[key] || {})[unescCode(p[1])] = unpackColor(p.slice(2).join('='));
                });
                return {
                    name: unescCode(f[1] || ''),
                    selected, colorData, subColor,
                    layerOrder: f[5] ? f[5].split(',').map(fromModCode) : null
                };
            }

            function registerNewModule(displayName, key) {
