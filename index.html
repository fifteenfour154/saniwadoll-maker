                btn.className = 'tab-btn custom-module';
                btn.dataset.module = key;
                btn.draggable = true;
                btn.style.cssText = 'width: 110px; box-sizing: border-box;';
                btn.innerHTML = `<span class="tab-name">${escapeHtml(displayName)}</span>`;
                
                wrapper.appendChild(btn);
                container.appendChild(wrapper);

                // 手机端点击逻辑：第一次点击选中该部件；再次点击已选中的部件弹出菜单。
                // 弹菜单不再依赖长按，从而与 200ms 长按拖拽彻底分离，避免多次长按后状态残留卡死。
                // PC 端仍用右键弹菜单，这里不介入（右键分支见下方 contextmenu）。
                btn.addEventListener('click', (e) => {
                    // 拖拽刚结束时抑制 click：个别浏览器在长按松手后仍会补发 click，
                    // 用时间窗兜底，避免一次拖拽后立刻误弹菜单。
                    if (typeof lastDragEndTime !== 'undefined' && Date.now() - lastDragEndTime < 400) return;
                    if (typeof isTouchLayout === 'function' && isTouchLayout() && lastTappedModule === key) {
                        // 阻止冒泡到 document 的全局 click，否则菜单刚显示就会被立刻关闭
                        e.stopPropagation();
                        lastTappedModule = null;
                        const rect = btn.getBoundingClientRect();
                        const px = (typeof e.clientX === 'number' && e.clientX) ? e.clientX : rect.left + rect.width / 2;
                        const py = (typeof e.clientY === 'number' && e.clientY) ? e.clientY : rect.bottom;
                        showModuleMenu(px, py);
                        return;
                    }
                    lastTappedModule = key;
                    setActiveModule(key);
                });
                
                // 封装一个弹出菜单的方法，右键和点击共用
                const showModuleMenu = (clientX, clientY) => {
                    // 弹出菜单时先复位拖拽态，避免菜单与拖拽态共存导致卡死
                    if (typeof resetTabDragState === 'function') resetTabDragState();
                    const menu = document.getElementById('contextMenu');
                    // 防止菜单超出屏幕右侧或下方（手机适配）
                    const menuX = Math.min(clientX, window.innerWidth - 130);
                    const menuY = Math.min(clientY, window.innerHeight - 100);
                    
                    menu.style.left = menuX + 'px';
                    menu.style.top = menuY + 'px';
                    menu.classList.add('show');

                    // 修改名称

                        menu.classList.remove('show');
                        openEditModuleModal(key, displayName);

                    delMenuBtn.onclick = () => {
                        menu.classList.remove('show');
                        removeModule(key, displayName);
                    };
                };

                // 1. 电脑端：右键弹出菜单

                    e.preventDefault();
                    e.stopPropagation();
                    showModuleMenu(e.clientX, e.clientY);
                });

                // 2. 手机端弹菜单已改为「点击已选中的部件」，不再使用长按。
                //    长按 200ms 现在只负责拖拽，两条路径彻底分离，避免状态冲突卡死。

            // 修改自定义部件的逻辑
            function handleEditModule(oldKey, newName, newKey) {
                // 1. 如果名称没变且 key 没变，直接关窗
                if (oldKey === newKey && MODULE_NAMES[oldKey] === newName) {
                    closeNewModuleModal();
                    return;
                }

                // 2. 更新名称表
                MODULE_NAMES[newKey] = newName;
                delete MODULE_NAMES[oldKey];

                // 3. 迁移 dynamicOptions
                dynamicOptions[newKey] = dynamicOptions[oldKey] || [];
                delete dynamicOptions[oldKey];

                // 4. 迁移 selected
                selected[newKey] = selected[oldKey];
                delete selected[oldKey];

                // 5. 迁移 colorData
                colorData[newKey] = colorData[oldKey] || { tint: '#ffffff', hue: 0, sat: 100, bri: 100 };
                delete colorData[oldKey];

                // 6. 迁移 imageCache / thumbCache / subCache / subColor 的 key 前缀
                if (oldKey !== newKey) {
                    for (const cache of [imageCache, thumbCache, subCache, subColor]) {
                        for (const k in cache) {
                            if (k.startsWith(oldKey + '_')) {
                                const newK = k.replace(oldKey + '_', newKey + '_');
                                cache[newK] = cache[k];
                                delete cache[k];
                            }
                        }
                    }

                    // 挂载图的来源 key 也要跟着改，否则 @ / $ 图层会找不到宿主
                    for (const tKey in mountCache) {
                        mountCache[tKey].forEach(m => {
                            if (m.srcKey.startsWith(oldKey + '_')) {
                                m.srcKey = m.srcKey.replace(oldKey + '_', newKey + '_');
                            }
                        });
                    }

                    // 多角色里已保存的选中 / 调色数据同样迁移，避免切换角色后旧 key 复活
                    characters.forEach(ch => {
                        if (ch.selected && ch.selected[oldKey] !== undefined) {
                            ch.selected[newKey] = ch.selected[oldKey];
                            delete ch.selected[oldKey];
                        }
                        if (ch.colorData && ch.colorData[oldKey]) {
                            ch.colorData[newKey] = ch.colorData[oldKey];
                            delete ch.colorData[oldKey];
                        }
                        if (ch.subColor) {
                            for (const k in ch.subColor) {
                                if (k.startsWith(oldKey + '_')) {
                                    ch.subColor[k.replace(oldKey + '_', newKey + '_')] = ch.subColor[k];
                                    delete ch.subColor[k];
                                }
                            }
                        }
                    });
                }

                // 7. 更新 DOM
                const btn = document.querySelector(`.tab-btn[data-module="${oldKey}"]`);
                if (btn) {
                    btn.dataset.module = newKey;
                    const nameEl = btn.querySelector('.tab-name');
                    if (nameEl) nameEl.textContent = newName;
                    
                    // 增加防崩溃判断（因为咱们之前去掉了 key 的显示，导致这里找不到 .tab-key 会报错）
                    const keyEl = btn.querySelector('.tab-key');
                    if (keyEl) keyEl.textContent = `key: ${newKey}`;
                }

                // 8. 如果当前选中的就是这个部件，同步 activeModule
                if (activeModule === oldKey) {
                    activeModule = newKey;
                }

                closeNewModuleModal();
                editingModuleKey = null;

                renderOptionsPanel();
                updateTunePanelUI();
                drawPreview();
                
                showConfirm(`部件已修改为「${escapeHtml(newName)}」(key: ${escapeHtml(newKey)})，请确保后续导入的文件名以 ${escapeHtml(newKey)}_ 开头。`, () => {
                    document.getElementById('confirmModal').classList.remove('show');
                }, () => {
                    document.getElementById('confirmModal').classList.remove('show');
                });
            }

            // 删除自定义部件
            function removeModule(key, displayName) {
                showConfirm(`确定删除部件「${escapeHtml(displayName)}」吗？它名下的素材也会一起清掉。`, () => {
                    const opts = dynamicOptions[key] || [];
                    opts.forEach(opt => {
                        const imgKey = `${key}_${opt.id}`;
                        delete imageCache[imgKey];
                        delete thumbCache[imgKey];
                    });

                    delete MODULE_NAMES[key];
                    delete dynamicOptions[key];
                    delete selected[key];
                    delete colorData[key];

                    const container = document.getElementById('moduleTabs');
                    const btn = container.querySelector(`.tab-btn[data-module="${key}"]`);
                    if (btn) {
                        const wrapper = btn.closest('.custom-tab-wrapper');
                        if (wrapper) {
                            wrapper.remove();
                        } else {
                            btn.remove();
                        }
                    }

                    if (activeModule === key) {
                        setActiveModule('accessory');
                    }
                    drawPreview();
                });
            }

            document.getElementById('addModuleBtn').addEventListener('click', openNewModuleModal);
            document.getElementById('newModuleCancel').addEventListener('click', () => {
                pendingUnmatched = [];
                pendingUnmatchedFiles = {};
                closeNewModuleModal();
            });

            document.getElementById('newModuleOk').addEventListener('click', () => {
                const errEl = document.getElementById('newModuleErr');

                if (editingModuleKey) {
                    const nameEl = document.getElementById('newModuleName');
                    const keyEl = document.getElementById('newModuleKey');
                    if (!nameEl || !keyEl) return;
                    const displayName = nameEl.value.trim();
                    const key = keyEl.value.trim();

                    if (!displayName) { errEl.textContent = '请填写显示名称'; return; }
                    // 允许大小写字母
                    if (!/^[a-zA-Z]+$/.test(key)) { errEl.textContent = 'key 只能用英文字母'; return; }
                    if (MODULE_NAMES[key] && key !== editingModuleKey) { errEl.textContent = '这个 key 已被占用，换一个'; return; }

                    handleEditModule(editingModuleKey, displayName, key);
                    return;
                }

                if (batchCreatingKeys.length > 0) {
                    const inputs = document.querySelectorAll('.batch-name-input');
                    let allNames = [];
                    for (let input of inputs) {
                        const name = input.value.trim();
                        if (!name) {
                            errEl.textContent = '所有的显示名称都必须填写';
                            return;
                        }
                        allNames.push({ key: input.dataset.key, name });
                    }

                    closeNewModuleModal();
                    let totalFiles = 0;
                    allNames.forEach((item) => {
                        registerNewModule(item.name, item.key);
                        const files = pendingUnmatchedFiles[item.key] || [];
                        totalFiles += files.length;
                        if (files.length > 0) loadFilesForModule(files, item.key);
                    });

                    pendingUnmatched = [];
                    pendingUnmatchedFiles = {};
                    batchCreatingKeys = [];

                    showConfirm(`已成功创建 ${allNames.length} 个部件，并自动补入 ${totalFiles} 张素材。`, () => {
                        showConfirm('请通过拖拽左侧的选项卡调整图层顺序。', () => {}, () => {});
                    });
                    return;
                }

                const nameEl = document.getElementById('newModuleName');
                const keyEl = document.getElementById('newModuleKey');
                if (!nameEl || !keyEl) return;

                const displayName = nameEl.value.trim();
                const key = keyEl.value.trim();

                if (!displayName) { errEl.textContent = '请填写显示名称'; return; }
                // 允许大小写字母
                if (!/^[a-zA-Z]+$/.test(key)) { errEl.textContent = 'key 只能用英文字母'; return; }
                if (MODULE_NAMES[key] && key !== editingModuleKey) { errEl.textContent = '这个 key 已被占用，换一个'; return; }

                registerNewModule(displayName, key);
                const filesForThisKey = pendingUnmatchedFiles[key] || [];
                if (filesForThisKey.length > 0) {
                    loadFilesForModule(filesForThisKey, key);
                }

                closeNewModuleModal();

                let msg = filesForThisKey.length > 0 
                    ? `部件「${escapeHtml(displayName)}」已创建，本次导入的 ${filesForThisKey.length} 张素材已自动补入。`
                    : '部件已创建，请重新导入素材。';

                showConfirm(msg, () => {
                    showConfirm('请通过拖拽左侧的选项卡调整图层顺序。', () => {}, () => {});
                });
            });

            // 把玩家选中的文件挂到指定 key 下。
            // 自定义部件以前走的是简化导入：所有文件都被当成主图层，文件名里的 @ / $ 规则被忽略。
            // 这里改成和常规导入一致的解析：主部件进 imageCache，@调色图层进 subCache/subColor，
            // $挂载图层进 mountCache，保证「01@镜片」在自定义部件里也能单独调色。
            function loadFilesForModule(files, key) {
                const fileArr = Array.from(files);
                if (fileArr.length === 0) return;

                // 先同步解析一遍文件名，确保 @ / $ 图层能找到同编号的主部件选项
                const parsed = fileArr.map((file, i) => {
                    const baseName = file.name.substring(0, file.name.lastIndexOf('.'));
                    const dollarIdx = baseName.indexOf('$');
                    const nameBeforeMount = dollarIdx >= 0 ? baseName.slice(0, dollarIdx) : baseName;
                    const mountTarget = dollarIdx >= 0 ? baseName.slice(dollarIdx + 1) : null;
                    const atIdx = nameBeforeMount.indexOf('@');
                    const isSub = atIdx >= 0;
                    const baseIdRaw = isSub ? nameBeforeMount.slice(0, atIdx) : nameBeforeMount;
                    const subTag = isSub ? (nameBeforeMount.slice(atIdx + 1) || 'sub') : null;
                    // 只有符合「编号」或「编号(显示名称)」规则时才沿用文件里的编号；
                    // 其它文件名沿用旧的顺序补号逻辑，避免破坏以前的自定义导入习惯。
                    const useFileId = /^\d+(?:[()（].*[()）])?$/.test(baseIdRaw);
                    return {
                        file,
                        baseName,
                        baseIdRaw,
                        baseId: useFileId ? baseIdRaw : null,
                        subTag,
                        isSub,
                        mountTarget,
                        isMount: !!mountTarget,
                        order: i,
                        optionId: null
                    };
                });

                const opts = dynamicOptions[key] || (dynamicOptions[key] = []);
                const usedIds = new Set(opts.map(o => o.id));
                let nextIdx = opts.reduce((m, o) => Math.max(m, parseInt(o.id, 10) || 0), 0);

                function makeDisplayName(baseId) {
                    const matchName = baseId.match(/[()（](.+?)[\)）]/);
                    if (matchName) return matchName[1].trim();
                    if (/^\d+$/.test(baseId)) return `${MODULE_NAMES[key]} ${baseId}`;
                    return baseId;
                }

                function ensureOption(baseId, displayName) {
                    if (!baseId) return null;
                    let opt = opts.find(o => o.id === baseId);
                    if (!opt) {
                        opt = { id: baseId, name: displayName || `${MODULE_NAMES[key]} ${baseId}` };
                        opts.push(opt);
                        usedIds.add(baseId);
                    } else if (displayName && (opt.name === `${MODULE_NAMES[key]} ${opt.id}` || !opt.name)) {
                        opt.name = displayName;
                    }
                    return opt.id;
                }

                // 先把主部件选项补齐，异步读图时才不会出现 @ 图层找不到宿主的情况
                parsed.forEach(rec => {
                    if (rec.baseId) {
                        rec.optionId = ensureOption(rec.baseId, makeDisplayName(rec.baseId));
                        return;
                    }

                    // 旧行为：文件名不符合编号规则时，按顺序补 01、02...
                    let optionId;
                    do {
                        nextIdx++;
                        optionId = String(nextIdx).padStart(2, '0');
                    } while (usedIds.has(optionId));

                    const prefix = `${key}_`;
                    const fallbackName = rec.baseName.startsWith(prefix) ? rec.baseName.slice(prefix.length) : rec.baseName;
                    const displayName = /^\d+$/.test(fallbackName) ? `${MODULE_NAMES[key]} ${optionId}` : fallbackName;
                    rec.optionId = ensureOption(optionId, displayName);
                });

                let loadedCount = 0;
                function finishOne() {
                    loadedCount++;
                    if (loadedCount !== fileArr.length) return;
                    // 全部加载完再统一收尾：排序、选第一张、切到该模块、刷新面板和画布
                    opts.sort((a, b) => parseInt(a.id, 10) - parseInt(b.id, 10));
                    if ((selected[key] === null || selected[key] === undefined) && opts.length) {
                        selected[key] = opts[0].id;
                    }
                    setActiveModule(key);
                    renderOptionsPanel();
                    updateTunePanelUI();
                    drawPreview();
                }

                parsed.forEach(rec => {
                    const uniqueKey = `${key}_${rec.optionId}`;
                    const reader = new FileReader();

                    function storeImage(img) {
                        if (rec.isMount) {
                            // 挂载图按目标部件分组，同一目标下按来源 key 排序后依次叠画
                            const tKey = rec.mountTarget;
                            if (!mountCache[tKey]) mountCache[tKey] = [];
                            const existIdx = mountCache[tKey].findIndex(m => m.srcKey === uniqueKey);
                            const record = { srcKey: uniqueKey, img: img };
                            if (existIdx > -1) mountCache[tKey][existIdx] = record;
                            else mountCache[tKey].push(record);
                            mountCache[tKey].sort((a, b) => a.srcKey.localeCompare(b.srcKey));
                        } else if (rec.isSub) {
                            // @调色图层：和常规导入共用同一套 subCache / subColor 结构
                            if (!subCache[uniqueKey]) subCache[uniqueKey] = {};
                            subCache[uniqueKey][rec.subTag] = img;
                            if (!subColor[uniqueKey]) subColor[uniqueKey] = {};
                            if (!subColor[uniqueKey][rec.subTag]) {
                                subColor[uniqueKey][rec.subTag] = { ...defaultColorObj };
                            }
                        } else {
                            imageCache[uniqueKey] = img;
                            // 自定义部件不遵循行走图 3×4 网格，缩略图直接整图居中缩放
                            thumbCache[uniqueKey] = generateThumbnail(img, key);
                        }
                        finishOne();
                    }

                    reader.onload = (event) => {
                        const img = new Image();
                        img.onload = () => storeImage(img);
                        img.onerror = finishOne;
                        img.src = event.target.result;
                    };
                    reader.onerror = finishOne;
                    reader.readAsDataURL(rec.file);
                });
            }

            // —— 标签提示统一入口 ——
            // 用 position:fixed 的 #globalTooltip 替代按钮 ::after 伪元素：层级最高、不会被右侧
            // 面板遮挡，也不受 .tabs 的 overflow 裁剪；位置固定在按钮正下方。
            // type 用于区分提示来源，避免鼠标移出标签时误隐藏“拖拽锁定”提示。
            let tabTipTimer = null;
            let tabTipType = null;
            function showTabTip(el, text, type, autoHideMs) {
                const gt = document.getElementById('globalTooltip');
                if (!gt || !el) return;
                clearTimeout(tabTipTimer);
                tabTipType = type;
                gt.textContent = text;
                const rect = el.getBoundingClientRect();
                gt.style.display = 'block';
                const half = gt.offsetWidth / 2;
                const centerX = Math.max(half + 6, Math.min(rect.left + rect.width / 2, window.innerWidth - half - 6));
                gt.style.left = centerX + 'px';
                gt.style.top = (rect.bottom + 8) + 'px';
                // 同步敲定显示状态：先关掉过渡再加 show 类，强制重排后恢复过渡。
                // 这样不依赖 rAF / transition 推进，任何环境都能立刻看到提示且位置准确。
                gt.style.transition = 'none';
                gt.classList.add('show');
                void gt.offsetWidth;
                gt.style.transition = '';
                if (autoHideMs) tabTipTimer = setTimeout(() => hideTabTip(type), autoHideMs);
            }
            function hideTabTip(type) {
                if (type && tabTipType !== type) return;
                clearTimeout(tabTipTimer);
                tabTipType = null;
                const gt = document.getElementById('globalTooltip');
                if (!gt) return;
                gt.classList.remove('show');
                setTimeout(() => {
                    if (!gt.classList.contains('show')) gt.style.display = 'none';
                }, 200);
            }

            let dragSrcTab = null;

            // 检测默认图层上的“试图拖拽”行为
            let lockDragStart = { x: 0, y: 0, el: null };
            document.querySelectorAll('#moduleTabs .tab-btn[data-tooltip]').forEach(tab => {
                tab.addEventListener('mousedown', (e) => {
                    lockDragStart = { x: e.clientX, y: e.clientY, el: tab };
                });
            });
            document.addEventListener('mousemove', (e) => {
                if (lockDragStart.el) {
                    const dist = Math.hypot(e.clientX - lockDragStart.x, e.clientY - lockDragStart.y);
                    if (dist > 5) {
                        if (!lockDragStart.el.classList.contains('is-dragging-locked')) {
                            lockDragStart.el.classList.add('is-dragging-locked');
                            // 拖拽提示改走最高层级 fixed 提示框，显示在按钮下方，不再被右侧窗口挡住
                            showTabTip(lockDragStart.el,
                                lockDragStart.el.dataset.tooltip || '🔒 默认部件，不可拖动顺序', 'drag');
                        }
                    }
                }
            });
            document.addEventListener('mouseup', () => {
                if (lockDragStart.el) {
                    lockDragStart.el.classList.remove('is-dragging-locked');
                    hideTabTip('drag');
                    lockDragStart.el = null;
                }
            });

            function clearDragMarks() {
                document.querySelectorAll('#moduleTabs .tab-btn[data-module]').forEach(el => {
                    el.classList.remove('dragging', 'drag-over-top', 'drag-over-bottom');
                    el.style.opacity = ''; // 彻底清除内联透明度
                    const w = el.closest('.custom-tab-wrapper');
                    if (w) w.style.opacity = ''; // 彻底清除外壳内联透明度
                });
            }

            const dragLine = document.createElement('div');
            dragLine.className = 'drag-indicator-line';
            document.body.appendChild(dragLine);

            // —— 自定义部件标签交互状态（菜单与拖拽分离）——
            // lastTappedModule：手机端记录最近一次点击的部件 key，用于「再次点击已选中部件弹菜单」
            // lastDragEndTime：拖拽结束时间戳，短时间内忽略 click，避免长按松手误弹菜单
            let lastTappedModule = null;
            let lastDragEndTime = 0;
            const isTouchLayout = () => window.matchMedia('(max-width: 768px)').matches;

            // 统一复位标签拖拽状态。
            // 背景：早期版本自定义部件上「200ms 进入拖拽」和「600ms 长按弹菜单」两套逻辑并存，
            // 长按弹菜单时 menu 的 touchend 会 stopPropagation，导致下方 wrapper 的 touchend
            // 清理逻辑被跳过，dragSrcTab / 透明度 / dragging-active 残留，表现为卡在拖拽态。
            // 现在弹菜单已改为点击触发，本函数作为拖拽异常中断时的兜底复位保留。
            function resetTabDragState() {
                if (dragSrcTab) {
                    dragSrcTab.style.opacity = '1';
                    dragSrcTab = null;
                }
                document.body.classList.remove('dragging-active');
                if (dragLine) {
                    dragLine.style.display = 'none';
                    dragLine.classList.remove('vertical');
                }
                document.querySelectorAll('#moduleTabs .tab-btn').forEach(el => {
                    el.classList.remove('dragging', 'drag-over-top', 'drag-over-bottom');
                    el.style.opacity = '';
                });
                document.querySelectorAll('#moduleTabs .custom-tab-wrapper').forEach(w => {
                    w.style.opacity = '';
                });
            }

            function setupTabDrag() {
                const container = document.getElementById('moduleTabs');

                function hideDragLine() {
                    dragLine.style.display = 'none';
                }

                function clearDragMarks() {
                    document.querySelectorAll('#moduleTabs .tab-btn').forEach(el => {
                        el.classList.remove('dragging', 'drag-over-top', 'drag-over-bottom');
                    });
                }

                document.querySelectorAll('#moduleTabs .tab-btn[data-module]').forEach(tab => {
                    const wrapper = tab.closest('.custom-tab-wrapper') || tab;

                    // 1. 电脑端拖拽逻辑
                    wrapper.addEventListener('dragstart', (e) => {
                        if (!tab.classList.contains('custom-module')) {
                            e.preventDefault();
                            return;
                        }
                        dragSrcTab = wrapper; 
                        wrapper.style.opacity = '0.4'; 
                        e.dataTransfer.effectAllowed = 'move';
                        e.dataTransfer.setData('text/plain', tab.dataset.module);
                    });

                    wrapper.addEventListener('dragend', () => {
                        dragSrcTab = null;
                        wrapper.style.opacity = '1'; 
                        hideDragLine();
                        clearDragMarks();
                    });

                    // 2. 手机端触摸拖拽逻辑
                    // 手机端标签栏是横向排列（flex-direction: row），插入位置必须用 X 坐标判断；
                    // 只有 PC 端的纵向标签栏才用 Y 坐标。提示线也相应改成竖线。
                    if (tab.classList.contains('custom-module')) {
                        let touchTimer = null;

                        // 判断当前标签栏是否为横向（手机端）
                        const isHorizontalTabs = () => {
                            const c = document.getElementById('moduleTabs');
                            return c && getComputedStyle(c).flexDirection === 'row';
                        };

                        wrapper.addEventListener('touchstart', (e) => {
                            // 长按 200ms 才触发拖拽，防止和普通点击/长按菜单冲突
                            // 长按期间手指保持不动，标签栏尚未开始原生滚动，此时锁定滚动不会误伤普通滑动
                            touchTimer = setTimeout(() => {
                                dragSrcTab = wrapper;
                                wrapper.style.opacity = '0.4';
                                document.body.classList.add('dragging-active');
                                if (navigator.vibrate) navigator.vibrate(30);
                            }, 200);
                        }, { passive: false });

                        wrapper.addEventListener('touchmove', (e) => {
                            if (!dragSrcTab) {
                                // 如果还没进入拖拽状态就移动了，取消定时器：
                                // 这是横向滑动标签栏的手势，交给浏览器原生滚动处理
                                if (e.touches.length > 0) clearTimeout(touchTimer);
                                return;
                            }

                            // 进入拖拽态后阻止标签栏继续滚动
                            e.preventDefault();

                            const touch = e.touches[0];
                            const targetEl = document.elementFromPoint(touch.clientX, touch.clientY);
                            const horizontal = isHorizontalTabs();

                            if (targetEl) {
                                const targetTab = targetEl.closest('.tab-btn[data-module]');
                                if (targetTab && targetTab !== dragSrcTab.querySelector('.tab-btn')) {
                                    const rect = targetTab.getBoundingClientRect();
                                    // 横向用 X 判断插左/插右；纵向仍用 Y 判断插上/插下
                                    const before = horizontal
                                        ? touch.clientX < rect.left + rect.width / 2
                                        : touch.clientY < rect.top + rect.height / 2;

                                    dragLine.style.display = 'block';
                                    if (horizontal) {
                                        dragLine.classList.add('vertical');
                                        const lineX = before ? rect.left - 5 : rect.right + 1;
                                        dragLine.style.left = (lineX + window.scrollX) + 'px';
                                        dragLine.style.top = (rect.top + window.scrollY) + 'px';
                                    } else {
                                        dragLine.classList.remove('vertical');
                                        const lineY = before ? rect.top - 5 : rect.bottom + 1;
                                        dragLine.style.top = (lineY + window.scrollY) + 'px';
                                        dragLine.style.left = rect.left + 'px';
                                    }
                                }
                            }
                        }, { passive: false });

                        wrapper.addEventListener('touchend', (e) => {
                            clearTimeout(touchTimer);
                            if (!dragSrcTab) return;

                            // 记录拖拽结束时间，供 click 处理器抑制误触
                            lastDragEndTime = Date.now();
                            e.preventDefault();
                            dragLine.style.display = 'none';
                            dragLine.classList.remove('vertical');
                            wrapper.style.opacity = '1';
                            document.body.classList.remove('dragging-active');

                            const touch = e.changedTouches[0];
                            const targetEl = document.elementFromPoint(touch.clientX, touch.clientY);
                            const horizontal = isHorizontalTabs();

                            if (targetEl) {
                                const targetTab = targetEl.closest('.tab-btn[data-module]');
                                if (targetTab && targetTab !== dragSrcTab.querySelector('.tab-btn')) {
                                    const rect = targetTab.getBoundingClientRect();
                                    const before = horizontal
                                        ? touch.clientX < rect.left + rect.width / 2
                                        : touch.clientY < rect.top + rect.height / 2;
                                    const targetWrapper = targetTab.closest('.custom-tab-wrapper') || targetTab;

                                    if (before) {
                                        targetWrapper.parentNode.insertBefore(dragSrcTab, targetWrapper);
                                    } else {
                                        targetWrapper.parentNode.insertBefore(dragSrcTab, targetWrapper.nextSibling);
                                    }

                                    // 强制基础卡片顺序
                                    let lastFixed = null;
                                    DEFAULT_LAYER_ORDER.forEach(moduleKey => {
                                        const btn = container.querySelector(`.tab-btn[data-module="${moduleKey}"]`);
                                        if (!btn) return;
                                        const bWrap = btn.closest('.custom-tab-wrapper') || btn;
                                        if (lastFixed && !(lastFixed.compareDocumentPosition(bWrap) & Node.DOCUMENT_POSITION_FOLLOWING)) {
                                            container.insertBefore(bWrap, lastFixed.nextSibling);
                                        }
                                        lastFixed = bWrap;
                                    });

                                    drawPreview();
                                }
                            }
                            dragSrcTab = null;
                        });
                    }

                    wrapper.addEventListener('dragover', (e) => {
                        if (!dragSrcTab || dragSrcTab === wrapper) return;
                        e.preventDefault();
                        e.dataTransfer.dropEffect = 'move';

                        const rect = wrapper.getBoundingClientRect();
                        const isAbove = (e.clientY - rect.top) < rect.height / 2;
                        
                        // 找到容器的所有有效卡片
                        const allTabs = Array.from(document.querySelectorAll('#moduleTabs .tab-btn[data-module]'));
                        const validTabs = allTabs.filter(el => el !== dragSrcTab && el !== dragSrcTab.querySelector('.tab-btn'));
                        const idx = validTabs.indexOf(tab);
                        
                        let lineY = 0;
                        if (isAbove) {
                            // 想插在前面：画在当前卡片上边缘，和上一张卡片下边缘的正中间
                            if (idx > 0) {
                                const prevRect = validTabs[idx - 1].getBoundingClientRect();
                                lineY = (prevRect.bottom + rect.top) / 2;
                            } else {
                                lineY = rect.top - 5;
                            }
                        } else {
                            // 想插在后面：画在当前卡片下边缘，和下一张卡片上边缘的正中间
                            if (idx < validTabs.length - 1) {
                                const nextRect = validTabs[idx + 1].getBoundingClientRect();
                                lineY = (rect.bottom + nextRect.top) / 2;
                            } else {
                                lineY = rect.bottom + 5;
                            }
                        }
                        
                        dragLine.style.display = 'block';
                        dragLine.style.top = (lineY + window.scrollY - 2) + 'px';
                        dragLine.style.left = rect.left + 'px'; /* 去掉 -28，让左边缘和按钮对齐 */
                    });

                    wrapper.addEventListener('dragleave', () => {
                        hideDragLine();
                    });

                    wrapper.addEventListener('drop', (e) => {
                        if (!dragSrcTab || dragSrcTab === wrapper) return;
                        e.preventDefault();
                        const container = wrapper.parentNode;
                        const rect = wrapper.getBoundingClientRect();
                        const isAbove = (e.clientY - rect.top) < rect.height / 2;

                        // 插入 DOM
                        if (isAbove) {
                            container.insertBefore(dragSrcTab, wrapper);
                        } else {
                            container.insertBefore(dragSrcTab, wrapper.nextSibling);
                        }

                        // 强制固定基础顺序
                        let lastFixed = null;
                        DEFAULT_LAYER_ORDER.forEach(moduleKey => {
                            const btn = container.querySelector(`.tab-btn[data-module="${moduleKey}"]`);
                            if (!btn) return;
                            const bWrap = btn.closest('.custom-tab-wrapper') || btn;
                            if (lastFixed && !(lastFixed.compareDocumentPosition(bWrap) & Node.DOCUMENT_POSITION_FOLLOWING)) {
                                container.insertBefore(bWrap, lastFixed.nextSibling);
                            }
                            lastFixed = bWrap;
                        });

                        hideDragLine();
                        drawPreview();
                    });
                });

                // 全局强制拦截：不论拖到哪里，只要越过首尾卡片中线，统统置顶或沉底
                document.addEventListener('dragover', (e) => {
                    if (!dragSrcTab) return;
                    
                    const allTabs = Array.from(container.querySelectorAll('.tab-btn[data-module]'));
                    const validTabs = allTabs.filter(el => el !== dragSrcTab && el !== dragSrcTab.querySelector('.tab-btn'));
                    if (validTabs.length === 0) return;

                    const firstTab = validTabs[0];
                    const lastTab = validTabs[validTabs.length - 1];
                    const firstRect = firstTab.getBoundingClientRect();
                    const lastRect = lastTab.getBoundingClientRect();
                    
                    // 1. 越过最后一张卡片中线 -> 沉底
                    if (e.clientY > lastRect.top + lastRect.height / 2) {
                        e.preventDefault();
                        e.dataTransfer.dropEffect = 'move';
                        dragLine.style.display = 'block';
                        dragLine.style.top = (lastRect.bottom + 5 + window.scrollY) + 'px';
                        
                        const lastWrapper = lastTab.closest('.custom-tab-wrapper') || lastTab;
                        dragLine.style.left = lastWrapper.getBoundingClientRect().left + 'px';
                    }
                    // 2. 越过第一张卡片中线 -> 置顶
                    else if (e.clientY < firstRect.top + firstRect.height / 2) {
                        e.preventDefault();
                        e.dataTransfer.dropEffect = 'move';
                        dragLine.style.display = 'block';
                        dragLine.style.top = (firstRect.top - 7 + window.scrollY) + 'px';
                        
                        const firstWrapper = firstTab.closest('.custom-tab-wrapper') || firstTab;
                        dragLine.style.left = firstWrapper.getBoundingClientRect().left + 'px';
                    }
                });

                document.addEventListener('drop', (e) => {
                    if (!dragSrcTab) return;
                    
                    const allTabs = Array.from(container.querySelectorAll('.tab-btn[data-module]'));
                    const validTabs = allTabs.filter(el => el !== dragSrcTab && el !== dragSrcTab.querySelector('.tab-btn'));
                    if (validTabs.length === 0) return;

                    const firstTab = validTabs[0];
                    const lastTab = validTabs[validTabs.length - 1];
                    const firstRect = firstTab.getBoundingClientRect();
                    const lastRect = lastTab.getBoundingClientRect();
                    
                    // 1. 如果在最后一张下方松手 -> 沉底
                    if (e.clientY > lastRect.top + lastRect.height / 2) {
                        e.preventDefault();
                        e.stopPropagation();
                        
                        container.appendChild(dragSrcTab);
                        
                        let lastFixed = null;
                        DEFAULT_LAYER_ORDER.forEach(moduleKey => {
                            const btn = container.querySelector(`.tab-btn[data-module="${moduleKey}"]`);
                            if (!btn) return;
                            const bWrap = btn.closest('.custom-tab-wrapper') || btn;
                            if (lastFixed && !(lastFixed.compareDocumentPosition(bWrap) & Node.DOCUMENT_POSITION_FOLLOWING)) {
                                container.insertBefore(bWrap, lastFixed.nextSibling);
                            }
                            lastFixed = bWrap;
                        });
                        
                        hideDragLine();
                        dragSrcTab = null; 
                        drawPreview();
                    }
                    // 2. 如果在第一张上方松手 -> 置顶
                    else if (e.clientY < firstRect.top + firstRect.height / 2) {
                        e.preventDefault();
                        e.stopPropagation();
                        
                        container.insertBefore(dragSrcTab, firstTab.closest('.custom-tab-wrapper') || firstTab);
                        
                        let lastFixed = null;
                        DEFAULT_LAYER_ORDER.forEach(moduleKey => {
                            const btn = container.querySelector(`.tab-btn[data-module="${moduleKey}"]`);
                            if (!btn) return;
                            const bWrap = btn.closest('.custom-tab-wrapper') || btn;
                            if (lastFixed && !(lastFixed.compareDocumentPosition(bWrap) & Node.DOCUMENT_POSITION_FOLLOWING)) {
                                container.insertBefore(bWrap, lastFixed.nextSibling);
                            }
                            lastFixed = bWrap;
                        });
                        
                        hideDragLine();
                        dragSrcTab = null;
                        drawPreview();
                    }
                });
            }
            // WU-35：手机端真实像素直出
            // 核心思路：盒子宽高都按画布真实像素比例计算，并把预览区实际需要的高度
            // 写进根节点的 --pv-h，让部件栏紧跟预览区底部，消除中间的大段空白
            function applyMobilePreviewScale() {
                const preview = document.querySelector('.preview');
                const row = document.querySelector('.preview-row');
                if (!preview || !row) return;

                // 可用空间：宽留 16px 安全距离；高以原 55vh 方案为上限，再扣掉上下边距
                const availW = preview.clientWidth - 16;
                // 与 syncVisibleViewportHeight 写入的 --vvh 用同一套高度，
                // 避免 iOS 地址栏伸缩时预览区和下方操作区错位
                const vvh = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--vvh'));
                const visibleH = (vvh > 0 && isFinite(vvh))
                    ? vvh
                    : (window.visualViewport ? window.visualViewport.height : window.innerHeight);
                const availH = visibleH * 0.55 - 74; /* 62顶栏 + 上下各6px间距 */
                if (availW <= 0 || availH <= 0) return;

                // 画布物理尺寸与比例（动态画布固定为原图三分之一列宽）
                const canvasW = canvas.width || 160;
                const canvasH = canvas.height || 192;
                const dynW = Math.floor(canvasW / 3);
                const mainRatio = canvasW / canvasH;
                const dynRatio = dynW / canvasH;

                // 先按高度预算反推盒子高度；总宽超出可用宽度时再按宽度反推
                const ROW_GAP = 8; // 与 .preview-row 的 gap 保持一致
                let boxH = availH;
                if (boxH * (mainRatio + dynRatio) + ROW_GAP > availW) {
                    boxH = (availW - ROW_GAP) / (mainRatio + dynRatio);
                }
                boxH = Math.floor(boxH);

                row.style.setProperty('--box-h', boxH + 'px');
                row.style.setProperty('--main-ratio', mainRatio);
                row.style.setProperty('--dyn-ratio', dynRatio);

                // 预览区内容高度 = 上边距 6px + 盒子高；6px 下间距由 CSS 的 height calc 补齐
                const previewH = 6 + boxH;
                document.documentElement.style.setProperty('--pv-h', previewH + 'px');
            }


            // 按窗口宽、高共同缩放，取能完整放下的最小比例；最小 0.5 防止字小到看不清
            function applyResponsiveScale() {
                const outer = document.querySelector('.app-outer');
                if (!outer) return;
                
                // 如果是手机屏幕尺寸（<= 768px），直接调用像素计算
                if (window.innerWidth <= 768) {
                    outer.style.transform = 'none';
                    const scaler = outer.parentElement;
                    if (scaler) {
                        scaler.style.width = '100%';
                        scaler.style.height = '100%';
                    }
                    // 使用 requestAnimationFrame 确保容器布局完成后再算
                    requestAnimationFrame(applyMobilePreviewScale);
                    return;
                }

                const scaler = outer.parentElement;
                const titleEl = document.querySelector('.page-title');
                const footerEl = document.querySelector('.page-footer');
                // 先还原，量出设计尺寸
                outer.style.transform = 'none';
                const designWidth = outer.scrollWidth;
                const designHeight = outer.scrollHeight;
                // 页面顶部标题与底部署名占用的高度，也必须从可用高度里扣掉
                const titleH = titleEl ? titleEl.offsetHeight + 24 : 0;
                const footerH = footerEl ? footerEl.offsetHeight + 24 : 0;
                // 多留 32px 安全边距，避免不同系统滚动条或边框把边缘吃掉
                const availW = window.innerWidth - 32;
                const availH = window.innerHeight - titleH - footerH - 32;
                if (designWidth <= 0 || designHeight <= 0 || availH <= 0) return;
                const scaleW = availW / designWidth;
                const scaleH = availH / designHeight;
                const scale = Math.min(1, Math.max(0.45, Math.min(scaleW, scaleH)));
                outer.style.transform = `scale(${scale})`;
                outer.style.transformOrigin = 'top center';
                // 同步设置包装容器占位，避免缩小后留白不对称、边缘被吞
                if (scaler) {
                    scaler.style.width = (designWidth * scale) + 'px';
                    scaler.style.height = (designHeight * scale) + 'px';
                    scaler.style.margin = '0 auto';
                }

                // 【新增】动态限制左侧滚动区域（仅在 PC 端需要，手机端已经改成横向且自然滑动）
                const appEl = document.querySelector('.app');
                const tabsEl = document.getElementById('moduleTabs');
                const bottomFloat = document.getElementById('tabsBottomFloat');
                if (appEl && tabsEl && bottomFloat && window.innerWidth > 768) {
                    // 计算底部按钮占用的真实高度（包括 margin 和 padding）
                    const floatHeight = bottomFloat.offsetHeight + 30; 
                    // 将左侧列表的最大高度，限制在 大框高度减去 悬浮按钮高度
                    tabsEl.style.maxHeight = (appEl.offsetHeight - floatHeight) + 'px';
                }
            }

            window.addEventListener('resize', () => {
                if (window.innerWidth <= 768) {
                    applyMobilePreviewScale();
                } else {
                    applyResponsiveScale();
                }
            });

            // 手机浏览器底部地址栏会盖住页面底部：100vh 是"地址栏收起时"的高度，用它算容器高度
            // 会让操作区底部的按钮沉到地址栏后面。这里把"当前真正看得见的高度"写进 --vvh，
            // CSS 用它代替 100vh，地址栏出现时容器自动变矮，按钮不会再被压住。
            let rafIdVvh = 0;
            function syncVisibleViewportHeight() {
                cancelAnimationFrame(rafIdVvh);
                rafIdVvh = requestAnimationFrame(() => {
                    const vv = window.visualViewport;
                    const visibleH = vv ? vv.height : window.innerHeight;
                    // 键盘弹出时可视高度会骤降，此时保持原值，避免整屏被压扁
                    if (visibleH < window.innerHeight * 0.75) return;
                    document.documentElement.style.setProperty('--vvh', Math.round(visibleH) + 'px');
                });
            }

            syncVisibleViewportHeight();
            window.addEventListener('resize', syncVisibleViewportHeight);
            window.addEventListener('orientationchange', syncVisibleViewportHeight);
            if (window.visualViewport) {
                // iOS 地址栏在滚动中收缩/展开只会触发 visualViewport 的事件，不会触发 window resize
                window.visualViewport.addEventListener('resize', syncVisibleViewportHeight);
                window.visualViewport.addEventListener('scroll', syncVisibleViewportHeight);
            }

            // 全局点击隐藏右键菜单
            document.addEventListener('click', (e) => {
                const menu = document.getElementById('contextMenu');
                if (menu && menu.classList.contains('show') && e.target !== document.getElementById('menuEditBtn')) {
                    menu.classList.remove('show');
                    // 修复：菜单消失时兜底复位拖拽态，防止「点菜单外区域后卡在拖拽状态」
                    if (typeof resetTabDragState === 'function') resetTabDragState();
                }
            });
            // 缩放窗口时隐藏右键菜单
            window.addEventListener('resize', () => {
                const menu = document.getElementById('contextMenu');
                if (menu) menu.classList.remove('show');
            });

            // 屏蔽页面右键菜单，输入框和文本域除外，保证输入时仍可粘贴/复制
            document.addEventListener('contextmenu', (e) => {
                const tag = (e.target && e.target.tagName) ? e.target.tagName.toLowerCase() : '';
                if (tag === 'input' || tag === 'textarea') return;
                e.preventDefault();
            });

            function init() {
                applyCanvasSize(baseWidth, baseHeight);
                tabs.forEach(tab => {
                    tab.addEventListener('click', () => {
                        if (tab.dataset.module) {
                            setActiveModule(tab.dataset.module);
                        }
                    });

                    // 拦截默认部件的右键（电脑）
                    tab.addEventListener('contextmenu', (e) => {
                        if (!tab.classList.contains('custom-module')) {
                            e.preventDefault();
                            e.stopPropagation();
                            showProtectTip(tab);
                        }
                    });

                    // 鼠标离开时，立即移除提示
                    tab.addEventListener('mouseleave', () => {
                        tab.classList.remove('show-protect-tip');
                        tab.style.removeProperty('--tip-content');
                        hideProtectTip();
                    });

                    // 拦截默认部件的长按（手机）
                    let protectTimer = null;
                    tab.addEventListener('touchstart', (e) => {
                        if (!tab.classList.contains('custom-module')) {
                            protectTimer = setTimeout(() => {
                                showProtectTip(tab);
                                if (navigator.vibrate) navigator.vibrate(50);
                            }, 600);
                        }
                    });
                    
                    // 手指抬起或滑动时，清除定时器并移除提示
                    const hideTouchTip = () => {
                        clearTimeout(protectTimer);
                        tab.classList.remove('show-protect-tip');
                        tab.style.removeProperty('--tip-content');
                        hideProtectTip();
                    };
                    tab.addEventListener('touchend', hideTouchTip);
                    tab.addEventListener('touchmove', hideTouchTip);
                });
                
                // 保护提示统一走外层 showTabTip/hideTabTip（#globalTooltip：最高层级 + 按钮下方），
                // 与“拖拽锁定”提示共用同一入口，通过 type 隔离，互不误隐藏。
                function showProtectTip(el) {
                    showTabTip(el, '🔒 默认部件不可重命名和删除', 'protect', 2500);
                }
                function hideProtectTip() {
                    hideTabTip('protect');
                }
                
                setupTabDrag();
                // 初始化第一个角色数据（作为初始占位，分发包加载时会覆盖掉）
                characters = [{
                    name: '审神者',
                    selected: { papa: null, hat: null, accessory: null, frontHair: null, face: null, coat: null, clothes: null, body: null, backHair: null },
                    colorData: {
                        papa: { tint: '#ffffff', hue: 0, sat: 100, bri: 100 },
                        hat: { tint: '#ffffff', hue: 0, sat: 100, bri: 100 },
                        accessory: { tint: '#ffffff', hue: 0, sat: 100, bri: 100 },
                        ear: { tint: '#ffffff', hue: 0, sat: 100, bri: 100 },
                        frontHair: { tint: '#ffffff', hue: 0, sat: 100, bri: 100 },
                        backHair: { tint: '#ffffff', hue: 0, sat: 100, bri: 100 },
                        face: { tint: '#ffffff', hue: 0, sat: 100, bri: 100 },
                        coat: { tint: '#ffffff', hue: 0, sat: 100, bri: 100 },
                        clothes: { tint: '#ffffff', hue: 0, sat: 100, bri: 100 },
                        body: { tint: '#ffffff', hue: 0, sat: 100, bri: 100 }
                    }
                }];
                activeCharIndex = 0;
                
                renderCharacterTabs();
                // 自动获取左侧排在最前面的部件，并将其设为激活状态
                const firstTab = document.querySelector('#moduleTabs .tab-btn[data-module]');
                if (firstTab) {
                    setActiveModule(firstTab.dataset.module);
                } else {
                    setActiveModule('accessory');
                }
                renderOptionsPanel();
                drawPreview();
                startDynPreview();
                applyResponsiveScale();
                loadInjectedAssets();

                // 删除了这里残留的旧版手机提示，统一由底部的合并弹窗处理

                // 监听内容尺寸变化，自动重新计算缩放比例，避免导入素材后界面错乱
                if (window.ResizeObserver) {
                    const ro = new ResizeObserver(() => {
                        applyResponsiveScale();
                    });
                    ro.observe(document.querySelector('.app'));
                }
            }

            // 全局暴露一个复制方法，供弹窗里的动态按钮调用
            window.copyKeyText = function(key) {
                // 封装一个通用的深色提示函数
                const showSuccess = () => {
                    // 隐藏弹窗里不需要的元素
                    document.getElementById('codeInputWrap').style.display = 'none';
                    document.getElementById('pureModeCheckWrap').style.display = 'none';
                    document.getElementById('exportOptionsWrap').style.display = 'none';
                    
                    // 隐藏取消按钮，变成单确定按钮的提示框
                    document.getElementById('confirmCancel').style.display = 'none';
                    
                    showConfirm(`【${escapeHtml(key)}】 已复制到剪贴板！`, () => {
                        document.getElementById('confirmModal').classList.remove('show');
                        // 恢复取消按钮的显示，以免影响其他弹窗
                        document.getElementById('confirmCancel').style.display = 'block';
                    }, () => {});
                };

                copyText(key).then(() => {
                    showSuccess();
                }).catch(err => {
                    // 兼容部分不支持的安全环境，老办法复制
                    const textarea = document.createElement('textarea');
                    textarea.value = key;
                    document.body.appendChild(textarea);
                    textarea.select();
                    document.execCommand('copy');
                    document.body.removeChild(textarea);
                    showSuccess();
                });
            };

            // ===== 全局悬浮提示框逻辑 =====
            const globalTooltip = document.getElementById('globalTooltip');
            
            function bindTooltip(elementId, text) {
                const el = document.getElementById(elementId);
                if (!el || !globalTooltip) return;

                el.addEventListener('mouseenter', (e) => {
                    globalTooltip.textContent = text;
                    globalTooltip.style.display = 'block';
                    
                    // 获取按钮位置，将提示框定在按钮正下方
                    const rect = el.getBoundingClientRect();
                    // 水平居中：按钮中心点 X 坐标
                    const centerX = rect.left + rect.width / 2;
                    globalTooltip.style.left = centerX + 'px';
                    globalTooltip.style.top = (rect.bottom + 8) + 'px';
                    
                    // 等浏览器渲染出 display: block 后，再加 show 类触发动画
                    requestAnimationFrame(() => {
                        globalTooltip.classList.add('show');
                    });
                });

                el.addEventListener('mouseleave', () => {
                    globalTooltip.classList.remove('show');
                    // 等动画结束（0.2秒）后彻底隐藏
                    setTimeout(() => {
                        if (!globalTooltip.classList.contains('show')) {
                            globalTooltip.style.display = 'none';
                        }
                    }, 200);
                });
            }

            bindTooltip('exportBodyBtn', '单独导出当前选择的素体');
            // 导入素材的提示已删除

            init();

            // ===== 离开页面二级确认 =====
            // 关闭/刷新/地址栏跳转：beforeunload 原生确认（浏览器唯一可靠的拦截手段）
            // 浏览器后退：压哨兵历史把「后退」转成 popstate，弹应用内确认框拦下来
            (function setupLeaveGuard() {
                const modal = document.getElementById('leaveConfirmModal');
                const okBtn = document.getElementById('leaveOk');
                const cancelBtn = document.getElementById('leaveCancel');
                if (!modal || !okBtn || !cancelBtn) return;

                let leaveConfirmed = false;

                window.addEventListener('beforeunload', (e) => {
                    if (leaveConfirmed) return;
                    e.preventDefault();
                    e.returnValue = '';
                });

                // 压入哨兵，确保第一次「后退」落在 popstate 而不是直接离开
                try { history.pushState({ __leaveGuard: true }, ''); } catch (_) {}

                window.addEventListener('popstate', () => {
                    if (leaveConfirmed) return;
                    try { history.pushState({ __leaveGuard: true }, ''); } catch (_) {}
                    modal.classList.add('show');
                });

                const closeModal = () => modal.classList.remove('show');
                cancelBtn.addEventListener('click', closeModal);
                modal.addEventListener('click', (e) => {
                    if (e.target === modal) closeModal();
                });

                okBtn.addEventListener('click', () => {
                    leaveConfirmed = true;
                    closeModal();
                    // 放行这一次后退，让浏览器真正离开
                    try { history.back(); } catch (_) {}
                });
            })();

            // 每次打开网页都弹出提示（测试用，去掉了 localStorage 缓存判断）
            setTimeout(() => {
                const isMobile = window.innerWidth <= 768;
                
                // 强制关闭可能还在转场的旧弹窗
                document.getElementById('confirmModal').classList.remove('show');

                const modalTitle = document.querySelector('#confirmModal .modal-title');
                if (modalTitle) modalTitle.style.display = 'none';
                document.getElementById('confirmCancel').style.display = 'none';
                
                // 核心修复：强制隐藏打包时用的纯净模式勾选框
                const checkWrap = document.getElementById('pureModeCheckWrap');
                if (checkWrap) checkWrap.style.display = 'none';

                const okBtn = document.getElementById('confirmOk');
                if (okBtn) {
                    okBtn.style.flex = '0 0 160px';
                    okBtn.style.margin = '0 auto';
                }
                const btnWrap = document.querySelector('#confirmModal .confirm-actions');
                if (btnWrap) {
                    btnWrap.style.justifyContent = 'center';
                }

                let msg = '<div style="text-align: left; font-size: 13px; line-height: 1.6; color: #b7b7d0; padding: 0 5px;">';

                // 1. 手机端阉割警告（前置）
                if (isMobile) {
                    msg += `
                        <div style="color: #d4b872; font-weight: 600; margin-bottom: 8px; font-size: 14px;">手机端注意事项：</div>
                        <div style="color: #d4b872; margin-bottom: 10px;">IOS和鸿蒙系统暂时无法正常使用调色功能（或许还有其他系统但暂时没有bug反馈）。</div>
                        <div style="color: #d4b872; margin-bottom: 10px;">且出于排版的考量，手机版阉割掉了一些支持自主上传素材的功能，如果想完整体验，请尽量在PC端使用本网页。</div>
                    `;
                    // 手机端加一条分割线
                    msg += '<div style="height: 1px; background: rgba(255,255,255,0.1); margin: 15px 0;"></div>'; 
                }

                // 2. 使用规约
                msg += `
                    <div style="color: #e5e5ff; font-weight: 600; margin-bottom: 8px; font-size: 14px;">使用规约：</div>
                    <div style="margin-bottom: 10px; color: #b7b7d0;">本网站所使用的所有行走图素材均为本人绘制，主要目的是让不会绘制像素行走图的同事也能在【刀剑乱舞线上only】中定制一套比较个性化的入场行走图。</div>
                    <div style="color: #ff8f8f; margin-bottom: 10px; font-weight: 600;">禁止任何形式的商用，也不可以用来印刷物料。</div>
                    <div style="margin-bottom: 10px; color: #b7b7d0;">可以在制作同人游戏时使用，需要保留署名并且向我报备一下。</div>
                `;

                msg += '</div>';

                showConfirm(msg, () => {
                    document.getElementById('confirmModal').classList.remove('show');
                    
                    // 恢复弹窗默认样式
                    if (modalTitle) {
                        modalTitle.style.display = 'block';
                        modalTitle.textContent = '提示';
                    }
                    document.getElementById('confirmCancel').style.display = 'block';
                    if (okBtn) {
                        okBtn.style.flex = '';
                        okBtn.style.margin = '';
                    }
                    if (btnWrap) {
                        btnWrap.style.justifyContent = '';
                    }
                }, () => {});
                
            }, 500);
        })();
    </script></body></html>
